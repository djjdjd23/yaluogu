      html += '<div style="font-size:11px;color:#8a755c;font-family:var(--sans);letter-spacing:.1em;margin-bottom:4px">天赋</div>';
      html += tals.map(t => '<div style="font-size:12.5px;margin-bottom:3px">' +
        '<span style="color:#a8823c">·</span> ' + t.name +
        ' <span style="font-size:10.5px;color:#8a755c">' + P.LVL_NAME[t.lvl] + '</span>' +

    kv('金币', W.moneyShort(S.copper)) +
    kv('存粮', Math.round(S.food) + ' 石') +
    kv('木材', W.coarse(S.wood) + '（' + Math.round(S.wood) + '）') +
    kv('石头', W.coarse(S.stone) + '（' + Math.round(S.stone) + '）') +
    kv('铁', W.coarse(S.iron) + '（' + Math.round(S.iron) + '）') +
    kv('耕地', S.fields + ' 亩') +
    kv('阶段', W.STAGES[S.stage]) +
    kv('月耗粮', Math.round(E.foodNeed()) + ' 石') +
    (S.buildings.ranch
      ? kv('牲畜', '鸡 ' + S.animals.chicken + (S.animals.chick ? '＋雏' + S.animals.chick : '') +
          ' · 羊 ' + S.animals.sheep + ' · 牛 ' + S.animals.cow) +
        kv('畜产', '蛋 ' + Math.floor(S.goods.egg) + ' · 毛 ' + Math.floor(S.goods.wool) +
          ' · 奶 ' + Math.floor(S.goods.milk))

      ? kv('布料', '布 ' + Math.floor(S.goods.cloth) + ' · 冬衣 ' + Math.floor(S.goods.clothes))
      : '') +

      const a = E.armyStats();
      return a.n + ' / ' + a.cap + '　战力 ' + a.power.toFixed(1);
    })()) +
    kv('操练度', (S.troopDrill || 0) + '　·　兵器 ' + Math.round(S.weapons || 0) + ' 件') +
    kv('建筑', bnames.length ? bnames.join('、') : '只有一座塌庄园');

  if (!S.npcs.length) {
    nb.innerHTML = '<div class="empty">还没有认识的人。</div>';
  } else {
    nb.innerHTML = '';
    const list = S.npcs.slice().sort((a, b) => {
      if (!!a.gone !== !!b.gone) return a.gone ? 1 : -1;
      if (a.here !== b.here) return a.here ? -1 : 1;
      if (a.rel.aff !== b.rel.aff) return b.rel.aff - a.rel.aff;
      return (b.lastSeen || 0) - (a.lastSeen || 0);
    });

    if (list.length > 10) {

  }).join('');

  // 待办（先列有期限的）
  const tb = $('body-todo');
  const dl = (S.deadlines || []).filter(d => !d.done && !d.auto)
    .map(d => ({ d: d, left: E.daysLeft(d) }))

    tb.innerHTML = '<div class="empty">暂时没有悬着的事。</div>';

      tb.appendChild(row);

  const lb = $('body-log');
  if (!S.log.length) lb.innerHTML = '<div class="empty">还没有什么值得记下的事。</div>';

UI.npcCard = function (n, open) {
  const box = el('div', 'npc' + (open ? ' open' : ''));
  const aff = n.rel.aff;
  const inP = E.inParty(n);
  let badge = '';
  if (n.spouse) badge = '<span style="color:#8a3324">伴侣</span>';
  else if (n.confessed) badge = '<span style="color:#9a7434">已表白</span>';

  let html = '<div class="name"><b' + (n.gone ? ' style="color:#8a755c"' : '') + '>' + esc(n.name) + '</b><i>' + esc(n.role) + '</i>' +
    '<span class="aff">' + (n.gone ? '已离开' : (inP ? '队中 · ' : '') + E.relStage(aff) + ' ' + aff) + '</span></div>';
  html += '<div class="detail">';
  html += '<div class="row"><span class="k">种族</span><span class="v">' + n.race + ' · ' + n.age + ' 岁 · ' + n.temperName + '</span></div>';
  html += '<div class="row"><span class="k">外貌</span><span class="v">' + esc(shortLook(n)) + '</span></div>';
  html += '<div class="row"><span class="k">目标</span><span class="v">' + esc(n.goal) + '</span></div>';
  html += '<div class="row"><span class="k">弱点</span><span class="v">' + esc(n.secret) + '</span></div>';
  if (n.isResident) html += '<div class="row"><span class="k">身份</span><span class="v">鸦落谷的人</span></div>';
  if (badge) html += '<div class="row"><span class="k">关系</span><span class="v">' + badge + '</span></div>';

  html += '<div class="rel">' +
    relBar('好感', n.rel.aff, '') +
    (n.isResident ? relBar('忠诚', n.rel.loy, '') : '') +
    '</div>';

  if (n.talents && n.talents.length) {
    html += '<div class="row" style="margin-top:7px"><span class="k">天赋</span><span class="v">' +
      n.talents.map(tid => {
        const t = N.NPC_TALENTS.find(x => x.id === tid);
        return t ? t.name + '<span style="color:#8a755c;font-size:10.5px">（' + t.desc + '）</span>' : '';
      }).filter(Boolean).join('<br>') + '</span></div>';
  }

  const gs = E.gearItems(n.gear);
  if (gs.length) {
    html += '<div class="npc-gear"><span>身上</span> ' +
      gs.map(g => '<b class="g-lv' + g.lvl + '" style="font-weight:400">' + esc(g.name) + '</b>').join('、') +
      '</div>';
  }

  if (!n.gone) {
    if (inP) {
      html += '<button class="npc-btn" data-p="' + n.id + '">让她离队</button>';
    } else if (E.canInvite(n)) {
      html += '<button class="npc-btn on" data-p="' + n.id + '">邀她入队</button>';
    }
    // 队里的人才能换装：她穿的东西，判定时算一半
    if (inP) html += '<button class="npc-btn" data-npcgear="' + n.id + '">给她换装</button>';
  }

  if (n.thought) html += '<div class="thought">「' + esc(n.thought) + '」</div>';
  html += '</div>';
  box.innerHTML = html;
  box.querySelector('.name').onclick = () => box.classList.toggle('open');
  const pb = box.querySelector('[data-p]');
  if (pb) pb.onclick = (ev) => { ev.stopPropagation(); E.toggleParty(pb.dataset.p); };
  const gb = box.querySelector('[data-npcgear]');
  if (gb) gb.onclick = (ev) => { ev.stopPropagation(); UI.showNpcGear(gb.dataset.npcgear); };
  return box;
};

/* ---------- 数量输入 ---------- */

UI.askNumber = function (opt) {
  const min = opt.min == null ? 1 : opt.min;
  const max = opt.max == null ? 999 : opt.max;
  let v = Math.max(min, Math.min(max, opt.def == null ? min : opt.def));
  const step = opt.step || 1;
  const unit = opt.unit || '';

  const mask = document.createElement('div');
  mask.className = 'qty-mask';
  mask.innerHTML =
    '<div class=qty-box>' +
      '<h3>' + esc(opt.title || '要多少') + '</h3>' +
      '<div class=qh>' + esc(opt.hint || '') + '</div>' +
      '<div class=qty-line>' +
        '<button data-d=- + (step * 5) + >−</button>' +
        '<button data-d=- + step + >−</button>' +
        '<input type=text inputmode=numeric value= + v + >' +
        '<button data-d= + step + >＋</button>' +
        '<button data-d= + (step * 5) + >＋</button>' +
      '</div>' +
      '<div class=qty-total></div>' +
      '<div class=qty-row>' +
        '<button class=btn-ghost data-x=1>取消</button>' +
        '<button class=btn-main data-ok=1 style=margin-top:0>确定</button>' +
      '</div>' +
    '</div>';

  document.body.appendChild(mask);
  const inp = mask.querySelector('input');
  const tot = mask.querySelector('.qty-total');

  const clampV = () => {
    v = Math.max(min, Math.min(max, Math.round(v) || min));
    inp.value = v;
    tot.textContent = opt.totalText ? opt.totalText(v) : '';
    mask.querySelectorAll('[data-ok]')[0].disabled = (opt.canOk && !opt.canOk(v));
  };
  clampV();

  mask.querySelectorAll('[data-d]').forEach(b => {
    b.onclick = () => { v += parseInt(b.dataset.d, 10); clampV(); };
  });
  mask.querySelectorAll('[data-d]').forEach(b => {
    const d = parseInt(b.dataset.d, 10);
    b.disabled = d < 0 ? v <= min : v >= max;
  });
  inp.oninput = () => {
    const n = parseInt(inp.value.replace(/\D/g, ''), 10);
    v = isNaN(n) ? min : n;
    clampV();
  };
  mask.querySelector('[data-x]').onclick = () => mask.remove();
  mask.querySelector('[data-ok]').onclick = () => {
    mask.remove();
    opt.onOk(v);
  };
  setTimeout(() => inp.focus(), 30);
};

/* 封面画：全部矢量，单文件里不需要任何外部图片。
   宽屏用 1200x800 构图；窄屏（手机竖屏）改用 600x1000 的竖版构图，
   否则 preserveAspectRatio slice 会把月亮和庄园裁到画面外。 */
UI.titleArt = function () {
  const portrait = (typeof window !== 'undefined' && window.innerWidth <= 620);
  if (portrait) return titleArtPortrait();
  return titleArtWide();
};

function titleArtWide() {

  el.innerHTML =
    UI.titleArt() +
    '<div class="veil"></div>' +
    '<div class="inner">' +
      '<div class="eyebrow">塞兰王国 · 北境</div>' +

      '<div class="rule"></div>' +

      '<div class="btns">' +
        '<button class="t-btn primary" id="t-new">开 始 游 戏</button>' +
        '<button class="t-btn" id="t-load"' + (E.anySave() ? '' : ' disabled') + '>读 取 存 档</button>' +
        '<button class="t-btn" id="t-about">关 于 此 地</button>' +
      '</div>' +

    // 单文件版离线可玩，线上版靠网络加载，措辞两边都说得通
    '<div class="foot">文字游戏 · 存档存在本机</div>';

  document.body.appendChild(el);

  const n = document.getElementById('t-new');
  if (n) n.onclick = () => UI.showSlots('new');
  const l = document.getElementById('t-load');
  if (l && !l.disabled) l.onclick = () => UI.showSlots('load');
  const a = document.getElementById('t-about');
  if (a) a.onclick = () => UI.showIntro();
};

UI.leaveTitle = function () {
  const t = document.getElementById('title');
  if (t) t.remove();
};

UI.showSlots = function (mode) {
  const wrap = document.getElementById('title');
  if (!wrap) return;
  const inner = wrap.querySelector('.inner');
  if (!inner) return;

  const infos = E.SLOTS.map(n => E.slotInfo(n));
  const cards = infos.map(it => {
    if (it.empty) {
      return '<div class="slot void" data-n="' + it.n + '">' +
        '<div class="no">第 ' + it.n + ' 槽</div>' +
        '<div><div class="nm">空</div><div class="meta">' +
        (mode === 'new' ? '从这里开始一个新的故事' : '这里还没有存档') +
        '</div></div>' +
        '<div></div></div>';
    }
    return '<div class="slot" data-n="' + it.n + '">' +
      '<div class="no">第 ' + it.n + ' 槽</div>' +
      '<div><div class="nm">' + esc(it.name) + '</div>' +
      '<div class="meta">' + E.summaryText(it) + '</div></div>' +
      '<div class="del" data-del="' + it.n + '">删除</div></div>';
  }).join('');

  inner.innerHTML =
    '<div class="slots">' +
      '<h2>' + (mode === 'new' ? '选 一 个 存 档' : '读 取 存 档') + '</h2>' +
      '<div class="sp-sub">' + (mode === 'new'
        ? '选中的槽会存下这一局的全部进度，每十五天自动存一次'
        : '选一个接着玩') + '</div>' +
      cards +
      '<div class="tip-row">' +
        '<span class="back" id="sp-back">← 回到封面</span>' +
        '<span>' + (mode === 'new' ? '已有存档的槽会被覆盖' : '') + '</span>' +
      '</div>' +
    '</div>';

  document.getElementById('sp-back').onclick = () => UI.showTitle();

  inner.querySelectorAll('.slot').forEach(s => {
    s.onclick = () => {
      const n = parseInt(s.dataset.n, 10);
      const info = E.slotInfo(n);
      if (mode === 'new') {
        if (!info.empty && !confirm('第 ' + n + ' 槽已经有存档了。\n覆盖之后，原来那一局就没了。继续？')) return;
        E.reset(n);
        E.slot = n;
        UI.showCreate(n);
      } else {
        if (info.empty) { UI.toast('这个槽是空的'); return; }
        continueGame(n);
      }
    };
  });

  inner.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const n = parseInt(b.dataset.del, 10);
      if (!confirm('删除第 ' + n + ' 槽的存档？删了找不回来。')) return;
      E.reset(n);
      UI.showSlots(mode);
    };
  });
};

      '<b>判定</b>　结果 =（准备 + 威望 + 属性 + 天赋 + 资源投入）−（难度 + 抵触）。分大成功、成功、部分成功、失败四档，右上角标出用的是哪项属性。十次里总有两三次不顺。<br><br>' +

      '<b>养殖</b>　建养殖场得 4 鸡 2 羊 1 牛。鸡下蛋（可卖、可换粮、放着会孵出小鸡），羊出毛，牛出奶。畜产与存粮分开记账。<br><br>' +
      '<b>纺织与过冬</b>　羊毛 →（织布坊）布 →（织布坊）冬衣。冬天每人要半件冬衣，不够会冻死人。也可以直接去集市买现成的。<br><br>' +
      '<b>天赋</b>　开局抽五选三，可以重抽三次；锁住一张，重抽时它不会被换掉。<br><br>' +
      '<b>兵</b>　点「军务」：花钱招募、操练涨操练度、铁匠炉用铁打兵器。兵员不得超过人口的三分之一；兵营不招人，只让兵练得更精（单兵战力 +0.35，每月操练度自然上升）。弹道栏里的「战力」＝兵员 × 单兵战力。<br><br>' +

      '<b>小教堂</b>　里面有自己的事可做：与薇拉说话、听她讲经、帮她收拾、做礼拜（涨民心）、一个人坐一会儿。偶尔也会撞上别的事——办完还留在教堂，不用重新进。<br><br>' +
      '<b>期限</b>　过桥税、长河城秋税、入冬储粮都有到期日，右侧待办栏显示还剩几天。缺钱可以找誓约公证所借。<br><br>' +

};

/* ---------- 行囊与装备 ---------- */

UI.showGear = function () {
  const S = E.state();
  const g = S.player.gear;
  const bag = S.player.bag || [];

  const slotRow = (id, idx, label) => {
    const itemId = id === 'trinket' ? (g.trinkets || [])[idx] : g[id];
    const it = itemId ? GEAR.MAP[itemId] : null;
    return '<div class="gear-line" data-slot="' + id + '" data-idx="' + idx + '">' +
      '<div class="gs">' + label + '</div>' +
      '<div class="gi">' +
        (it
          ? '<div class="gn g-lv' + it.lvl + '">' + esc(it.name) + '</div>' +
            '<div class="gd">' + GEAR.statText(it) + '</div>'
          : '<div class="gn empty">空</div><div class="gd">' + (id === 'trinket' ? '还没有东西可带' : '还没有可用的') + '</div>') +
      '</div>' +
      (it ? '<button class="gx" data-off="' + id + ':' + idx + '">卸下</button>' : '<div></div>') +
      '</div>';
  };

  const sum = GEAR.summary(g);
  const sumTxt = Object.keys(sum).length
    ? Object.keys(sum).map(k => (GEAR.ATTR_NAME[k] || GEAR.EFF_NAME[k] || k) + ' +' + sum[k]).join(' · ')
    : '身上还是空的';

  const bagHtml = bag.length
    ? bag.map((id, i) => {
        const it = GEAR.MAP[id];
        if (!it) return '';
        return '<div class="bag-line">' +
          '<div class="gi">' +
            '<div class="gn g-lv' + it.lvl + '">' + esc(it.name) +
              '<span class="gt">' + GEAR.SLOT_NAME[it.slot] + ' · ' + GEAR.LVL_NAME[it.lvl] + '</span></div>' +
            '<div class="gd">' + GEAR.statText(it) + '　' + esc(it.desc) + '</div>' +
          '</div>' +
          '<button class="gw" data-wear="' + i + '">装备</button></div>';
      }).join('')
    : '<div class="empty" style="padding:6px 0">包里是空的。商会街的珍品、讨伐魔物营地，都能弄到东西。</div>';

  const html =
    '<h1 style="font-size:21px;letter-spacing:.3em">行 囊</h1>' +
    '<div class="sub">' + esc(S.player.name) + ' · ' + sumTxt + '</div>' +
    '<div class="rule"></div>' +
    '<div class="gear-block">' +
      slotRow('weapon', 0, '武器') +
      slotRow('armor', 0, '护甲') +
      slotRow('mount', 0, '坐骑') +
      slotRow('trinket', 0, '饰品一') +
      slotRow('trinket', 1, '饰品二') +
      slotRow('trinket', 2, '饰品三') +
    '</div>' +
    '<div class="bag-head">包里的东西 <span>' + bag.length + ' 件</span></div>' +
    '<div class="bag-block">' + bagHtml + '</div>' +
    '<div class="row-btns"><button class="btn-ghost" id="g-close">收起</button></div>';

  UI.overlay(html);
  $('overlay').querySelector('.sheet').classList.add('wide');
  $('g-close').onclick = () => UI.showMenu();

  $('overlay').querySelectorAll('[data-off]').forEach(b => {
    b.onclick = () => {
      const [slot, idx] = b.dataset.off.split(':');
      E.unequip(slot, parseInt(idx, 10));
      UI.showGear();
    };
  });
  $('overlay').querySelectorAll('[data-wear]').forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.dataset.wear, 10);
      const id = (S.player.bag || [])[i];
      if (!id) return;
      E.equipAuto(id);
      UI.showGear();
    };
  });
};

/* ---------- 给队友换装 ---------- */

UI.showNpcGear = function (npcId) {
  const S = E.state();
  const n = S.npcs.find(x => x.id === npcId);
  if (!n) { UI.toast('找不到这个人'); return; }
  const bag = S.player.bag || [];
  const g = n.gear || {};

  const slotRow = (slot, idx, label) => {
    const id = E.npcGearSlot(n, slot, idx);
    const it = id ? GEAR.MAP[id] : null;
    return '<div class="gear-line">' +
      '<div class="gs">' + label + '</div>' +
      '<div class="gi">' +
        (it
          ? '<div class="gn g-lv' + it.lvl + '">' + esc(it.name) + '</div>' +
            '<div class="gd">' + GEAR.statText(it) + '</div>'
          : '<div class="gn empty">空</div><div class="gd">还没给她什么</div>') +
      '</div>' +
      (it ? '<button class="gx" data-noff="' + slot + ':' + idx + '">收回</button>' : '<div></div>') +
      '</div>';
  };

  /* 行囊里能穿到这一格的东西 */
  const fits = slot => bag.map((id, i) => ({ id: id, i: i, it: GEAR.MAP[id] }))
    .filter(x => x.it && x.it.slot === slot);

  const pickRow = (slot, idx, label) => {
    const list = fits(slot);
    if (!list.length) return '';
    return '<div class="npc-pick">' +
      '<div class="np">' + label + '</div>' +
      list.map(x => '<button class="pk" data-nwear="' + x.i + ':' + slot + ':' + idx + '">' +
        '<span class="g-lv' + x.it.lvl + '">' + esc(x.it.name) + '</span>' +
        '<i>' + GEAR.statText(x.it) + '</i></button>').join('') +
      '</div>';
  };

  const sum = GEAR.summary(g);
  const sumTxt = Object.keys(sum).length
    ? Object.keys(sum).map(k => (GEAR.ATTR_NAME[k] || GEAR.EFF_NAME[k] || k) + ' +' + sum[k]).join(' · ') + '（判定时折半）'
    : '身上还是空的';

  const html =
    '<h1 style="font-size:21px;letter-spacing:.3em">给 ' + esc(n.name) + ' 换 装</h1>' +
    '<div class="sub">' + esc(n.role) + ' · ' + sumTxt + '</div>' +
    '<div class="rule"></div>' +
    '<div class="gear-block">' +
      slotRow('weapon', 0, '武器') +
      slotRow('armor', 0, '护甲') +
      slotRow('mount', 0, '坐骑') +
      slotRow('trinket', 0, '饰品一') +
      slotRow('trinket', 1, '饰品二') +
      slotRow('trinket', 2, '饰品三') +
    '</div>' +
    (bag.length
      ? '<div class="bag-head">从行囊里挑 <span>' + bag.length + ' 件</span></div>' +
        '<div class="bag-block">' +
          pickRow('weapon', 0, '武器') +
          pickRow('armor', 0, '护甲') +
          pickRow('mount', 0, '坐骑') +
          pickRow('trinket', 0, '饰品一') +
          pickRow('trinket', 1, '饰品二') +
          pickRow('trinket', 2, '饰品三') +
          (fits('weapon').length + fits('armor').length + fits('mount').length + fits('trinket').length
            ? '' : '<div class="empty" style="padding:6px 0">行囊里没有她能用的东西。</div>') +
        '</div>'
      : '<div class="empty" style="padding:10px 0">行囊是空的。先去商会街或者讨伐魔物营地弄点东西。</div>') +
    '<div class="row-btns"><button class="btn-ghost" id="ng-close">收起</button></div>';

  UI.overlay(html);
  $('overlay').querySelector('.sheet').classList.add('wide');
  $('ng-close').onclick = () => UI.showMenu();

  $('overlay').querySelectorAll('[data-noff]').forEach(b => {
    b.onclick = () => {
      const p = b.dataset.noff.split(':');
      E.unequipNpc(n.id, p[0], parseInt(p[1], 10));
      UI.showNpcGear(n.id);
    };
  });
  $('overlay').querySelectorAll('[data-nwear]').forEach(b => {
    b.onclick = () => {
      const p = b.dataset.nwear.split(':');
      E.equipNpc(n.id, parseInt(p[0], 10), p[1], parseInt(p[2], 10));
      UI.showNpcGear(n.id);
    };
  });
};

/* ---------- 开局创建 ---------- */

const NAME_POOL = ['兰斯', '德里克', '科尔', '艾德', '席恩', '玛罗', '伊莱', '卡尔'];

UI.draft = null;

UI.showCreate = function (slot) {
  UI.draft = {
    slot: slot || E.slot || 1,
    step: 1,
    name: NAME_POOL[Math.floor(Math.random() * NAME_POOL.length)],
    age: 27,
    gender: '男',
    origin: null,
    alloc: { body: 0, trade: 0, lore: 0, charm: 0, will: 0 },
    points: 6,
    rolled: [],
    talents: [],
    locked: [],
    rerolls: 3
  };
  UI.renderCreate();
};

UI.createShell = function (inner) {
  const d = UI.draft;
  const steps = ['身份', '出身', '属性', '天赋'];
  const bar = '<div class="stepbar">' + steps.map((s, i) =>
    '<div class="s ' + (d.step === i + 1 ? 'on' : (d.step > i + 1 ? 'done' : '')) + '">' + (i + 1) + ' ' + s + '</div>'
  ).join('') + '</div>';
  UI.overlay('<div class="sheet wide">' + bar + inner + '</div>');
  $('overlay').querySelector('.sheet').classList.add('wide');
};

UI.renderCreate = function () {
  const d = UI.draft;
  if (d.step === 1) return UI.stepIdentity();
  if (d.step === 2) return UI.stepOrigin();
  if (d.step === 3) return UI.stepAttrs();
  if (d.step === 4) return UI.stepTalents();
};

UI.stepIdentity = function () {
  const d = UI.draft;
  const html =
    '<h1 style="font-size:24px;letter-spacing:.4em">你 是 谁</h1>' +
    '<div class="sub">王历 317 年 · 北境 · 拓荒特许状</div>' +
    '<div class="rule"></div>' +
    '<div class="field"><label>姓名</label>' +
    '<input type="text" id="c-name" maxlength="12" value="' + esc(d.name) + '" placeholder="不超过十二个字"></div>' +
    '<div class="field"><label>年龄</label><div class="chiprow" id="c-age">' +
    [22, 27, 32, 38, 45].map(a => '<div class="chip' + (d.age === a ? ' on' : '') + '" data-age="' + a + '">' + a + ' 岁</div>').join('') +
    '</div></div>' +
    '<div class="field"><label>性别</label><div class="chiprow" id="c-gender">' +
    ['男', '女'].map(g => '<div class="chip' + (d.gender === g ? ' on' : '') + '" data-g="' + g + '">' + g + '</div>').join('') +
    '</div></div>' +
    '<div class="btn-row"><button class="btn-main" id="c-next">下 一 步</button></div>';

  UI.createShell(html);
  $('c-name').oninput = e => { d.name = e.target.value; };
  $('c-age').querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { d.age = +c.dataset.age; UI.renderCreate(); };
  });
  $('c-gender').querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { d.gender = c.dataset.g; UI.renderCreate(); };
  });
  $('c-next').onclick = () => {
    d.name = ($('c-name').value || '').trim() || '未名';
    d.step = 2; UI.renderCreate();
  };
};

UI.stepOrigin = function () {
  const d = UI.draft;
  const cards = P.ORIGINS.map(o =>
    '<div class="origin-card' + (d.origin === o.id ? ' on' : '') + '" data-id="' + o.id + '">' +
    '<h4>' + o.name + '</h4>' +
    '<div class="tage">' + o.tag + '</div>' +
    '<p>' + o.desc + '</p>' +
    '<div class="perk">' + o.perk + '</div>' +
    '</div>'
  ).join('');

  const html =
    '<h1 style="font-size:24px;letter-spacing:.4em">你 从 哪 来</h1>' +
    '<div class="sub">出身决定你的起点，也决定别人第一眼怎么看你</div>' +
    '<div class="rule"></div>' +
    '<div class="origin-grid">' + cards + '</div>' +
    '<div class="btn-row">' +
    '<button class="btn-ghost" id="c-back">上一步</button>' +
    '<button class="btn-main" id="c-next"' + (d.origin ? '' : ' disabled style="opacity:.4;cursor:not-allowed"') + '>下 一 步</button>' +
    '</div>';

  UI.createShell(html);
  $('overlay').querySelectorAll('.origin-card').forEach(c => {
    c.onclick = () => { d.origin = c.dataset.id; UI.renderCreate(); };
  });
  $('c-back').onclick = () => { d.step = 1; UI.renderCreate(); };
  const nx = $('c-next');
  if (nx && d.origin) nx.onclick = () => { d.step = 3; UI.renderCreate(); };
};

UI.stepAttrs = function () {
  const d = UI.draft;
  const o = P.ORIGINS.find(x => x.id === d.origin);
  const used = P.ATTRS.reduce((s, a) => s + d.alloc[a.id], 0);
  const left = d.points - used;

  const rows = P.ATTRS.map(a => {
    const base = o.attrs[a.id] || 5;
    const add = d.alloc[a.id];
    const v = base + add;
    return '<div class="attr-line">' +
      '<div class="an" title="' + a.desc + '">' + a.name + '<small>' + a.tag + '</small></div>' +
      '<div class="track"><i style="width:' + (base * 5) + '%"></i><i class="add" style="width:' + (add * 5) + '%"></i></div>' +
      '<div class="ctl"><button data-m="' + a.id + '"' + (add <= 0 ? ' disabled' : '') + '>−</button>' +
      '<b>' + v + '</b>' +
      '<button data-p="' + a.id + '"' + (left <= 0 || v >= 20 ? ' disabled' : '') + '>＋</button></div>' +
      '</div>';
  }).join('');

  const html =
    '<h1 style="font-size:24px;letter-spacing:.4em">你 是 什 么 样 的 人</h1>' +
    '<div class="sub">还有 6 点可以分配 · 属性越低越容易被事推着走</div>' +
    '<div class="rule"></div>' +
    rows +
    '<div class="pointleft">剩余点数 <b>' + left + '</b></div>' +
    '<div class="btn-row">' +
    '<button class="btn-ghost" id="c-back">上一步</button>' +
    '<button class="btn-main" id="c-next">下 一 步</button>' +
    '</div>';

  UI.createShell(html);
  $('overlay').querySelectorAll('[data-p]').forEach(b => {
    b.onclick = () => {
      if (left <= 0) return;
      d.alloc[b.dataset.p]++; UI.renderCreate();
    };
  });
  $('overlay').querySelectorAll('[data-m]').forEach(b => {
    b.onclick = () => {
      if (d.alloc[b.dataset.m] <= 0) return;
      d.alloc[b.dataset.m]--; UI.renderCreate();
    };
  });
  $('c-back').onclick = () => { d.step = 2; UI.renderCreate(); };
  $('c-next').onclick = () => {
    if (left > 0 && !confirm('还有 ' + left + ' 点没分配，就这样开始吗？')) return;
    d.step = 4;
    if (!d.rolled.length) d.rolled = P.rollTalents(5);
    UI.renderCreate();
  };
};

UI.stepTalents = function () {
  const d = UI.draft;
  if (!d.locked) d.locked = [];
  if (!d.rolled.length) d.rolled = P.rollTalents(5);

  const cards = d.rolled.map(t => {
    const on = d.talents.indexOf(t.id) >= 0;
    const lk = d.locked.indexOf(t.id) >= 0;
    return '<div class="talent-card' + (on ? ' on' : '') + (t.lvl === 3 ? ' l3' : '') + (lk ? ' locked' : '') + '" data-id="' + t.id + '">' +
      '<div class="lv lv' + t.lvl + '">' + P.LVL_NAME[t.lvl] + '</div>' +
      '<div class="lk" data-lock="' + t.id + '" title="' + (lk ? '取消锁定' : '锁住：刷新时不会被换掉') + '">' + (lk ? '固' : '锁') + '</div>' +
      '<div class="tn">' + t.name + '</div>' +
      '<div class="td">' + t.desc + '</div>' +
      '</div>';
  }).join('');

  const html =
    '<h1 style="font-size:24px;letter-spacing:.4em">天 生 的 东 西</h1>' +
    '<div class="sub">从五个里挑三个 · 有些东西是练不出来的</div>' +
    '<div class="rule"></div>' +
    '<div class="talent-grid">' + cards + '</div>' +
    '<div class="pointleft">已选 <b>' + d.talents.length + '</b> / 3　' +
    '<span id="c-reroll" style="cursor:pointer;text-decoration:underline;color:' + (d.rerolls > 0 ? '#8a3324' : '#a1937c') + '">' +
    (d.rerolls > 0 ? '重新抽取（还剩 ' + d.rerolls + ' 次）' : '不能重抽了') + '</span></div>' +
    '<div class="rollhint">' + (d.locked.length ? '已锁定 1 张：重抽时会留着它' : '可以锁住一张，重抽时它不会走') + '</div>' +
    '<div class="btn-row">' +
    '<button class="btn-ghost" id="c-back">上一步</button>' +
    '<button class="btn-main" id="c-next"' + (d.talents.length === 3 ? '' : ' disabled style="opacity:.4;cursor:not-allowed"') + '>踏 上 路</button>' +
    '</div>';

  UI.createShell(html);
  $('overlay').querySelectorAll('.talent-card').forEach(c => {
    c.onclick = () => {
      const id = c.dataset.id;
      const i = d.talents.indexOf(id);
      if (i >= 0) d.talents.splice(i, 1);
      else if (d.talents.length < 3) d.talents.push(id);
      else UI.toast('最多选三个');
      UI.renderCreate();
    };
  });

  // 锁定
  $('overlay').querySelectorAll('[data-lock]').forEach(b => {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const id = b.dataset.lock;
      const i = d.locked.indexOf(id);
      if (i >= 0) { d.locked.splice(i, 1); }
      else {
        d.locked = [id];                 // 只锁一张
        if (d.talents.indexOf(id) < 0) {
          if (d.talents.length < 3) d.talents.push(id);
          else d.talents[2] = id;
        }
      }
      UI.renderCreate();
    };
  });

  const rr = $('c-reroll');
  if (rr && d.rerolls > 0) {
    rr.onclick = () => {
      d.rerolls--;
      const keep = d.rolled.filter(t => d.locked.indexOf(t.id) >= 0);
      const need = 5 - keep.length;
      const fresh = P.rollTalents(need, keep.map(t => t.id));
      d.rolled = keep.concat(fresh);
      d.talents = d.talents.filter(id => d.rolled.some(t => t.id === id));
      UI.renderCreate();
    };
  }
  const nx = $('c-next');
  if (nx && d.talents.length === 3) nx.onclick = () => startNew(d);
};

/* ---------- 事件绑定 ---------- */

UI.bind = function () {
  $('btn-menu').onclick = () => UI.showMenu();
  $('btn-side').onclick = () => {
    $('side').classList.toggle('open');
    $('scrim').classList.toggle('on');
  };
  $('scrim').onclick = () => {
    $('side').classList.remove('open');
    $('scrim').classList.remove('on');
  };
  document.querySelectorAll('.panel > .head').forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle('closed');
  });

  // 正文滚动时更新渐隐提示；转屏和软键盘收起后重算
  const app = document.getElementById('app');
  const story = $('story');
  const onScroll = () => UI.syncMore();
  if (app) app.addEventListener('scroll', onScroll, { passive: true });
  if (story) story.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { UI.syncSticky(); UI.syncMore(); });
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { UI.syncSticky(); UI.syncMore(); }, 260);
  });
};

/* ===== main.js ===== */
/* ===========================================================
   《鸦落谷》· 启动
   =========================================================== */

const OPENING = [
  '王历三百一十七年，三月初。\n\n你是从南边走进这个山谷的。两边的山很陡，雪还没化透，山腰以下是深绿，以上是一片脏白。走到谷底的时候，天正好开了一条缝，光斜斜地下来，照见坡上那栋石头房子——一堵墙塌了半边，剩下的半边也裂了三道。',
  '送你进来的是石桥镇的信使。他在谷口就停下，指了指坡上，说：「那就是你的庄园。」然后掉头走了。\n\n这句话他大概对很多人说过。\n\n五十个人。你数过。整个村子只有五十个人，十户上下，都站在村口看你，像在看一件不太确定的东西。风从北边过来，带着树脂味——越过村子再往北，是一片黑得没有层次的林子。'
];

function startNew(draft) {
  const cfg = draft ? {
    name: draft.name, age: draft.age, gender: draft.gender,
    origin: draft.origin, attrs: draft.alloc, talents: draft.talents
  } : null;
  E.slot = (draft && draft.slot) || 1;
  E.newGame(null, cfg);
  E.save();
  UI.leaveTitle();
  UI.hideOverlay();
  E.rollWeather();

  const ev = EV.find(e => e.id === 'wounded_orc');
  const pre = OPENING.map(t => ({ t: 'p', v: t }));
  E.startEvent(ev, pre);
}

function continueGame(slot) {
  const n = slot || E.slot || 1;
  if (E.load(n)) {
    UI.leaveTitle();
    UI.hideOverlay();
    E.openMenu();
    UI.toast('读取第 ' + E.slot + ' 槽');
  } else {
    UI.toast('这个存档读不出来');
  }
}

function boot() {
  E.init();
  UI.bind();

  let saveWarned = false;
  E.onScene = function (sc) {
    UI.show(sc);
  };
  E.onEnd = function (en) {
    E.save();
    setTimeout(() => UI.showEnding(en), 420);
  };

  E.migrateOld();
  UI.showTitle();

  // 演示用：?auto=N 直接开局并随机推进 N 次；?create=N 直接跳到创建第 N 步
  const q = new URLSearchParams(location.search);
  if (q.get('slots')) {
    UI.showTitle();
    UI.showSlots(q.get('slots') === 'load' ? 'load' : 'new');
    return;
  }
  if (q.get('create')) {
    UI.leaveTitle();
    UI.showCreate();
    const step = parseInt(q.get('create'), 10) || 1;
    UI.draft.origin = 'merc';
    UI.draft.alloc = { body: 2, trade: 1, lore: 1, charm: 1, will: 1 };
    UI.draft.step = step;
    if (step === 4) {
      UI.draft.rolled = P.rollTalents(5);
      if (q.get('go')) UI.draft.talents = UI.draft.rolled.slice(0, 3).map(t => t.id);
    }
    UI.renderCreate();
    if (q.get('go')) {
      const b = document.getElementById('c-next');
      if (b) b.click();
    }
    return;
  }
  if (q.get('show')) {
    UI.leaveTitle();
    UI.hideOverlay();
    E.newGame(null, { name: '德里克', age: 30, gender: '男', origin: 'merc', attrs: { body: 1, trade: 1, lore: 1, charm: 1, will: 0 }, talents: ['t_hand', 't_eye', 't_iron'] });
    E.state().copper = 40000; E.state().wood = 30; E.state().stone = 30; E.state().iron = 8;
    E.state().buildings.ranch = 1; E.state().animals = { chicken: 4, chick: 1, sheep: 2, cow: 1 };
    E.state().buildings.loom = 1; E.state().goods.wool = 12; E.state().goods.cloth = 3; E.state().goods.egg = 9;
    E.state().buildings.forge = 1; E.state().weapons = 2;
    const w0 = E.state().npcs.find(n => n.id === 'weila');
    if (w0) { w0.rel.aff = 62; w0.confessed = true; }
    E.state().troops = 8; E.state().troopDrill = 45; E.state().weapons = 5;
    E.state().buildings.barracks = 1;
    const key = q.get('show');
    const map = { forest: E.forestMenu, build: E.buildMenu, ranch: E.ranchMenu, craft: E.craftMenu, forge: E.forgeMenu, market: E.marketMenu, chapel: E.chapelMenu, drill: E.drillMenu, raid: E.raidMenu, gear: () => UI.showGear(), menu: () => E.openMenu() };
    if (map[key]) map[key]();
    else if (key.indexOf('npcgear:') === 0) {
      const id = key.split(':')[1];
      const np = E.state().npcs.find(x => x.id === id);
      if (np && !E.inParty(np)) E.toggleParty(id);
      UI.showNpcGear(id);
    }
    else if (PLACES[key]) { E.state().loc = key; E.cityMenu(key); }
    else if (key.indexOf(':') > 0) { const [c, p] = key.split(':'); E.state().loc = c; E.enterPlace(c, p); }
    else E.openMenu();
    return;
  }
  if (q.get('auto')) {
    startNew();
    const n = parseInt(q.get('auto'), 10) || 0;
    for (let i = 0; i < n; i++) {
      const sc = E.state().lastScene;
      if (!sc || !sc.options) break;
      const opts = sc.options.filter(o => !o.disabled);
      if (!opts.length) break;
      opts[Math.floor(Math.random() * opts.length)].act();
    }
    if (q.get('gear')) UI.showGear();
  }
}

window.addEventListener('DOMContentLoaded', boot);
