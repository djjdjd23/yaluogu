<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2015">
<title>鸦落谷 · 拓荒领主</title>
<style>
/* ===========================================================
   《鸦落谷》文字游戏 · 样式
   羊皮纸 / 烛光 / 中世纪手抄本
   =========================================================== */

:root {
  --paper:      #f2e9da;
  --paper-2:    #e9dcc6;
  --paper-3:    #dfd0b6;
  --ink:        #2b2117;
  --ink-2:      #5b4a37;
  --ink-3:      #8a755c;
  --line:       #c8b394;
  --line-soft:  #dccbae;
  --accent:     #8a3324;   /* 暗红：印章、关键数值 */
  --accent-2:   #a8823c;   /* 暗金：爵位、威望 */
  --good:       #4a6b3d;
  --bad:        #8a3324;
  --shadow:     0 1px 0 #fff8ec inset, 0 2px 8px rgba(70, 50, 25, .10);
  --radius:     3px;
  --serif:      "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "Georgia", serif;
  --sans:       "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; height: 100%; }

body {
  font-family: var(--serif);
  color: var(--ink);
  background-color: #1c1610;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(120, 92, 52, .28), transparent 62%),
    repeating-linear-gradient(115deg, rgba(255, 240, 210, .022) 0 2px, transparent 2px 5px);
  height: 100%;
  line-height: 1.85;
  font-size: 16px;
  overflow: hidden;
}

/* ---------- 整体布局 ---------- */

#app {
  max-width: 1180px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 336px;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas:
    "top    top"
    "stats  stats"
    "story  side"
    "choice side";
  background: var(--paper);
  box-shadow: 0 0 0 1px #6b563a, 0 0 60px rgba(0, 0, 0, .55);
  position: relative;
}

#app::before {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 12% 8%,  rgba(160, 120, 70, .10), transparent 22%),
    radial-gradient(circle at 88% 92%, rgba(160, 120, 70, .09), transparent 26%);
  z-index: 0;
}

/* ---------- 顶栏 ---------- */

.topbar {
  grid-area: top;
  overflow: hidden;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 20px;
  background: linear-gradient(#3a2c1e, #2b2015);
  color: #e8d9bd;
  border-bottom: 2px solid #1a130c;
  position: relative;
  z-index: 5;
}

.topbar .brand {
  font-size: 15px;
  letter-spacing: .34em;
  color: #d8b978;
  text-indent: .34em;
  border-right: 1px solid #57452c;
  padding-right: 14px;
  white-space: nowrap;
}

.topbar .clock {
  flex: 0 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 13.5px;
  color: #cbb894;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.topbar .where {
  font-size: 13.5px;
  color: #a08e6f;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar .spacer { flex: 1; }

.icon-btn {
  font-family: var(--serif);
  font-size: 13px;
  color: #d9c7a3;
  background: #43331f;
  border: 1px solid #6b563a;
  border-radius: var(--radius);
  padding: 4px 11px;
  cursor: pointer;
  white-space: nowrap;
  transition: .15s;
}
.icon-btn:hover { background: #573f27; color: #f0e3c8; }
.icon-btn:active { transform: translateY(1px); }

/* ---------- 数值条 ---------- */

.statbar {
  grid-area: stats;
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 4;
}

.stat {
  flex: 1 1 0;
  min-width: 92px;
  padding: 7px 12px 8px;
  border-right: 1px solid var(--line-soft);
  position: relative;
  overflow: hidden;
}
.stat:last-child { border-right: none; }

.stat .k {
  font-size: 11px;
  letter-spacing: .16em;
  color: var(--ink-3);
  font-family: var(--sans);
  display: block;
}

.stat .v {
  font-size: 19px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
  display: block;
}
.stat .v small { font-size: 11.5px; color: var(--ink-3); margin-left: 3px; font-family: var(--sans); }

/* 民心 / 威望 的底纹进度 */
.stat .bar {
  position: absolute; left: 0; bottom: 0; height: 2px;
  background: var(--accent-2);
  opacity: .5;
}

/* ---------- 正文 ---------- */

.story {
  grid-area: story;
  min-width: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 26px 34px 10px;
  position: relative;
  z-index: 1;
}

.chapter-head {
  text-align: center;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-soft);
}

.chapter-head .date {
  font-size: 12px;
  letter-spacing: .3em;
  color: var(--ink-3);
  font-family: var(--sans);
  text-indent: .3em;
}
.chapter-head .place {
  font-size: 21px;
  color: var(--ink);
  letter-spacing: .1em;
  margin-top: 6px;
}
.chapter-head .weather {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 3px;
  font-family: var(--sans);
}

.prose p {
  margin: 0 0 1.05em;
  word-break: break-word;
  overflow-wrap: anywhere;
  text-align: justify;
  text-indent: 2em;
  font-size: 16.5px;
  line-height: 1.95;
  color: var(--ink);
}

.prose p.dialogue { text-indent: 0; padding-left: 1.4em; border-left: 2px solid var(--line-soft); }
.prose p.beat { text-indent: 0; text-align: center; color: var(--ink-3); letter-spacing: .5em; font-size: 13px; margin: 1.4em 0; }

/* 判定结果条 */
.verdict {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin: 18px 0 14px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-left-width: 4px;
  background: rgba(255, 250, 238, .6);
  font-family: var(--sans);
  font-size: 13px;
}
.verdict .tag { letter-spacing: .18em; font-weight: 600; }
.verdict .num { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: auto; }
.verdict.great   { border-left-color: var(--accent-2); }
.verdict.great   .tag { color: var(--accent-2); }
.verdict.ok      { border-left-color: var(--good); }
.verdict.ok      .tag { color: var(--good); }
.verdict.partial { border-left-color: #9a7434; }
.verdict.partial .tag { color: #9a7434; }
.verdict.fail    { border-left-color: var(--bad); }
.verdict.fail    .tag { color: var(--bad); }

/* 数值变更提示 */
.deltas {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  margin: 0 0 16px;
  font-family: var(--sans); font-size: 12.5px;
  color: var(--ink-3);
}
.deltas span.up   { color: var(--good); }
.deltas span.down { color: var(--bad); }

/* ---------- 选项区 ---------- */

.choices {
  grid-area: choice;
  min-width: 0;
  padding: 12px 26px 20px;
  background: linear-gradient(rgba(242, 233, 218, 0), var(--paper) 22%);
  border-top: 1px solid var(--line-soft);
  position: relative;
  z-index: 3;
}

.choices .ask {
  font-size: 12px;
  letter-spacing: .28em;
  color: var(--ink-3);
  text-align: center;
  margin-bottom: 9px;
  font-family: var(--sans);
  text-indent: .28em;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  text-align: left;
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.6;
  color: var(--ink);
  background: rgba(255, 252, 244, .85);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 9px 14px;
  margin-bottom: 7px;
  cursor: pointer;
  transition: .14s;
  position: relative;
}

.opt:hover:not(:disabled) {
  background: #fffaef;
  border-color: var(--accent-2);
  transform: translateX(2px);
  box-shadow: 0 2px 10px rgba(120, 90, 40, .13);
}
.opt:active:not(:disabled) { transform: translateX(1px); }

.opt .key {
  flex: none;
  font-family: var(--sans);
  font-size: 11.5px;
  font-weight: 700;
  color: #fdf8ee;
  background: #7d6748;
  border-radius: 2px;
  width: 19px; height: 19px;
  display: grid; place-items: center;
  margin-top: 3px;
  line-height: 1;
}
.opt:hover:not(:disabled) .key { background: var(--accent-2); }

.opt .body { flex: 1; min-width: 0; }
.opt .hint {
  display: block;
  font-size: 11.5px;
  color: var(--ink-3);
  font-family: var(--sans);
  margin-top: 1px;
  letter-spacing: .02em;
}
.opt .hint .warn { color: var(--accent); }

.opt:disabled { opacity: .42; cursor: not-allowed; }

.opt.free { border-style: dashed; background: transparent; }
.opt.free .key { background: transparent; color: var(--ink-3); border: 1px solid var(--line); }

/* ---------- 侧栏 ---------- */

.side {
  grid-area: side;
  border-left: 1px solid var(--line);
  background: var(--paper-2);
  overflow-y: auto;
  padding: 0 0 24px;
  position: relative;
  z-index: 2;
}

.panel { border-bottom: 1px solid var(--line-soft); }

.panel > .head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px;
  font-size: 12px;
  letter-spacing: .2em;
  color: var(--ink-2);
  font-family: var(--sans);
  cursor: pointer;
  user-select: none;
  background: var(--paper-3);
  border-bottom: 1px solid var(--line-soft);
  text-indent: .2em;
}
.panel > .head .chev {
  margin-left: auto;
  font-size: 9px;
  color: var(--ink-3);
  transition: .2s;
  text-indent: 0;
}
.panel.closed > .head .chev { transform: rotate(-90deg); }
.panel > .body { padding: 10px 14px 13px; }
.panel.closed > .body { display: none; }

/* 领地明细 */
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 3.5px 0; border-bottom: 1px dotted var(--line-soft); }
.kv:last-child { border-bottom: none; }
.kv .k { color: var(--ink-3); font-family: var(--sans); font-size: 12px; }
.kv .v { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }

/* 角色卡 */
.npc {
  border: 1px solid var(--line);
  background: rgba(255, 252, 244, .6);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.npc > .name {
  display: flex; align-items: baseline; gap: 7px;
  padding: 7px 11px;
  background: rgba(200, 179, 148, .22);
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
}
.npc > .name b { font-size: 14px; font-weight: 600; letter-spacing: .05em; }
.npc > .name i { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-family: var(--sans); }
.npc > .name .aff { margin-left: auto; font-size: 11.5px; color: var(--accent); font-family: var(--sans); white-space: nowrap; }
.npc > .detail { padding: 8px 11px 10px; font-size: 12.5px; line-height: 1.7; display: none; }
.npc.open > .detail { display: block; }
.npc .row { display: flex; gap: 8px; margin-bottom: 3px; }
.npc .row .k { flex: none; width: 52px; color: var(--ink-3); font-family: var(--sans); font-size: 11.5px; }
.npc .row .v { flex: 1; color: var(--ink-2); }
.npc .thought { margin-top: 7px; padding: 6px 9px; background: rgba(200, 179, 148, .18); border-left: 2px solid var(--line); color: var(--ink-2); font-size: 12px; font-style: italic; }

/* 关系三维小条 */
.rel { display: flex; gap: 10px; margin-top: 6px; font-family: var(--sans); font-size: 11px; color: var(--ink-3); }
.rel .r { flex: 1; }
.rel .r .n { display: flex; justify-content: space-between; margin-bottom: 2px; }
.rel .r .track { height: 3px; background: var(--paper-3); border-radius: 2px; overflow: hidden; }
.rel .r .fill { height: 100%; background: var(--accent-2); }
.rel .r.inti .fill { background: var(--accent); }

/* 势力 */
.faction { display: flex; justify-content: space-between; font-size: 13px; padding: 3.5px 0; }
.faction .f { font-family: var(--sans); font-size: 12px; }
.faction .s { font-size: 12px; font-family: var(--sans); }
.s-2 { color: #8a3324; } .s-1 { color: #9a7434; } .s0 { color: var(--ink-3); } .s1 { color: #55743f; } .s2 { color: #3f6b52; }

/* 待办 */
.todo { font-size: 12.5px; display: flex; gap: 7px; padding: 3.5px 0; align-items: baseline; }
.todo .dot { color: var(--line); font-size: 9px; }
.todo .d { margin-left: auto; font-size: 11px; color: var(--ink-3); font-family: var(--sans); white-space: nowrap; }
.todo .d.urgent { color: var(--accent); }

.empty { font-size: 12px; color: var(--ink-3); font-family: var(--sans); padding: 3px 0; }

/* ---------- 开局 / 结局覆盖层 ---------- */

.overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(18, 13, 8, .88);
  display: grid; place-items: center;
  padding: 20px;
  backdrop-filter: blur(3px);
  overflow-y: auto;
}
.overlay.hide { display: none; }

.sheet {
  width: min(720px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: var(--paper);
  border: 1px solid #6b563a;
  box-shadow: 0 20px 70px rgba(0, 0, 0, .65);
  padding: 34px 40px 30px;
  position: relative;
}
.sheet::after {
  content: "";
  position: absolute; inset: 8px;
  border: 1px solid var(--line-soft);
  pointer-events: none;
}

.sheet h1 {
  font-size: 30px;
  letter-spacing: .5em;
  text-align: center;
  text-indent: .5em;
  color: var(--ink);
  font-weight: 400;
  margin-bottom: 6px;
}
.sheet .sub {
  text-align: center;
  font-size: 12px;
  letter-spacing: .3em;
  color: var(--ink-3);
  font-family: var(--sans);
  text-indent: .3em;
  margin-bottom: 22px;
}
.sheet .rule { height: 1px; background: var(--line); margin: 18px 0; position: relative; }
.sheet .rule::after {
  content: "❖";
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: var(--paper);
  color: var(--line);
  padding: 0 8px;
  font-size: 11px;
}
.sheet p { font-size: 15px; color: var(--ink-2); margin-bottom: .9em; text-align: justify; }
.sheet .lore { font-size: 13.5px; color: var(--ink-2); line-height: 1.9; }

.btn-main {
  display: block;
  width: 100%;
  font-family: var(--serif);
  font-size: 16px;
  letter-spacing: .3em;
  color: #f4e8ce;
  background: linear-gradient(#7a2c20, #63221a);
  border: 1px solid #4a170f;
  padding: 12px;
  margin-top: 22px;
  cursor: pointer;
  text-indent: .3em;
  transition: .15s;
}
.btn-main:hover { background: linear-gradient(#8c3325, #71271d); }
.btn-main:active { transform: translateY(1px); }

.btn-ghost {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink-3);
  background: transparent;
  border: 1px solid var(--line);
  padding: 7px 16px;
  cursor: pointer;
  transition: .15s;
}
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-3); }

.row-btns { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }

/* 结局评级 */
.rank {
  text-align: center;
  font-size: 62px;
  line-height: 1;
  color: var(--accent-2);
  letter-spacing: .1em;
  margin: 10px 0 4px;
  font-weight: 400;
}
.rank-label { text-align: center; font-size: 13px; letter-spacing: .32em; color: var(--ink-3); font-family: var(--sans); text-indent: .32em; margin-bottom: 18px; }

/* ---------- 滚动条 ---------- */

.story::-webkit-scrollbar, .side::-webkit-scrollbar, .sheet::-webkit-scrollbar { width: 9px; }
.story::-webkit-scrollbar-thumb, .side::-webkit-scrollbar-thumb, .sheet::-webkit-scrollbar-thumb {
  background: var(--line); border-radius: 6px; border: 2px solid var(--paper);
}
.story::-webkit-scrollbar-track, .side::-webkit-scrollbar-track { background: transparent; }

/* ---------- 提示气泡 ---------- */

#toast {
  position: fixed;
  left: 50%; bottom: 26px;
  transform: translate(-50%, 20px);
  background: #2b2015;
  color: #f0e3c8;
  font-family: var(--sans);
  font-size: 13px;
  padding: 9px 20px;
  border: 1px solid #6b563a;
  border-radius: var(--radius);
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  z-index: 200;
  max-width: 82vw;
  text-align: center;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- 响应式 ---------- */

@media (max-width: 900px) {
  /* 手机上不做「正文区 / 选项区」两个独立滚动窗：
     390px 竖屏里正文只剩 276px，长段落必被硬切。
     改成整页一条滚动流，正文自然流完、选项紧跟其后。
     用 flex 而不是 grid —— grid 的 auto 行在定高容器里会被压缩，
     顶栏会被挤成 18px。 */
  #app {
    display: flex;
    flex-direction: column;
    /* 必须是定高，不能 height:auto —— auto 会被内容撑成和 scrollHeight 一样高，
       于是 scrollHeight === clientHeight，容器内部永远不产生滚动，
       而 body 又是 overflow:hidden，手机上就彻底滑不动了。 */
    height: 100vh;
    height: 100dvh;
    max-height: 100vh;
    max-height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    /* 滚动容器要能接收触摸手势 */
    touch-action: pan-y;
  }
  body { overflow: hidden; }

  .topbar, .statbar, .story, .choices { flex: 0 0 auto; }

  /* 顶栏和状态栏吸顶，读长文时数字还在 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 12;
  }
  .statbar {
    position: sticky;
    top: var(--topbar-h, 48px);
    z-index: 11;
  }

  .topbar {
    padding: 8px 11px;
    gap: 8px;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  .topbar .brand { flex: none; }
  .topbar .spacer { min-width: 0; }
  .icon-btn { padding: 6px 10px; font-size: 12px; flex: none; }
  .topbar .brand { font-size: 13px; letter-spacing: .2em; padding-right: 9px; }
  .topbar .where { display: none; }
  /* 日期在 390px 上会被截成「3 月 1 日 ·…」，收窄字距并允许占满中间 */
  .topbar .clock {
    font-size: 11px;
    letter-spacing: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* 状态栏：8 项在 390px 上原来挤成一行、每项只剩 49px，
     金库「166金13银」被折成三行，整条高 107px。改成 4×2 等宽网格。 */
  .statbar {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    flex-wrap: nowrap;
  }
  .stat {
    flex: none;
    min-width: 0;
    padding: 5px 6px 6px;
    border-right: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }
  .stat:nth-child(4n) { border-right: none; }
  .stat:nth-child(n+5) { border-bottom: none; }
  .stat .k {
    font-size: 9.5px;
    letter-spacing: .04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat .v {
    font-size: 14px;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stat .v small { font-size: 9px; margin-left: 1px; }

  /* 平板宽度（600-900px）格子宽裕，只放大字号，仍用 4 列刚好填满两行 */
  @media (min-width: 600px) {
    .stat { padding: 6px 10px 7px; }
    .stat .k { font-size: 10.5px; letter-spacing: .08em; }
    .stat .v { font-size: 17px; }
    .stat .v small { font-size: 10px; }
  }

  .story {
    padding: 14px 16px 6px;
    position: relative;
    overflow: visible;
  }
  .prose p { font-size: 15.5px; line-height: 1.85; text-indent: 1.8em; }
  .prose p:last-child { margin-bottom: .9em; }
  .chapter-head { margin-bottom: 15px; padding-bottom: 11px; }
  .chapter-head .place { font-size: 17px; }
  .chapter-head .date { font-size: 11px; letter-spacing: .2em; }

  /* 选项区跟着正文走，不再单独限制高度、不再自己滚 */
  .choices {
    padding: 8px 12px max(14px, env(safe-area-inset-bottom));
    max-height: none;
    overflow: visible;
    position: relative;
    border-top: 1px solid var(--line-soft);
    background: var(--paper);
  }
  .opt { font-size: 14.5px; padding: 9px 11px; min-height: 44px; }
  .opt .hint { font-size: 11.5px; }

  /* 侧栏改为抽屉 */
  .side {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(88vw, 340px);
    transform: translateX(102%);
    transition: transform .26s ease;
    box-shadow: -12px 0 40px rgba(0, 0, 0, .6);
    z-index: 90;
    border-left: 1px solid #6b563a;
  }
  .side.open { transform: translateX(0); }

  .sheet { padding: 26px 22px 22px; }
  .sheet h1 { font-size: 25px; }

  /* 整条滚动流底部还有内容时，贴底渐隐提示 */
  #app::after {
    content: "";
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 30px;
    pointer-events: none;
    z-index: 8;
    background: linear-gradient(to bottom, rgba(245, 238, 224, 0), var(--paper));
    opacity: 0;
    transition: opacity .22s;
  }
  #app.more::after { opacity: 1; }

  /* 抽屉里的面板在手机上更紧凑 */
  .side { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .panel .body { font-size: 13px; }
  .panel .head { padding: 11px 14px; font-size: 13.5px; }

  /* 弹层在小屏上铺满，少留白 */
  .overlay { padding: 8px; }
  .sheet {
    width: 100%;
    max-height: calc(100dvh - 16px);
    padding: 18px 15px 14px;
    border-radius: 4px;
  }
  .sheet.wide { width: 100%; }
  .sheet h1 { font-size: 21px; letter-spacing: .2em; }
  .sheet .sub { font-size: 12px; margin-bottom: 12px; }
  .sheet .row-btns { flex-direction: column; margin-top: 14px; }
  .sheet .row-btns > * { width: 100%; }
  .sheet .btn-ghost, .sheet .btn-main { min-height: 44px; }
  .sheet .btn-row { margin-top: 12px; }
  .sheet .stepbar { margin-bottom: 14px; }
  .sheet .stepbar .s { font-size: 10px; padding: 6px 0; letter-spacing: .06em; }

  /* 创建角色：390px 上两列卡片太挤，改单列；卡片收紧 */
  .origin-grid { grid-template-columns: 1fr; gap: 9px; }
  .origin-card { padding: 12px 13px; }
  .origin-card h4 { font-size: 15.5px; }
  .origin-card .tage { font-size: 10.5px; margin-bottom: 6px; }
  .origin-card p { font-size: 12.5px; line-height: 1.7; margin-bottom: 6px; }
  .origin-card .perk { font-size: 10.5px; padding-top: 5px; }

  /* 装备 / 换装面板：窄屏把三列压成两列 */
  .gear-line { grid-template-columns: 48px 1fr 48px; gap: 7px; padding: 6px 0; }
  .gear-line .gs { font-size: 11px; }
  .gear-line .gn { font-size: 14px; }
  .gear-line .gd { font-size: 10.5px; }
  .gear-line .gx { min-height: 34px; padding: 4px 8px; font-size: 11px; }
  .npc-pick .pk { font-size: 13px; padding: 9px 10px; min-height: 44px; flex-wrap: wrap; }
  .npc-pick .pk i { margin-left: 0; width: 100%; }

  /* 存档槽卡片 */
  .slots { width: 100%; }
  .slots h2 { font-size: 19px; letter-spacing: .26em; margin-bottom: 6px; }
  .slots .sp-sub { font-size: 10.5px; letter-spacing: .06em; margin-bottom: 16px; line-height: 1.6; }
  .slot { grid-template-columns: 40px 1fr auto; gap: 9px; padding: 11px 11px; margin-bottom: 9px; }
  .slot .nm { font-size: 15px; margin-bottom: 2px; }
  .slot .meta { font-size: 10.5px; line-height: 1.5; }
  .slot .no { font-size: 9px; padding: 4px 0; }
  .slot .del { font-size: 10.5px; padding: 5px 7px; min-height: 32px; }
  .tip-row {
    font-size: 10.5px;
    margin-top: 16px;
    padding-top: 10px;
    flex-wrap: wrap;
    gap: 8px;
    border-top: 1px solid rgba(190, 158, 106, .18);
  }
  #title .slots { margin-top: -2vh; }
}

/* 小屏（<380px，如 iPhone SE）再收一档 */
@media (max-width: 379px) {
  .statbar { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stat { padding: 4px 5px 5px; }
  .stat .v { font-size: 13px; }
  .prose p { font-size: 15px; line-height: 1.8; }
  .story { padding: 12px 13px 6px; }
  .choices { padding: 7px 10px max(10px, env(safe-area-inset-bottom)); }
  .opt { font-size: 14px; padding: 8px 10px; }
  #title h1 { font-size: 40px; }
  /* 375px 上顶栏日期还要再省一点 */
  .topbar { padding: 8px 9px; gap: 6px; }
  .topbar .brand { font-size: 12px; letter-spacing: .12em; padding-right: 7px; }
  .topbar .clock { font-size: 10.5px; }
  .icon-btn { padding: 6px 8px; font-size: 11.5px; }
  .stat .k { font-size: 9px; }
  .stat .v { font-size: 13px; }
}



@media (max-width: 900px) {
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .5);
    opacity: 0; pointer-events: none;
    transition: .26s;
    z-index: 89;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
}

@media (min-width: 901px) {
  .scrim { display: none; }
  #btn-side { display: none; }

  /* 桌面端选项两列，给正文留出更多空间 */
  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 12px;
    align-content: start;
    max-height: 46vh;
    overflow-y: auto;
    padding-top: 6px;
  }
  .choices .ask { grid-column: 1 / -1; margin-bottom: 3px; }
  .choices .opt { margin-bottom: 0; }
}

/* 桌面端隐藏移动端专用按钮 */
@media (max-width: 900px) { #btn-side { display: inline-block; } }

/* ===========================================================
   开局创建
   =========================================================== */

.sheet.wide { width: min(880px, 100%); }

.stepbar {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}
.stepbar .s {
  flex: 1;
  text-align: center;
  font-size: 11px;
  letter-spacing: .12em;
  font-family: var(--sans);
  color: var(--ink-3);
  padding: 5px 0;
  border-bottom: 2px solid var(--line-soft);
}
.stepbar .s.on { color: var(--accent); border-bottom-color: var(--accent); }
.stepbar .s.done { color: var(--ink-2); border-bottom-color: var(--line); }

.field { margin-bottom: 16px; }
.field > label {
  display: block;
  font-size: 12px;
  letter-spacing: .18em;
  color: var(--ink-3);
  font-family: var(--sans);
  margin-bottom: 7px;
}
.field input[type=text] {
  width: 100%;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--ink);
  background: rgba(255, 252, 244, .8);
  border: 1px solid var(--line);
  padding: 9px 12px;
  outline: none;
}
.field input[type=text]:focus { border-color: var(--accent-2); }

.chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--ink-2);
  background: rgba(255, 252, 244, .7);
  border: 1px solid var(--line);
  padding: 7px 16px;
  cursor: pointer;
  transition: .14s;
}
.chip:hover { border-color: var(--accent-2); }
.chip.on { background: #7a2c20; color: #f4e8ce; border-color: #4a170f; }

.origin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 700px) { .origin-grid { grid-template-columns: 1fr; } }

.origin-card {
  border: 1px solid var(--line);
  background: rgba(255, 252, 244, .6);
  padding: 12px 14px;
  cursor: pointer;
  transition: .15s;
  position: relative;
}
.origin-card:hover { border-color: var(--accent-2); background: #fffaef; }
.origin-card.on { border-color: var(--accent); background: #fff8ee; box-shadow: 0 0 0 1px var(--accent) inset; }
.origin-card h4 { font-size: 16px; font-weight: 600; letter-spacing: .06em; margin-bottom: 3px; }
.origin-card .tage { font-size: 11px; color: var(--accent-2); font-family: var(--sans); margin-bottom: 7px; letter-spacing: .04em; }
.origin-card p { font-size: 13px; color: var(--ink-2); line-height: 1.75; margin-bottom: 7px; text-align: justify; }
.origin-card .perk { font-size: 11.5px; color: var(--good); font-family: var(--sans); border-top: 1px dotted var(--line-soft); padding-top: 6px; }

.attr-line {
  display: grid;
  grid-template-columns: 68px 1fr 92px;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dotted var(--line-soft);
}
.attr-line .an { font-size: 14px; letter-spacing: .1em; }
.attr-line .an small { display: block; font-size: 10px; color: var(--ink-3); font-family: var(--sans); letter-spacing: 0; white-space: nowrap; }
.attr-line .track { height: 9px; background: var(--paper-3); border-radius: 4px; overflow: hidden; display: flex; }
.attr-line .track i { display: block; height: 100%; background: var(--accent-2); }
.attr-line .track i.add { background: var(--accent); }
.attr-line .ctl { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.attr-line .ctl b { font-size: 15px; font-variant-numeric: tabular-nums; min-width: 20px; text-align: center; }
.attr-line .ctl button {
  width: 22px; height: 22px;
  line-height: 1;
  font-size: 15px;
  font-family: var(--sans);
  color: var(--ink-2);
  background: var(--paper-2);
  border: 1px solid var(--line);
  cursor: pointer;
}
.attr-line .ctl button:hover:not(:disabled) { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
.attr-line .ctl button:disabled { opacity: .3; cursor: not-allowed; }

.pointleft {
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
  font-family: var(--sans);
  margin: 14px 0 4px;
}
.pointleft b { color: var(--accent); font-size: 17px; }

.talent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
@media (max-width: 700px) { .talent-grid { grid-template-columns: 1fr; } }

.talent-card {
  border: 1px solid var(--line);
  background: rgba(255, 252, 244, .6);
  padding: 10px 12px;
  cursor: pointer;
  transition: .14s;
  position: relative;
}
.talent-card:hover { border-color: var(--accent-2); }
.talent-card.on { border-color: var(--accent); background: #fff8ee; box-shadow: 0 0 0 1px var(--accent) inset; }
.talent-card .tn { font-size: 14.5px; font-weight: 600; letter-spacing: .06em; }
.talent-card .td { font-size: 12px; color: var(--ink-2); line-height: 1.65; margin-top: 3px; }
.talent-card .lv {
  position: absolute; top: 8px; right: 10px;
  font-size: 10px; font-family: var(--sans);
  letter-spacing: .1em;
  padding: 1px 6px;
  border: 1px solid currentColor;
}
.lv1 { color: #8a755c; }
.lv2 { color: #3f6b52; }
.lv3 { color: #a8823c; }
.talent-card.l3 { background: linear-gradient(160deg, #fff8e8, #fdf2dd); }

.btn-row { display: flex; gap: 10px; margin-top: 20px; }
.btn-row .btn-main { margin-top: 0; }
.btn-row .btn-ghost { flex: none; }

/* ---------- 选项分组 ---------- */

.optgroup {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  letter-spacing: .26em;
  color: var(--ink-3);
  font-family: var(--sans);
  margin: 8px 0 1px;
  text-indent: .26em;
}
.optgroup::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-soft);
}
.optgroup.now { color: var(--accent); }
.optgroup.now::after { background: #d9b7a8; }

@media (max-width: 900px) {
  .optgroup { grid-column: auto; }
  .choices { display: block; }
  .optgroup { margin: 12px 0 5px; }
  .optgroup:first-child { margin-top: 0; }
}

.opt.urgent {
  border-left: 3px solid var(--accent);
  background: #fff9f2;
}
.opt.urgent .key { background: var(--accent); }
.opt.urgent:hover:not(:disabled) { border-color: var(--accent); border-left-color: var(--accent); }

/* ---------- 数量输入 ---------- */

.qty-mask {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(18, 13, 8, .55);
  display: grid; place-items: center;
  padding: 20px;
}
.qty-box {
  width: min(360px, 100%);
  background: var(--paper);
  border: 1px solid #6b563a;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  padding: 22px 24px 18px;
}
.qty-box h3 { font-size: 17px; font-weight: 500; letter-spacing: .14em; text-align: center; margin-bottom: 4px; }
.qty-box .qh { font-size: 11.5px; color: var(--ink-3); font-family: var(--sans); text-align: center; margin-bottom: 16px; }
.qty-line { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.qty-line button {
  width: 30px; height: 30px; font-size: 18px; line-height: 1;
  background: var(--paper-2); border: 1px solid var(--line); color: var(--ink-2); cursor: pointer;
}
.qty-line button:hover:not(:disabled) { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
.qty-line button:disabled { opacity: .3; cursor: not-allowed; }
.qty-line input {
  width: 92px; text-align: center;
  font-family: var(--serif); font-size: 24px; color: var(--ink);
  background: rgba(255, 252, 244, .85); border: 1px solid var(--line);
  padding: 4px 0; outline: none;
}
.qty-total { text-align: center; font-size: 13px; color: var(--accent); font-family: var(--sans); margin: 10px 0 14px; min-height: 18px; }
.qty-row { display: flex; gap: 10px; }
.qty-row button { flex: 1; }

.npc-btn {
  display: block;
  width: 100%;
  margin-top: 9px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: .08em;
  color: var(--ink-2);
  background: var(--paper-2);
  border: 1px solid var(--line);
  padding: 6px 0;
  cursor: pointer;
  transition: .14s;
}
.npc-btn:hover { border-color: var(--accent-2); color: var(--ink); }
.npc-btn.on { background: #7a2c20; color: #f4e8ce; border-color: #4a170f; }
.npc-btn.on:hover { background: #8c3325; color: #fff; }

/* ---------- 天赋锁定 ---------- */

.talent-card.locked { border-color: #a8823c; box-shadow: 0 0 0 1px #a8823c inset; }
.talent-card .lk {
  position: absolute;
  top: 6px; right: 42px;
  font-size: 10px;
  font-family: var(--sans);
  letter-spacing: .1em;
  color: var(--ink-3);
  border: 1px solid var(--line);
  background: rgba(255,255,255,.6);
  padding: 0 5px;
  line-height: 15px;
  cursor: pointer;
  z-index: 2;
}
.talent-card .lk:hover { color: var(--accent); border-color: var(--accent-2); }
.talent-card.locked .lk { color: #6b4d16; border-color: #a8823c; background: #fdf0d2; font-weight: 600; }
.rollhint {
  text-align: center;
  font-size: 11px;
  color: var(--ink-3);
  font-family: var(--sans);
  letter-spacing: .06em;
  margin-top: -2px;
}

/* ===========================================================
   主页面
   =========================================================== */

#title {
  position: fixed;
  inset: 0;
  z-index: 90;
  overflow: hidden;
  background: #14100a;
}

#title .sky {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#title .veil {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 44%, rgba(0,0,0,0) 42%, rgba(10, 7, 3, .58) 92%),
    linear-gradient(to bottom, rgba(8, 6, 3, .42), transparent 26%, transparent 66%, rgba(8, 6, 3, .62));
  pointer-events: none;
}

#title .inner {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px;
  text-align: center;
}

#title .eyebrow {
  font-family: var(--sans);
  font-size: 11.5px;
  letter-spacing: .52em;
  color: #bda37a;
  text-indent: .52em;
  margin-bottom: 22px;
}

#title h1 {
  font-size: clamp(52px, 11vw, 116px);
  font-weight: 500;
  letter-spacing: .34em;
  text-indent: .34em;
  color: #fdf3dd;
  line-height: 1.1;
  text-shadow:
    0 0 70px rgba(226, 180, 104, .45),
    0 0 26px rgba(240, 210, 150, .22),
    0 2px 0 rgba(0, 0, 0, .5);
  margin-bottom: 10px;
}

#title .sub {
  font-size: 13px;
  letter-spacing: .34em;
  text-indent: .34em;
  color: #cdb894;
  margin-bottom: 26px;
}

#title .rule {
  width: min(320px, 62vw);
  height: 1px;
  margin: 0 auto 26px;
  background: linear-gradient(to right, transparent, rgba(206, 170, 112, .55), transparent);
  position: relative;
}
#title .rule::after {
  content: "◆";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 7px;
  color: #c9a468;
  background: #14100a;
  padding: 0 8px;
}

#title .line {
  font-size: 14.5px;
  line-height: 2.1;
  color: #ded0b4;
  max-width: 30em;
  margin: 0 auto 34px;
  letter-spacing: .04em;
}

#title .btns {
  display: flex;
  flex-direction: column;
  gap: 11px;
  width: min(280px, 74vw);
}

.t-btn {
  font-family: var(--serif);
  font-size: 15.5px;
  letter-spacing: .34em;
  text-indent: .34em;
  padding: 13px 0;
  cursor: pointer;
  border: 1px solid rgba(198, 164, 108, .42);
  background: rgba(24, 18, 11, .55);
  color: #d9c7a5;

}
.t-btn:hover {

  background: rgba(58, 40, 24, .72);

.t-btn.primary {
  background: linear-gradient(to bottom, #7d2f21, #60211a);
  border-color: #8f4433;
  color: #f7ead2;
  box-shadow: 0 0 34px rgba(140, 50, 30, .35);
}
.t-btn.primary:hover {

  border-color: #b25a44;
}
.t-btn:disabled { opacity: .34; cursor: not-allowed; transform: none; }

#title .foot {
  position: absolute;
  bottom: 22px;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--sans);
  font-size: 10.5px;
  letter-spacing: .28em;
  color: #6b5c45;
}

/* ---------- 存档槽 ---------- */

.slots {
  width: min(560px, 92vw);
  text-align: left;
}
.slots h2 {
  font-size: 21px;
  font-weight: 500;
  letter-spacing: .34em;
  text-indent: .34em;
  text-align: center;
  color: #efe2c6;
  margin-bottom: 4px;
}
.slots .sp-sub {
  text-align: center;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: .2em;
  color: #8d7a5d;
  margin-bottom: 20px;
}

.slot {
  display: grid;
  grid-template-columns: 52px 1fr auto;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  padding: 13px 15px;
  margin-bottom: 10px;
  border: 1px solid rgba(190, 158, 106, .34);
  background: rgba(26, 20, 13, .62);
  color: #d8c7a6;
  cursor: pointer;
  transition: .18s;
  font-family: var(--serif);
}
.slot:hover:not(.void) {
  border-color: rgba(214, 176, 110, .85);
  background: rgba(53, 38, 23, .8);
  transform: translateX(2px);
}
.slot.void {
  border-style: dashed;
  opacity: .72;
}
.slot.void:hover { opacity: 1; border-color: rgba(190, 158, 106, .7); }

.slot .no {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: .16em;
  color: #a68f6b;
  border: 1px solid rgba(190, 158, 106, .4);
  padding: 5px 0;
  text-align: center;
}
.slot .nm {
  font-size: 16px;

W.money = function (copper) {
  copper = Math.round(copper);

  const g = Math.floor(copper / 240);

/* 抽卡：按等级掉落权重（exclude 里的 id 不会被抽到） */
P.rollTalents = function (n, exclude) {
  const skip = exclude || [];
  const pool = P.TALENTS.filter(t => skip.indexOf(t.id) < 0);
  const out = [];
  while (out.length < n && pool.length) {
    const r = Math.random();
    const wantLvl = r < 0.58 ? 1 : (r < 0.90 ? 2 : 3);
    let cand = pool.filter(t => t.lvl === wantLvl);
    if (!cand.length) cand = pool;
    const t = cand[Math.floor(Math.random() * cand.length)];
    out.push(t);
    pool.splice(pool.indexOf(t), 1);
  }
  return out;
};

/* 装备属性文字 */
GEAR.statText = function (item) {
  const parts = [];
  for (const k in (item.attrs || {})) {
    const n = item.attrs[k];
    parts.push((GEAR.ATTR_NAME[k] || k) + ' +' + n);
  }
  for (const k in (item.eff || {})) {
    const n = item.eff[k];
    parts.push((GEAR.EFF_NAME[k] || k) + ' +' + n);
  }
  return parts.join(' · ');
};

/* 装备总属性（用于展示） */
GEAR.summary = function (gear) {
  const sum = {};
  const add = g => {
    if (!g) return;
    for (const k in (g.attrs || {})) sum[k] = (sum[k] || 0) + g.attrs[k];
    for (const k in (g.eff || {})) if (k !== 'moraleMonth') sum[k] = (sum[k] || 0) + g.eff[k];
  };
  add(gear.weapon); add(gear.armor); add(gear.mount);
  (gear.trinkets || []).forEach(add);
  return sum;
};

      fail:{ text: '「少废话。」\n\n一箭射在你脚前的雪地上，箭尾还在抖。\n\n「最后一次。粮，还是命。」', delta: { food: -6, prestige: -1 } }

EV.push({

  text: '村子里的几个壮劳力进林子砍柴，砍倒了一棵刻着记号的树。\n\n第二天早上，那把斧头插在庄园门口的地上，斧柄上系着一根银白色的带子。\n\n再往北三十步，站着一个人。\n\n她一动不动，弓垂在身侧，银灰色的长发在风里散开。她的耳朵尖得不像人。\n\n「那棵树，长了四百年。」她说，声音很轻，但每个字都很清楚，「你们砍了它。」',

EV.push({

  text: '石桥镇男爵的客厅铺着一张退了色的旧地毯，壁炉里烧的木头是湿的，烟比火多。\n\n奥斯温·格雷坐在高背椅上，没有请你坐。\n\n「鸦落谷。」他把这个词在嘴里滚了一遍，「我祖父那辈，那地方叫狼谷，没有人。」\n\n他端起酒杯：「你从王都拿到的特许状，我看了。前三年免税——可你那块地，走出来要过我的桥。桥是我的，税也是我的。」\n\n他把杯子放下：「一车粮，抽三成。或者，你可以绕道走山路，多走四天。」',

const E = {};

E.EV_BY_CAT = { daily: [], biz: [], adv: [], pol: [] };

/* ---------- 随机 ---------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function rnd() { return RNG(); }
function ri(a, b) { return Math.floor(rnd() * (b - a + 1)) + a; }
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function chance(p) { return rnd() < p; }

/* ---------- 初始化 ---------- */

E.init = function () {
  E.EV_BY_CAT = { daily: [], biz: [], adv: [], pol: [] };
  EV.forEach(e => { if (E.EV_BY_CAT[e.cat]) E.EV_BY_CAT[e.cat].push(e); });
};

  });

E.state = () => S;

/* ---------- 玩家 ---------- */

/* 读取天赋累计效果 */
E.tal = function (key) {
  if (!S || !S.player) return 0;
  let v = 0;
  S.player.talents.forEach(id => {
    const t = P.TALENT_MAP[id];
    if (t && t.eff[key]) v += t.eff[key];
  });
  // 队友的天赋同步生效
  (S.party || []).forEach(pid => {
    const n = S.npcs.find(x => x.id === pid);
    if (!n || n.gone) return;
    (n.talents || []).forEach(tid => {
      const t = N.NPC_TALENTS.find(x => x.id === tid);
      if (t && t.eff[key]) v += t.eff[key];
    });
  });
  // 身上带的东西
  if (S.player.gear) v += E.gearSum(S.player.gear, key);
  return v;
};

/* 基础属性（不含装备） */
E.attrBase = function (id) {
  return (S.player && S.player.attrs[id]) || 5;
};

/* ---------- 装备 ---------- */

E.gearItems = function (gear) {
  if (!gear) return [];
  const out = [];
  ['weapon', 'armor', 'mount'].forEach(k => { if (gear[k]) out.push(GEAR.MAP[gear[k]]); });
  (gear.trinkets || []).forEach(id => { if (id) out.push(GEAR.MAP[id]); });
  return out.filter(Boolean);
};

E.gearSum = function (gear, key, rate) {
  let v = 0;
  E.gearItems(gear).forEach(g => {
    if (g.attrs && g.attrs[key]) v += g.attrs[key];
    if (g.eff && g.eff[key]) v += g.eff[key];
  });
  return rate == null ? v : v * rate;
};

E.gearOf = function (slot, idx) {
  const g = S.player.gear;
  if (slot === 'trinket') return (g.trinkets || [])[idx] || null;
  return g[slot] || null;
};

/* 装备带来的威望加成（板甲、战马、雪原狼、王徽胸针这类）
   威望本身是 S.prestige 这个独立字段，不经过 E.attr()，
   所以装备上写的 eff.prestige 必须单独在这里结算一次。 */
E.presGear = function () {
  let v = 0;
  if (S.player && S.player.gear) v += E.gearSum(S.player.gear, 'prestige');
  E.partyMembers().forEach(n => { v += E.gearSum(n.gear, 'prestige', 0.5); });
  return Math.round(v);
};

/* 判定、顶栏、结局、阶段晋升统一读这个：自身威望 + 装备 */
E.presTotal = function () {
  return clamp(S.prestige + E.presGear(), 0, 100);
};

E.addItem = function (id) {
  if (!GEAR.MAP[id]) return null;
  S.player.bag = S.player.bag || [];
  S.player.bag.push(id);
  return GEAR.MAP[id];
};

E.equip = function (slot, idx, itemId) {
  const it = GEAR.MAP[itemId];
  if (!it) return;
  if (it.slot !== slot) return;
  const g = S.player.gear;
  S.player.bag = S.player.bag || [];
  const bi = S.player.bag.indexOf(itemId);
  if (bi < 0) return;

  if (slot === 'trinket') {
    const cur = g.trinkets[idx];
    g.trinkets[idx] = itemId;
    if (cur) S.player.bag.push(cur);
  } else {
    const cur = g[slot];
    g[slot] = itemId;
    if (cur) S.player.bag.push(cur);
  }
  S.player.bag.splice(bi, 1);
  E.save();
};

E.unequip = function (slot, idx) {
  const g = S.player.gear;
  S.player.bag = S.player.bag || [];
  let cur = null;
  if (slot === 'trinket') { cur = g.trinkets[idx]; g.trinkets[idx] = null; }
  else { cur = g[slot]; g[slot] = null; }
  if (cur) S.player.bag.push(cur);
  E.save();
};

/* ---------- 给队友换装 ----------
   装备都放在领主的行囊里，谁穿谁生效。
   队友身上的东西按一半折算（E.attr / E.presGear 里已经处理）。 */

E.npcGearSlot = function (npc, slot, idx) {
  if (!npc || !npc.gear) return null;
  if (slot === 'trinket') return (npc.gear.trinkets || [])[idx] || null;
  return npc.gear[slot] || null;
};

/* 把行囊里第 bagIdx 件东西穿到这个 NPC 身上；换下来的回行囊 */
E.equipNpc = function (npcId, bagIdx, slot, idx) {
  const npc = S.npcs.find(n => n.id === npcId);
  if (!npc || npc.gone) return false;
  const id = (S.player.bag || [])[bagIdx];
  const it = GEAR.MAP[id];
  if (!it || it.slot !== slot) return false;
  npc.gear = npc.gear || { weapon: null, armor: null, mount: null, trinkets: [null, null, null] };
  npc.gear.trinkets = npc.gear.trinkets || [null, null, null];

  let cur = null;
  if (slot === 'trinket') { cur = npc.gear.trinkets[idx] || null; npc.gear.trinkets[idx] = id; }
  else { cur = npc.gear[slot] || null; npc.gear[slot] = id; }

  S.player.bag.splice(bagIdx, 1);
  if (cur) S.player.bag.push(cur);
  E.save();
  return true;
};

/* 从 NPC 身上脱下，回到行囊 */
E.unequipNpc = function (npcId, slot, idx) {
  const npc = S.npcs.find(n => n.id === npcId);
  if (!npc || !npc.gear) return false;
  let cur = null;
  if (slot === 'trinket') { cur = (npc.gear.trinkets || [])[idx] || null; npc.gear.trinkets[idx] = null; }
  else { cur = npc.gear[slot] || null; npc.gear[slot] = null; }
  if (!cur) return false;
  S.player.bag = S.player.bag || [];
  S.player.bag.push(cur);
  E.save();
  return true;
};

/* ---------- 商会珍品：会换货 ---------- */

E.rollShop = function () {
  const out = [], used = [];
  for (let i = 0; i < 4; i++) {
    const r = rnd();
    const lv = r < 0.46 ? 1 : (r < 0.84 ? 2 : 3);
    const pool = GEAR.SHOP_POOL[lv].filter(id => used.indexOf(id) < 0);
    if (!pool.length) continue;
    const id = pick(pool);
    used.push(id);
    out.push(id);
  }
  return out;
};

E.shopStock = function () {
  const d = Math.floor(S.dayNum);
  if (!S.shopStock || !S.shopStock.length || S.shopDay == null) {
    S.shopStock = E.rollShop();
    S.shopDay = d;
    S.shopRollDay = d;
    return S.shopStock;
  }
  // 每八天换一批；同一天最多再随机换一次
  if (d - S.shopDay >= 8 || (S.shopRollDay !== d && chance(0.30))) {
    if (S.shopRollDay !== d) S.shopRollDay = d;
    if (d - S.shopDay >= 8) S.shopDay = d;
    S.shopStock = E.rollShop();
  }
  return S.shopStock;
};

E.attr = function (id) {
  let v = E.attrBase(id);
  if (S.player && S.player.gear) v += E.gearSum(S.player.gear, id);
  // 队友身上带的东西，也能帮上一点忙（折半）
  E.partyMembers().forEach(n => { v += E.gearSum(n.gear, id, 0.5); });
  return v;
};

/* 属性对判定的加成：5 为基准，每点 ±0.4，最高 +3 */
E.attrBonus = function (id) {
  const v = (E.attr(id) - 5) * 0.4;
  return Math.max(-1, Math.min(3, v));
};

/* 判定所属属性 */
E.attrOf = function (opt, ev) {
  if (opt && opt.attr) return opt.attr;
  if (ev && ev.attr) return ev.attr;
  if (ev && P.CAT_ATTR[ev.cat]) return P.CAT_ATTR[ev.cat];
  return 'charm';
};

/* ---------- 工具 ---------- */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

E.dateText = function () {
  const t = S.time;
  return '王历 ' + t.y + ' 年 · ' + t.m + ' 月 ' + t.d + ' 日';
};

E.season = function () { return W.seasonOf(S.time.m); };

E.foodNeed = function () {
  const mult = E.season() === 'winter' ? 1.15 : 1;
  const save = 1 - Math.min(0.35, E.tal('foodSave'));
  return S.people * W.FOOD_PER_HEAD_MONTH * mult * save;
};

E.stage = function () { return W.STAGES[S.stage]; };

E.locName = function (id) { return W.LOCS[id || S.loc].name; };

/* ---------- 数值变动 ---------- */

E.apply = function (d, silent) {
  if (!d) return [];
  const changes = [];
  const add = (k, v, label) => {
    if (!v) return;
    S[k] += v;
    changes.push({ label: label || k, v: v });
  };

  add('copper', Math.round(d.copper || 0), '金库');
  add('food', Math.round(d.food || 0), '存粮');
  add('wood', Math.round(d.wood || 0), '木材');
  add('iron', Math.round(d.iron || 0), '铁');
  add('people', Math.round(d.people || 0), '人口');
  add('morale', Math.round(d.morale || 0), '民心');
  add('prestige', Math.round(d.prestige || 0), '威望');
  add('troops', Math.round(d.troops || 0), '兵力');

  if (d.land) { S.land += d.land; changes.push({ label: '开垦', v: d.land, unit: ' 亩' }); }
  if (d.fields) { S.fields += d.fields; }

  S.copper = Math.max(0, S.copper);
  S.food = Math.max(0, S.food);
  S.wood = Math.max(0, S.wood);
  S.iron = Math.max(0, S.iron);
  S.people = Math.max(0, S.people);
  S.morale = clamp(S.morale, 0, 100);
  S.prestige = clamp(S.prestige, 0, 100);
  S.troops = Math.max(0, S.troops);

  if (d.faction) {
    for (const k in d.faction) {
      S.factions[k] = clamp((S.factions[k] || 0) + d.faction[k], -2, 2);
      const f = W.FACTIONS.find(x => x.id === k);
      changes.push({ label: (f ? f.name : k) + '态度', v: d.faction[k], abs: true });
    }
  }
  return changes;
};

/* 关系数值：带防倒贴闸门 */
E.addRel = function (npc, r) {
  if (!npc || !r) return [];
  const out = [];
  const bump = (key, v, markStep) => {
    if (!v) return;
    if (v > 0 && key === 'aff') {
      const nextMark = Math.floor(npc.rel.aff / 10) * 10 + 10;
      if (npc.rel.aff + v >= nextMark && npc.talks < 3) {
        v = Math.max(0, nextMark - 1 - npc.rel.aff);
        npc.blocked = true;
      } else if (npc.rel.aff + v >= nextMark) {
        npc.talks = 0;
      }
    }
    const before = npc.rel[key];
    npc.rel[key] = clamp(npc.rel[key] + v, 0, 100);
    const real = npc.rel[key] - before;
    if (real) out.push({ npc: npc.name, key: key, v: real });
  };
  bump('aff', Math.round(r.aff || 0));
  bump('loy', Math.round(r.loy || 0));
  return out;
};

E.relStage = function (aff) {
  if (aff >= 80) return '倾心';
  if (aff >= 60) return '暧昧';
  if (aff >= 40) return '亲近';
  if (aff >= 20) return '礼貌';
  return '戒备';
};

/* ---------- 判定 ---------- */

const TIERS = {
  great: { key: 'great', name: '大成功', mult: 1.35 },
  ok: { key: 'ok', name: '成功', mult: 1 },
  partial: { key: 'partial', name: '部分成功', mult: 0.55 },
  fail: { key: 'fail', name: '失败', mult: 1 }
};

function isNon(t) { return t === 'partial' || t === 'fail'; }
function downgrade(t) { return t === 'great' ? 'ok' : t === 'ok' ? 'partial' : 'fail'; }
function upgrade(t) { return t === 'fail' ? 'partial' : t === 'partial' ? 'ok' : 'great'; }

E.judge = function (opt, ev) {
  const diff = (opt.diff != null ? opt.diff : (ev && ev.diff) || 3);
  const attrId = E.attrOf(opt, ev);
  let bonus = opt.bonus || 0;
  // 投入的资源折算成准备
  if (opt.cost) {
    if (opt.cost.copper) bonus += Math.min(3, opt.cost.copper / 1200);
    if (opt.cost.food) bonus += Math.min(2, opt.cost.food / 10);
  }
  // 玩家属性与天赋
  const aB = E.attrBonus(attrId);
  const tKey = 'judge' + attrId.charAt(0).toUpperCase() + attrId.slice(1);
  const tB = E.tal(tKey);
  // 士兵在体力判定里能顶一点：看的是战力，不只是人数
  let troopB = 0;
  if (attrId === 'body' && !opt.noTroop) troopB = Math.min(5, E.armyStats().power * 0.22);

  const score = bonus + E.presTotal() / 12 + aB + tB + troopB - diff;

  let r = rnd();
  let tier;
  if (score >= 6) tier = r < 0.52 ? 'great' : (r < 0.90 ? 'ok' : 'partial');
  else if (score >= 2) tier = r < 0.26 ? 'great' : (r < 0.74 ? 'ok' : 'partial');
  else if (score >= -2) tier = r < 0.10 ? 'great' : (r < 0.52 ? 'ok' : (r < 0.86 ? 'partial' : 'fail'));
  else if (score >= -6) tier = r < 0.04 ? 'ok' : (r < 0.42 ? 'partial' : 'fail');
  else tier = r < 0.14 ? 'partial' : 'fail';

  /* —— 命硬：每局一次，把致命失败救回来 —— */
  if (tier === 'fail' && E.tal('luckSave') > 0 && S.player && !S.player.luckUsed) {
    S.player.luckUsed = true;
    tier = 'partial';
  }

  /* —— 失败配额：每十次判定至少 2 次非单纯成功，至多 3 次 —— */
  S.judged++;
  S.quota.push(isNon(tier) ? 'non' : 'clean');
  if (S.quota.length > 10) S.quota.shift();
  const len = S.quota.length;
  const non = S.quota.filter(x => x === 'non').length;
  const rest = 10 - len;
  if (non + rest < 2 && !isNon(tier)) {
    tier = downgrade(tier);
    S.quota[S.quota.length - 1] = 'non';
  } else if (non > 3 && isNon(tier)) {
    tier = upgrade(tier);
    S.quota[S.quota.length - 1] = 'clean';
  }

  return { tier: tier, score: Math.round(score * 10) / 10, diff: diff, attr: attrId };
};

/* ---------- 事件抽取 ---------- */

const CAT_WEIGHT = { daily: 40, biz: 30, adv: 20, pol: 10 };

E.pickEvent = function (pool, loc) {
  const season = E.season();
  const cats = [];
  for (const c in CAT_WEIGHT) {
    const avail = E.EV_BY_CAT[c].filter(e =>
      (!pool || e.cat === pool) &&
      (!e.loc || e.loc.includes('any') || e.loc.includes(loc)) &&
      (!e.season || e.season.includes(season)) &&
      (!e.cond || safeCond(e.cond)) &&
      (!e.once || !S.flags['ev_' + e.id]) &&
      S.recentEvents.indexOf(e.id) < 0
    );
    if (avail.length) cats.push({ cat: c, w: CAT_WEIGHT[c] });
  }
  if (!cats.length) return null;

  let total = cats.reduce((a, b) => a + b.w, 0);
  let x = rnd() * total;
  let chosen = cats[0].cat;
  for (const c of cats) { x -= c.w; if (x <= 0) { chosen = c.cat; break; } }

  const pool2 = E.EV_BY_CAT[chosen].filter(e =>
    (!pool || e.cat === pool) &&
    (!e.loc || e.loc.includes('any') || e.loc.includes(loc)) &&
    (!e.season || e.season.includes(season)) &&
    (!e.cond || safeCond(e.cond)) &&
    (!e.once || !S.flags['ev_' + e.id]) &&
    S.recentEvents.indexOf(e.id) < 0
  );
  if (!pool2.length) return null;

  // 权重抽取
  const tw = pool2.reduce((a, e) => a + (e.weight || 1), 0);
  let y = rnd() * tw;
  for (const e of pool2) {
    y -= (e.weight || 1);
    if (y <= 0) return e;
  }
  return pool2[0];
};

function safeCond(fn) { try { return fn(S); } catch (e) { return false; } }

/* ---------- 时间 ---------- */

E.syncCalendar = function () {
  const mi = 2 + Math.floor(S.dayNum / 30);   // 从 0 起算的月份序号，起点是 3 月
  S.time.y = 317 + Math.floor(mi / 12);
  S.time.m = mi % 12 + 1;
  S.time.d = Math.floor(S.dayNum % 30) + 1;
};

E.advance = function (days) {
  let fuel = Math.ceil(days * 2) / 2;
  while (fuel >= 0.5) {
    const step = fuel >= 1 ? 1 : 0.5;
    fuel -= step;
    S.stats.days += step;
    const dBefore = Math.floor(S.dayNum);
    const before = Math.floor(S.dayNum / 30);
    S.dayNum += step;
    const dAfter = Math.floor(S.dayNum);
    const after = Math.floor(S.dayNum / 30);
    if (dAfter > dBefore) E.dailyTick();
    E.syncCalendar();
    E.checkDeadlines();
    if (after > before) {
      E.settleMonth();
      if (S.ended) return;
    }
    if (S.dayNum >= 360) { E.syncCalendar(); E.endGame('time'); return; }
  }
  E.rollWeather();
};

/* 结束今天：行动点回满，时间推进一天 */
E.endDay = function () {
  S.ap = S.apMax;
  E.advance(1);
};

/* 花掉行动点；用完就自动过夜 */
E.spendAP = function (n) {
  S.ap -= (n == null ? 1 : n);
  if (S.ap <= 0) { E.endDay(); return true; }
  return false;
};

/* 每天自动发生的事：建筑产出、牲畜产出、兵营练兵、孵化 */
E.dailyTick = function () {
  const d = Math.floor(S.dayNum);

  for (const k in ECON.DAILY) {
    if (!S.buildings[k]) continue;
    const p = ECON.DAILY[k];
    const n = S.buildings[k];
    if (p.wood) S.wood += p.wood * n;
    if (p.stone) S.stone += p.stone * n;
    if (p.iron) S.iron += p.iron * n;
  }

  if (S.animals.chicken) S.goods.egg += S.animals.chicken * ECON.ANIMALS.chicken.rate;
  if (S.animals.sheep) S.goods.wool += S.animals.sheep * ECON.ANIMALS.sheep.rate;
  if (S.animals.cow) S.goods.milk += S.animals.cow * ECON.ANIMALS.cow.rate;

  // 兵营不再自己招人——它只让现有的人练得更精
  if (d % 10 === 0) {
    S.lairs = E.genLairs();          // 每旬重探一次，营地会换
    S.lairWeek = Math.floor(S.dayNum / 10);
    if (S.buildings.barracks && S.troops > 0) {
      const before = Math.round(S.troopDrill || 0);
      if (before < 70) {
        S.troopDrill = clamp(before + 6, 0, 70);
        S.log.push({ t: E.dateText(), text: '兵营日常操练，操练度上升。' });
      }
    }
    // 天赋（含队友）带来的兵：每十天一名，绝不越过人口三分之一
    const tg = Math.round(E.tal('troops'));
    if (tg > 0) {
      const room = Math.max(0, E.troopCap() - Math.round(S.troops));
      const add = Math.min(tg, room);
      if (add > 0) {
        S.troops += add;
        S.log.push({ t: E.dateText(), text: '有人慕名来投，兵员 +' + add + '。' });
      }
    }
  }

  if (d % 10 === 0) {
    if (S.goods.egg >= ECON.HATCH_EGGS && chance(ECON.HATCH_CHANCE)) {
      S.goods.egg -= ECON.HATCH_EGGS;
      S.animals.chick += 1;
      S.log.push({ t: E.dateText(), text: '鸡蛋放久了，孵出一只小鸡。' });
    }
    if (S.animals.chick > 0 && chance(ECON.ANIMALS.chick.grow)) {
      S.animals.chick -= 1;
      S.animals.chicken += 1;
      S.log.push({ t: E.dateText(), text: '小鸡长成了母鸡，开始下蛋。' });
    }
  }

  // 每十五天自动存档
  if (typeof E.autoSave === 'function') E.autoSave();
};

E.rollWeather = function () {
  const list = W.WEATHER[E.season()];
  S.weather = pick(list);
};

/* ---------- 月度结算 ---------- */

E.settleMonth = function () {
  const need = E.foodNeed();
  S.food -= need;

  // 地租与零散收入
  const rent = Math.round(S.people * 4);
  S.copper += rent;

  // 秋收：九月、十月
  if (S.time.m === 9 || S.time.m === 10) {
    const harvest = Math.round(S.fields * 1.35 * (S.buildings.mill ? 1.25 : 1));
    S.food += harvest;
    S.log.push({ t: E.dateText(), text: '秋收：入库 ' + harvest + ' 石。' });
  }

  // 饥荒
  if (S.food < 0) {
    S.famine++;
    S.food = 0;
    const dead = Math.max(1, Math.round(S.people * 0.05));
    S.people = Math.max(0, S.people - dead);
    S.morale = clamp(S.morale - 10, 0, 100);
    S.log.push({ t: E.dateText(), text: '饥荒。死了 ' + dead + ' 人。' });
    if (S.famine >= 3) { E.endGame('famine'); return; }
  } else if (S.food > need * 0.4) {
    S.famine = 0;
  }

  // 冬天：冬衣不够，会冻死人
  if (S.time.m === 12 || S.time.m === 1 || S.time.m === 2) {
    const needC = Math.round(S.people * 0.5);
    if (S.goods.clothes < needC) {
      const short = needC - Math.floor(S.goods.clothes);
      const dead = Math.max(1, Math.round(short * 0.12));
      S.people = Math.max(0, S.people - dead);
      S.morale = clamp(S.morale - 6, 0, 100);
      S.notices = S.notices || [];
      S.notices.push('冬衣不够。有 ' + dead + ' 个人没能熬过这个月——他们裹着草席下了葬。');
      S.log.push({ t: E.dateText(), text: '冬衣不足，死了 ' + dead + ' 人。' });
    }
  }

  // 十月提醒备冬衣
  if (S.time.m === 10) {
    const needC = Math.round(S.people * 0.5);
    if (S.goods.clothes < needC) {
      S.notices = S.notices || [];
      S.notices.push('天开始转凉。仓里的冬衣还差 ' + (needC - Math.floor(S.goods.clothes)) + ' 件——冬天真的会死人。');
    }
  }

  // 采集次数按月重置
  S.gather = { chop: 0, quarry: 0, mine: 0, adventure: 0 };

  // 人口与人心
  if (S.morale >= 60 && S.food > need * 1.6) {
    const up = ri(1, 3);
    S.people += up;
  } else if (S.morale < 25) {
    const down = ri(2, 5);
    S.people = Math.max(0, S.people - down);
  }

  // 兵员不得超过人口的三分之一：人少了，兵也得散
  {
    const cap = E.troopCap();
    if (Math.round(S.troops) > cap) {
      const cut = Math.round(S.troops) - cap;
      S.troops = cap;
      S.notices = S.notices || [];
      S.notices.push('谷里养不起那么多兵了。' + cut + ' 个人把兵器交回来，回村里种地。');
      S.log.push({ t: E.dateText(), text: '兵员超编，遣散 ' + cut + ' 人。' });
    }
  }
  // 民心向中间缓慢回落：日子总会被忘记，欠下的总会被记住
  // 越高越难维持——人心是会往下走的，往上得一直花力气
  const decay = Math.round(4 + S.people / 50 + Math.max(0, (S.morale - 65) / 5));
  if (S.morale > 50) S.morale = clamp(S.morale - decay, 0, 100);
  else if (S.morale < 40) S.morale = clamp(S.morale + 1, 0, 100);
  if (S.morale < 30) S.prestige = clamp(S.prestige - 1, 0, 100);
  // 口碑：日子过得下去，外面的人就会开始听说你的名字
  if (S.morale >= 65 && S.food > need) S.prestige = clamp(S.prestige + 1, 0, 100);

  // 天赋的日常效果
  const tmM = E.tal('moraleMonth');
  if (tmM) S.morale = clamp(S.morale + tmM, 0, 100);
  const tmP = E.tal('prestigeMonth');
  if (tmP) S.prestige = clamp(S.prestige + tmP, 0, 100);

  // 留不住的人：忠诚太低，会真的走
  S.notices = S.notices || [];
  S.npcs.forEach(n => {
    if (n.gone || !n.flagLeaving || n.id === 'weila') return;
    if (n.rel.loy >= 20 || n.rel.aff >= 25) { n.flagLeaving = false; return; }
    if (!chance(0.35)) return;
    n.gone = true;
    n.here = false;
    S.notices.push('第二天早上，' + n.name + '不在了。她的东西收拾得很干净，只留下一句话：「这里留不住我。」');
    S.log.push({ t: E.dateText(), text: n.name + ' 离开了鸦落谷。' });
    S.prestige = clamp(S.prestige - 1, 0, 100);
  });

  // 阶段晋升
  const old = S.stage;
  if (S.stage === 0 && S.people >= 90 && E.presTotal() >= 20 && S.buildings.barn) S.stage = 1;
  if (S.stage === 1 && S.people >= 200 && E.presTotal() >= 45) S.stage = 2;
  if (S.stage !== old) {
    S.log.push({ t: E.dateText(), text: '领地进入「' + W.STAGES[S.stage] + '」阶段。' });
    S.morale = clamp(S.morale + 6, 0, 100);
  }

  // 崩溃判定
  if (S.morale <= 5) { E.endGame('revolt'); return; }
  if (S.people <= 12) { E.endGame('abandon'); return; }

  // 债务到期
  if (S.time.m === 11 && S.flags['debt_changhe'] && !S.debt.paid_changhe) {
    if (S.food >= 40) { S.food -= 40; S.debt.paid_changhe = true; S.prestige = clamp(S.prestige + 5, 0, 100); }
    else {
      S.prestige = clamp(S.prestige - 8, 0, 100);
      S.factions.changhe = -1;
      S.log.push({ t: E.dateText(), text: '长河城的粮没还上。' });
    }
  }
};

/* ---------- 期限 ---------- */

E.addDeadline = function (d) {
  if (!S.deadlines) S.deadlines = [];
  if (S.deadlines.some(x => x.id === d.id && !x.done)) return;
  d.done = false;
  S.deadlines.push(d);
};

E.checkDeadlines = function () {
  if (!S.deadlines || !S.deadlines.length) return;
  S.notices = S.notices || [];
  S.deadlines.forEach(d => {
    if (d.done || S.dayNum < d.due) return;
    d.done = true;
    if (d.auto) return;

    const ok = d.okWhen ? d.okWhen() : false;
    if (ok) {
      if (d.reward) E.apply(d.reward);
      if (d.okMsg) S.notices.push(d.okMsg);
      S.log.push({ t: E.dateText(), text: d.name + ' 了结了。' });
      return;
    }
    E.apply(d.penalty || {});
    S.notices.push(d.msg || ('「' + d.name + '」到期了。'));
    S.log.push({ t: E.dateText(), text: d.name + ' 到期未办。' });
    if (d.onDue) d.onDue();
  });
};

E.daysLeft = function (d) {
  return Math.max(0, Math.ceil(d.due - S.dayNum));
};

/* ---------- 结局 ---------- */

E.endGame = function (why) {
  if (S.ended) return;

  const deep = S.npcs.filter(n => n.rel.aff >= 60).length;
  const loyal = S.npcs.filter(n => n.rel.loy >= 50).length;
  const n = (v) => clamp(v, 0, 100);

  const parts = {
    morale:   n(S.morale) * 0.28,
    prestige: n(E.presTotal() * 1.45) * 0.22,
    people:   n((S.people - 50) / 70 * 100) * 0.20,
    food:     n(S.food / 120 * 100) * 0.10,
    stage:    n(S.stage >= 1 ? 60 : 0) * 0.10,
    rel:      n(deep * 30 + loyal * 10) * 0.10
  };

  let score = 0;
  for (const k in parts) score += parts[k];
  score = clamp(Math.round(score), 0, 100);

  let rank = 'D', label = '空手而归';
  for (const r of W.RANKS) { if (score >= r.min) { rank = r.rank; label = r.label; break; } }

  let title = '', text = '';
  if (why === 'famine') {
    title = '饿殍';
    text = '第三个饥荒的月份到来时，鸦落谷已经没有人再提「明年春天」这四个字了。\n\n谷仓是空的。村里的狗先不见了，然后是羊，然后是……你不愿意再想下去。\n\n博恩在一个早上把账本放在你桌上，说：「领主，走吧。」\n\n你没有走。但鸦落谷已经空了。';
  } else if (why === 'revolt') {
    title = '哗变';
    text = '先是有人不肯下地，然后是有人不肯缴租，最后是庄园门口聚了三十几个人。\n\n他们不说话，只是站着。你认得其中大部分的脸。\n\n薇拉站在人群最前面，想说什么，被人拉住了袖子。\n\n那天晚上，庄园的火烧了半宿。';
  } else if (why === 'abandon') {
    title = '空谷';
    text = '最后一个人是在一个下雨的早上走的。\n\n他没有跟你告别，只把门轻轻带上。\n\n你在庄园里坐了一整天。风从西翼那个没修好的缺口里进来，绕着空屋子转了一圈，又出去了。\n\n鸦落谷重新变回了「狼谷」。';
  } else {
    title = '开春';
    text = '雪化了。\n\n先是屋檐开始滴水，滴了一整天，然后是溪水涨起来，声音在夜里能传到庄园里。\n\n南山坡的土翻了出来，黑的，湿的，攥一把能捏出指印。有人在田埂上站了很久，一句话没说。\n\n冬天过去了。鸦落谷还在。';
  }

  S.ended = { why: why, rank: rank, label: label, score: score, title: title, text: text };
  S.log.push({ t: E.dateText(), text: '—— ' + title + ' ——' });
};

/* 每回合开始时清空「在场」标记 */
E.clearHere = function () {
  S.npcs.forEach(n => {
    if (n.gone) { n.here = false; return; }
    n.here = !!(n.wound || n.joined || (n.fromEvent && !n.invited));
  });
};

/* ---------- 场景 ---------- */

function scene(head, blocks, options) {
  return { head: head, blocks: blocks, options: options };
}

function head(obj) {
  return {
    date: E.dateText(),
    place: (obj && obj.place) || (W.LOCS[S.loc].region + ' · ' + W.LOCS[S.loc].name),
    weather: S.weather || '',
    season: W.seasonName(S.time.m)
  };
}

E.emit = function (sc) {
  // 期限到期的通知，插在下一幕开头
  if (S.notices && S.notices.length) {
    const nb = S.notices.map(n => ({ t: 'p', v: n }));
    sc.blocks = nb.concat(sc.blocks || []);
    S.notices = [];
  }
  S.lastScene = sc;
  if (E.onScene) E.onScene(sc);
  return sc;
};

/* ---------- 行动菜单 ---------- */

/* 眼前的事：由当前场景与人物状态临时生成 */
E.contextActions = function () {
  const out = [];
  const here = S.npcs.filter(n => n.here && !n.gone);

  /* 「眼前」只放一条：当下最该处理的那件事。
     其余的人照样在「与人」里，不会消失。 */
  const focus = here.find(n => n.wound)
    || here.find(n => n.fromEvent && !n.asked)
    || here.find(n => n.fromEvent && n.asked && !n.invited)
    || null;

  if (focus) {
    if (focus.wound) {
      out.push({
        key: '医', group: 'now',
        label: '替' + focus.name + '处理伤口',
        hint: '学识判定 · 药和布要花 2 银币',
        act: () => E.treatNpc(focus.id)
      });
    } else if (!focus.asked) {
      out.push({
        key: '问', group: 'now',
        label: '问' + focus.name + '的来历',
        hint: '好感 + · 她未必肯说',
        act: () => E.askNpc(focus.id)
      });
    } else {
      out.push({
        key: '家', group: 'now',
        label: '问' + focus.name + '：愿不愿意留下',
        hint: '忠诚 + · 决定她去留',
        act: () => E.inviteNpc(focus.id)
      });
    }
  }

  if (S.food < E.foodNeed() * 0.7) {
    out.push({
      key: '粮', group: 'now',
      label: '仓里要空了，先想办法弄粮',
      hint: '剩 ' + Math.round(S.food) + ' 石 · 一个月要 ' + Math.round(E.foodNeed()) + ' 石',
      act: () => E.marketMenu()
    });
  }

  return out.slice(0, 5);
};

E.actionScene = function (extra) {
  // 从某个地方出来：事情办完了，人还留在原地
  if (S.ret) {
    const r = S.ret;
    S.ret = null;
    if (r.kind === 'chapel') return E.chapelScene(true);
    if (r.kind === 'forest') return E.forestScene();
    if (r.kind === 'place') {
      const sc2 = E.placeScene(r.city, r.place);
      if (sc2) { sc2.append = true; return sc2; }
    }
  }

  const now = E.contextActions();
  const meet = [];
  const act = [];
  const self = [];

  // —— 与人：在场的人 ——
  S.npcs.filter(n => n.here && !n.gone).forEach(n => {
    meet.push({
      key: '人', group: 'meet',
      label: '与' + n.name + '相处',
      hint: n.role + ' · 好感 ' + n.rel.aff + ' · ' + E.relStage(n.rel.aff),
      act: () => E.visitNpc(n.id)
    });
  });

  // —— 日常 ——
  W.ACTIONS.filter(a => a.id !== 'travel').forEach(a => {
    let dis = false, why = '';
    if (a.id === 'farm') {
      if (S.copper < 1920) { dis = true; why = '钱不够（需 2 金币）'; }
      if (S.people < 20) { dis = true; why = '没有人手'; }
    }
    if (a.id === 'drill' && S.people < 15) { dis = true; why = '没有人可练'; }
    if (!dis && S.ap < (a.ap || 1)) { dis = true; why = '行动点不够（需 ' + (a.ap || 1) + ' 点）'; }
    act.push({
      key: a.icon || '·', group: 'act',
      label: a.label,
      hint: dis ? why : a.hint,
      disabled: dis,
      warn: dis,
      act: a.id === 'market' ? () => E.marketMenu()
         : a.id === 'build' ? () => E.buildMenu()
         : a.id === 'forest' ? () => E.forestMenu()
         : () => E.act(a.id)
    });
  });

  const dues = E.payables();
  if (dues.length) {
    const urgent = dues.some(p => p.days <= 30);
    act.push({
      key: '断', group: 'act', label: '处理官面上的事',
      hint: dues.length + ' 件没结的账' + (urgent ? ' · 有一件快到期了' : ''),
      warn: urgent,
      act: () => E.duesMenu()
    });
  }

  // 建筑带来的额外行动
  if (S.buildings.ranch) {
    act.push({
      key: '鸡', group: 'act', label: '照料牲畜',
      hint: '鸡 ' + S.animals.chicken + ' · 羊 ' + S.animals.sheep + ' · 牛 ' + S.animals.cow + ' · 蛋 ' + Math.floor(S.goods.egg),
      act: () => E.ranchMenu()
    });
  }
  if (S.buildings.loom) {
    act.push({
      key: '织', group: 'act', label: '织布缝衣',
      hint: '羊毛 ' + Math.floor(S.goods.wool) + ' · 布 ' + Math.floor(S.goods.cloth) + ' · 冬衣 ' + Math.floor(S.goods.clothes),
      act: () => E.craftMenu()
    });
  }
  if (S.buildings.forge) {
    act.push({
      key: '锤', group: 'act', label: '打造兵器',
      hint: '铁 ' + Math.round(S.iron) + ' · 现有兵器 ' + (S.weapons || 0),
      act: () => E.forgeMenu()
    });
  }

  // 收工
  act.push({
    key: '夜', group: 'act', label: '今天到此为止',
    hint: '行动点 ' + S.ap + '/' + S.apMax + ' · 睡一觉，进次日',
    act: () => { E.endDay(); E.openMenu(); }
  });

  // —— 自身 ——
  self.push({
    key: '学', group: 'self', label: '精进自身',
    hint: '两天起 · 练体、学商、读书、交际、独处',
    act: () => E.trainMenu()
  });

  // —— 出门（归在日常，但排在最后） ——
  act.push({
    key: '行', group: 'act', label: '出远门',
    hint: '数日 · 长河城、石桥镇、修道院、铁砧堡……',
    act: () => E.travelMenu()
  });

  let opts = now.concat(meet, act, self);
  if (extra) opts = extra.concat(opts);

  const base = [{ t: 'p', v: E.dailyFlavor() }];
  return scene(head(), base, opts);
};

/* ---------- 队伍 ---------- */

E.canInvite = function (npc) {
  if (!npc || npc.gone) return false;
  if ((S.party || []).indexOf(npc.id) >= 0) return false;
  if ((S.party || []).length >= 3) return false;
  return npc.rel.aff >= 55 || (npc.isResident && npc.rel.loy >= 45);
};

E.inParty = function (npc) {
  return (S.party || []).indexOf(npc.id) >= 0;
};

E.toggleParty = function (id) {
  const npc = S.npcs.find(n => n.id === id);
  if (!npc) return;
  S.party = S.party || [];
  const i = S.party.indexOf(id);
  if (i >= 0) { S.party.splice(i, 1); }
  else {
    if (S.party.length >= 3) { if (typeof UI !== 'undefined') UI.toast('最多带三个人'); return; }
    if (!E.canInvite(npc)) return;
    S.party.push(id);
  }
  E.save();
  if (typeof UI !== 'undefined') UI.renderSide();
};

E.partyMembers = function () {
  return (S.party || []).map(id => S.npcs.find(n => n.id === id)).filter(n => n && !n.gone);
};

/* ---------- 眼前：处理伤口 / 问来历 / 邀请留下 ---------- */

E.treatNpc = function (id) {
  const npc = S.npcs.find(n => n.id === id);
  if (!npc) return E.openMenu();
  const blocks = [{ t: 'p', v: pick([
    '你让人取来干净的布和一点草药。',
    '你蹲下去，先把她的裤腿剪开。伤口比看上去更深。',
    '你把手在溪水里洗了洗，然后蹲到她旁边。'
  ]) }];

  const medCost = 24;
  if (S.copper < medCost) {
    blocks.push({ t: 'p', v: '可你翻遍了口袋，连买一卷干净布的钱都凑不齐。\n\n她看着你，没说话。' });
    S.turn++;
    if (S.ended) return E.emitEnding();
    E.pending = { type: 'action' };
    const sc = E.actionScene();
    sc.blocks = blocks; sc.append = true;
    return E.emit(sc);
  }
  S.copper -= medCost;

  const r = E.judge({ diff: 2, attr: 'lore' }, {});
  let rel = {};
  if (r.tier === 'fail') {
    blocks.push({ t: 'p', v: '你按得太用力，她闷哼了一声，伤口又渗出血来。\n\n「……笨手笨脚。」她说，但没有推开你。' });
    rel = { aff: 1, loy: 2 };
  } else {
    npc.wound = false;
    if (npc.race === '兽人') {
      blocks.push({ t: 'p', v: '兽人的伤口好得比人快。三天后结痂，第七天她就能自己走路。\n\n她一直没道谢。只是某天早上，你发现门口多了一捆劈好的柴。' });
    } else {
      blocks.push({ t: 'p', v: '布条一圈一圈缠上去，缠到第五圈，她的呼吸才慢慢匀了。\n\n「好了。」你说。\n\n她低头看着自己的腿，看了很久，才说了句：「嗯。」' });
    }
    rel = r.tier === 'great' ? { aff: 4, loy: 8 } : { aff: 3, loy: 6 };
  }

  const relOut = E.addRel(npc, rel);
  blocks.push({ t: 'verdict', tier: r.tier, name: TIERS[r.tier].name, score: r.score, diff: r.diff, attr: r.attr });
  blocks.push({ t: 'deltas', list: [{ label: '金库', v: -medCost }], rel: relOut });

  S.turn++;
  if (S.ended) return E.emitEnding();
  E.pending = { type: 'action' };

/* ---------- 执行行动 ---------- */

E.act = function (id) {
  if (S.ended) return;
  E.clearHere();
  S.turn++;
  S.femaleGap++;

  const a = W.ACTIONS.find(x => x.id === id);
  if (!a) return E.openMenu();

  // 军务是一张菜单，进菜单本身不花行动点
  if (id === 'drill') { S.loc = 'manor'; return E.drillMenu(); }
  // 小教堂也是一张菜单：里面有自己的固定事情要做
  if (id === 'chapel') { S.loc = 'chapel'; return E.chapelMenu(); }

  const cost = a.ap || 1;
  if (S.ap < cost) {
    return E.openMenu();
  }

  let blocks = [];

  if (id === 'farm') {
    S.copper -= 1920;
    S.land += 6; S.fields += 6;
    S.wood = Math.max(0, S.wood - 1);
    blocks.push({ t: 'p', v: '六亩荒地翻了出来。土是生的，要养一季才有劲。' });
    blocks.push({ t: 'deltas', list: [{ label: '金库', v: -1920 }, { label: '开垦', v: 6, unit: ' 亩' }, { label: '木材', v: -1 }] });
  } else if (id === 'survey') {
    const m = ri(1, 3);
    S.morale = clamp(S.morale + m, 0, 100);
    blocks.push({ t: 'deltas', list: [{ label: '民心', v: m }] });
    S.loc = 'village';
  } else if (id === 'court') {
    const m = ri(1, 2);
    S.morale = clamp(S.morale + m, 0, 100);
    blocks.push({ t: 'deltas', list: [{ label: '民心', v: m }] });
  }

  S.loc = a.loc || S.loc;
  S.ap -= cost;

  // 事件
  const stq = E.pickStory();
  if (stq) {
    if (S.ap <= 0) E.endDay();
    return E.startStory(stq, blocks);
  }

  let ev = null;
  if (chance(0.55)) ev = E.pickEvent(a.pool, S.loc);

  if (!ev && S.femaleGap >= 2 && S.npcs.length < 32 && chance(0.34)) {
    if (S.ap <= 0) E.endDay();
    return E.meetScene(blocks);
  }

  if (S.ap <= 0) E.endDay();

  if (ev) return E.startEvent(ev, blocks);

  // 日常小景
  const daily = E.dailyFlavor();
  const lastIdx = blocks.length - 1;
  if (lastIdx >= 0 && blocks[lastIdx].t === 'deltas') {
    blocks.splice(lastIdx, 0, { t: 'p', v: daily });
  } else {
    blocks.push({ t: 'p', v: daily });
  }
  const sc = E.actionScene();
  sc.blocks = blocks;
  E.pending = { type: 'action' };
  return E.emit(sc);
};

/* ---------- 事件流程 ---------- */

E.startEvent = function (ev, pre) {
  const blocks = (pre || []).slice();
  let npc = null;

  if (ev.npc === 'new' && !S.flags['met_' + ev.id]) {
    npc = NPC.generate({ pool: ev.npcPool, forceName: ev.npcForceName, loc: S.loc });
    if (ev.npcId) {
      npc.id = ev.npcId;
      if (N.FIXED_GEAR && N.FIXED_GEAR[ev.npcId]) {
        npc.gear = JSON.parse(JSON.stringify(N.FIXED_GEAR[ev.npcId]));
      }
    }
    if (ev.npcWound) npc.wound = true;
    S.flags['met_' + ev.id] = true;
    npc.fromEvent = ev.id;
    S.npcs.push(npc);
    S.stats.meet++;
    S.femaleGap = 0;
  }

  blocks.push({ t: 'p', v: ev.text });
  if (npc) {
    blocks.push({ t: 'npcIntro', npc: npc });
  }

  S.recentEvents.push(ev.id);
  if (S.recentEvents.length > 6) S.recentEvents.shift();
  if (ev.once) S.flags['ev_' + ev.id] = true;

  const opts = ev.options.map((o, i) => {
    let dis = false, why = '';
    if (o.cost) {
      if (o.cost.copper && S.copper < o.cost.copper) { dis = true; why = '钱不够（需 ' + W.moneyShort(o.cost.copper) + '）'; }
      if (o.cost.food && S.food < o.cost.food) { dis = true; why = '存粮不够（需 ' + o.cost.food + ' 石）'; }
      if (o.cost.wood && S.wood < o.cost.wood) { dis = true; why = '木材不够'; }
      if (o.cost.iron && S.iron < o.cost.iron) { dis = true; why = '铁不够'; }
    }
    return {
      key: String.fromCharCode(65 + i),
      label: o.label,
      hint: dis ? why : (o.hint || ''),
      warn: dis,
      disabled: dis,
      act: () => E.resolveOption(ev, i, npc, o)
    };
  });

  E.pending = { type: 'event', ev: ev, npc: npc };
  const sc = scene(head(), blocks, opts);
  return E.emit(sc);
};

E.resolveOption = function (ev, idx, npc, opt) {
  const blocks = [];
  S.stats.events++;
  S.turn++;

  let tier, score = null, res;
  if (opt.auto) {
    tier = 'ok';
  } else {
    res = E.judge(opt, ev);
    tier = res.tier; score = res.score;
  }

  // 扣成本
  if (opt.cost) {
    for (const k in opt.cost) {
      if (k === 'copper') S.copper -= opt.cost[k];
      if (k === 'food') S.food -= opt.cost[k];
      if (k === 'wood') S.wood = Math.max(0, S.wood - opt.cost[k]);
      if (k === 'iron') S.iron = Math.max(0, S.iron - opt.cost[k]);
    }
  }

  const src = (tier === 'great' && opt.bonus) ? opt.bonus
            : (tier === 'partial' && opt.toll) ? opt.toll
            : (tier === 'fail' ? opt.fail : opt.ok);

  let text = src.text || opt.ok.text;
  blocks.push({ t: 'p', v: text });

  // 数值
  let deltaSum = {};
  const addD = (d, mult) => {
    if (!d) return;
    for (const k in d) {
      if (k === 'faction') {
        deltaSum.faction = deltaSum.faction || {};
        for (const f in d.faction) deltaSum.faction[f] = (deltaSum.faction[f] || 0) + d.faction[f];
      } else {
        deltaSum[k] = (deltaSum[k] || 0) + Math.round(d[k] * (mult || 1));
      }
    }
  };

  if (tier === 'great') { addD(opt.ok.delta, 1.3); addD(opt.bonus && opt.bonus.delta); }
  else if (tier === 'ok') addD(opt.ok.delta, 1);
  else if (tier === 'partial') { addD(opt.ok.delta, 0.5); addD(opt.toll && opt.toll.delta); }
  else addD(opt.fail.delta, 1);

  const changes = E.apply(deltaSum);

  // 有人会就此离开
  if (src.npcGone && npc) { npc.gone = true; npc.here = false; }

  // 关系
  let relOut = [];
  if (npc) {
    npc.talks++;
    const r = opt.npcRel || (opt.curNpcRel) || null;
    if (r) relOut = E.addRel(npc, r);
    else if (tier === 'great') relOut = E.addRel(npc, { aff: 3, loy: 1 });
    else if (tier === 'ok') relOut = E.addRel(npc, { aff: 2 });
    else if (tier === 'partial') relOut = E.addRel(npc, { aff: 1 });
    else relOut = E.addRel(npc, { aff: -2 });
    npc.here = true;
  }

  // 沉默的备注
  if (npc && npc.blocked) {
    blocks.push({ t: 'note', v: npc.name + '没有再往下说。有些东西，得等你先做点什么。' });
    npc.blocked = false;
  }

  // 待办
  if (opt.todo && S.todos.indexOf(opt.todo) < 0) {
    S.todos.push(opt.todo);
    blocks.push({ t: 'note', v: '记下：' + opt.todo });
  }

  // 事件标记
  if (opt.flag) S.flags[opt.flag] = true;
  if (opt.faction) E.apply({ faction: opt.faction });

  // 角标
  blocks.push({ t: 'verdict', tier: tier, name: TIERS[tier].name, score: score, diff: res ? res.diff : null, attr: res ? res.attr : null });
  if (changes.length || relOut.length) {
    blocks.push({ t: 'deltas', list: changes, rel: relOut });
  }

  // 结局检查
  if (tier === 'fail' && S.morale <= 0) E.endGame('revolt');
  if (S.ended) return E.emitEnding();

  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

E.travelTo = function (id) {

/* ---------- 城里 ---------- */

E.cityScene = function (cityId, pre) {
  const c = PLACES[cityId];
  if (!c) return null;
  S.placeCtx = null;
  const blocks = (pre || []).slice();
  blocks.push({ t: 'p', v: c.intro });
  const fl = PLACES.FLAVOR[cityId];
  if (fl) blocks.push({ t: 'p', v: pick(fl) });

  const opts = c.places.map(p => ({
    key: p.icon, label: p.name,
    hint: p.desc,
    act: () => E.enterPlace(cityId, p.id)
  }));

  opts.push({
    key: '家', label: '回鸦落谷',
    hint: '往返 ' + (W.TRAVEL_DAYS[cityId] * 2) + ' 天',
    act: () => E.goHome()
  });

  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'place' };
  return sc;
};

E.cityMenu = function (cityId, pre) {
  const sc = E.cityScene(cityId, pre);
  if (!sc) return E.openMenu();
  return E.emit(sc);
};

E.placeScene = function (cityId, placeId, pre) {
  const c = PLACES[cityId];
  if (!c) return null;
  const p = c.places.find(x => x.id === placeId);
  if (!p) return E.cityScene(cityId, pre);
  S.placeCtx = { city: cityId, place: placeId };

  const blocks = (pre || []).slice();
  blocks.push({ t: 'p', v: p.desc });
  const fl2 = PLACES.FLAVOR[cityId];
  if (fl2) blocks.push({ t: 'p', v: pick(fl2) });

  const opts = p.acts.map(a => E.actOption(cityId, placeId, a));

  opts.push({
    key: '返', label: '去别处看看',
    hint: '回到' + c.name + '的街上',
    act: () => E.cityMenu(cityId)
  });
  opts.push({
    key: '家', label: '回鸦落谷', hint: '',
    act: () => E.goHome()
  });

  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'place' };
  return sc;
};

E.enterPlace = function (cityId, placeId, pre) {
  const sc = E.placeScene(cityId, placeId, pre);
  if (!sc) return E.openMenu();
  return E.emit(sc);
};

E.backToPlace = function () {
  if (S.placeCtx) return E.enterPlace(S.placeCtx.city, S.placeCtx.place);
  return E.openMenu();
};

E.goHome = function () {
  const from = S.loc;
  const days = W.TRAVEL_DAYS[from] * 2;
  S.loc = 'manor';
  S.placeCtx = null;
  S.food = Math.max(0, S.food - 2);
  S.turn++;
  E.advance(days);
  S.ap = S.apMax;
  if (S.ended) return E.emitEnding();

  const blocks = [{ t: 'p', v: '回程走了 ' + days + ' 天。\n\n' + pick([
    '到谷口的时候天已经黑了，庄园的窗户里有灯。',
    '博恩在村口等着，接过你的缰绳，说：「回来了。」',
    '路上下了一场小雪，落到地上就化了。'
  ]) }];

  const sc = E.actionScene();
  sc.blocks = blocks;
  E.pending = { type: 'action' };
  return E.emit(sc);
};
