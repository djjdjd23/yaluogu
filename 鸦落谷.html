  wander:   { key: '走', label: '四处走走', hint: '不知道会遇上什么' }
};

E.actOption = function (cityId, placeId, actId) {
  const meta = E.ACT_INFO[actId] || { key: '·', label: actId, hint: '' };
  return {
    key: meta.key,
    label: meta.label,
    hint: meta.hint,
    act: () => E.placeAct(cityId, placeId, actId)
  };
};

E.placeAct = function (cityId, placeId, actId) {
  switch (actId) {
    case 'market':    return E.marketMenu();
    case 'loan':      return E.loanMenu();
    case 'rare':      return E.rareMenu();
    case 'slaves':    return E.slaveMenu();
    case 'audience':  return E.audience(cityId);
    case 'tithe':     return E.titheScene();
    case 'bridge':    return E.bridgeScene();
    case 'tavern':    return E.rumorScene(true);
    case 'info':      return E.rumorScene(false);
    case 'job':       return E.jobScene();
    case 'herbs':     return E.herbMenu();
    case 'orphans':   return E.orphanScene();
    case 'iron':      return E.ironMenu();
    case 'weapons':   return E.weaponMenu();
    case 'mercs':     return E.mercMenu();
    case 'elf_trade': return E.elfMenu();
    case 'orc_hire':  return E.orcMenu();
    case 'wander':    return E.wanderScene();
    default:          return E.backToPlace();
  }
};

/* 求见：能见到谁 */
E.audience = function (cityId) {
  const who = (PLACES.WHO[cityId] || [])[0];
  const blocks = [];

  if (who) {
    const spec = PLACES.NOTABLES[who];
    let npc = S.npcs.find(n => n.id === spec.id);
    if (!npc) {
      npc = NPC.makeFixed({
        id: spec.id, name: spec.name, fullName: spec.fullName,
        role: spec.role, age: spec.age, race: spec.race,
        body: spec.body, hairColor: spec.hairColor, hairStyle: spec.hairStyle,
        eyes: spec.eyes, mark: spec.mark, voice: spec.voice, temper: spec.temper,
        archetype: spec.archetype, path: spec.path, origin: spec.origin,
        goal: spec.goal, secret: spec.secret, look: spec.look,
        habit: spec.habit, taboo: spec.taboo, gear: spec.gear, aff: 8, loy: 0
      });
      npc.talents = (N.TALENT_BY_PATH[spec.path] || []).slice(0, 2);
      S.npcs.push(npc);
    }
    npc.here = true;

    blocks.push({ t: 'p', v: pick([
      '通报之后等了半个时辰，才有人来领你进去。',
      '门房看了你的封地文书，看了很久，然后侧身让开。',
      '你在门外站到太阳偏西，终于听见里面传出话：「进来。」'
    ]) });
    blocks.push({ t: 'npcIntro', npc: npc });
    blocks.push({ t: 'p', v: '「' + npc.name + '。」她说，「鸦落谷的。坐。」\n\n' + npc.habit + '。' });

    return E.emit(scene(head(), blocks, [
      { key: 'A', label: '谈领地的事', hint: '威望 · 可能得到实际好处', act: () => E.audienceTalk(npc, 'deal') },
      { key: 'B', label: '问北境的局势', hint: '情报 · 也可能被反问', act: () => E.audienceTalk(npc, 'news') },
      { key: 'C', label: '只是来打个招呼', hint: '安全 · 好感 +', act: () => E.audienceTalk(npc, 'greet') },
      { key: '←', label: '退出去', hint: '', act: () => E.backToPlace() }
    ]));
  }

  // 没有固定人物的地方：遇到随机的路人或小事
  blocks.push({ t: 'p', v: '你在门外站了很久，最后只有一个管事的出来，说主人不见客。' });
  const sc = E.actionScene();
  sc.blocks = blocks;
  return E.emit(sc);
};

E.audienceTalk = function (npc, kind) {
  const blocks = [];
  let rel = {}, delta = {};
  const r = E.judge({ diff: kind === 'deal' ? 4 : 3, attr: kind === 'news' ? 'lore' : 'charm' }, {});

  if (kind === 'deal') {
    if (r.tier === 'fail') {
      blocks.push({ t: 'p', v: '「你的地，我知道。」她把手里的炭笔放下，「五十个人，一个冬天。你要我怎么帮你？」\n\n你答不上来。\n\n「回去把粮种出来。」她说，「再来找我。」' });
      rel = { aff: -2 };
    } else {
      const coin = r.tier === 'great' ? 3600 : 1800;
      S.copper += coin;
      delta = { copper: coin };
      blocks.push({ t: 'p', v: '「我不白给人东西。」她说，「但北境多一个能种粮的领主，对我有好处。」\n\n她写了张字条，盖上印：「拿去商会街，他们会给你一笔。」\n\n「记住，这不是赏，是押。」' });
      rel = { aff: r.tier === 'great' ? 6 : 3 };
    }
  } else if (kind === 'news') {
    blocks.push({ t: 'p', v: '「北境？」她把手里的东西放下，「三件事。」\n\n「赤牙部落在往南挪。铁砧堡的粮撑不到明年。石桥镇在卖地。」\n\n她看了你一眼：「第三件，你最好留意。」' });
    rel = { aff: 3 };
    if (!S.todos.includes('石桥男爵在卖地')) S.todos.push('石桥男爵在卖地');
  } else {
    blocks.push({ t: 'p', v: '你什么都没提，只是行了个礼。\n\n她似乎有点意外，然后点了点头：「有心了。」' });
    rel = { aff: 4 };
  }

  const relOut = E.addRel(npc, rel);
  blocks.push({ t: 'verdict', tier: r.tier, name: TIERS[r.tier].name, score: r.score, diff: r.diff, attr: r.attr });
  if (relOut.length || Object.keys(delta).length) {
    blocks.push({ t: 'deltas', list: Object.keys(delta).map(k => ({ label: '金库', v: delta[k] })), rel: relOut });
  }

  E.pending = { type: 'npc', npc: npc };
  const sc = E.placeScene(S.placeCtx.city, S.placeCtx.place);
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

/* 打听消息 / 酒馆 */
E.rumorScene = function (paid) {
  const blocks = [];
  if (paid) {
    if (S.copper < 60) {
      blocks.push({ t: 'p', v: '你摸了摸口袋，连一杯酒钱都不够。\n\n酒馆里的人看了你一眼，又低下头去。' });
      const sc = E.placeScene(S.placeCtx.city, S.placeCtx.place);
      sc.blocks = blocks; sc.append = true;
      return E.emit(sc);
    }
    S.copper -= 60;
    blocks.push({ t: 'p', v: '你要了一杯淡啤酒，坐在角落里。\n\n酒馆这种地方，消息比酒便宜。' });
  } else {
    blocks.push({ t: 'p', v: '你跟人搭话，问了两句北边的事。' });
  }

  const pool = [
    () => { S.prestige = clamp(S.prestige + 1, 0, 100); return '有人说，鸦落谷那个新领主还算讲道理。这话传得不快，但传开了。'; },
    () => { S.food = Math.max(0, S.food - 1); return '粮价又涨了。有人在算，冬天一石麦能换到什么。'; },
    () => { if (!S.todos.includes('赤牙部落在往南挪')) S.todos.push('赤牙部落在往南挪'); return '赤牙部落的人最近老在山口出现。他们不抢，就是站着看。'; },
    () => { S.morale = clamp(S.morale + 2, 0, 100); return '有人从鸦落谷回来，说那里的井水是甜的。'; },
    () => { S.copper += 120; return '你顺手帮人看了张契书，对方塞了两枚银币给你。'; },
    () => '石桥男爵的管事最近常往长河城跑，跑得很勤。',
    () => '铁砧堡的商队少了一半。听说是没粮喂牲口。'
  ];
  const pickIdx = ri(0, pool.length - 1);
  const line = pool[pickIdx]();
  blocks.push({ t: 'p', v: '「' + line + '」' });
  blocks.push({ t: 'deltas', list: paid ? [{ label: '金库', v: -60 }] : [] });

  return E.simpleScene(blocks, [
    { key: '讯', label: paid ? '再来一杯，再听一会儿' : '再问问别的事',
      hint: paid ? '再花 60 铜' : '不要钱，但要看人脸色',
      disabled: paid && S.copper < 60, warn: paid && S.copper < 60,
      act: () => E.rumorScene(paid) },
    { key: '返', label: '不听了，出去', hint: '', act: () => E.backToPlace() }
  ]);
};

/* 打零工 */
E.jobScene = function () {
  const coin = ri(180, 420);
  S.copper += coin;
  S.ap -= 1;
  const blocks = [
    { t: 'p', v: pick([
      '你帮着卸了一整天的货，肩膀磨红了。',
      '码头缺人，你扛了半天麻袋。',
      '有人的屋顶塌了，你去搭了半天手。'
    ]) + '\n\n工钱当场结清，铜币上还带着别人的体温。' },

    { key: '工', label: '再干半天', hint: '1 点行动点 · 再挣几个铜板',
      disabled: S.ap < 1, warn: S.ap < 1, act: () => E.jobScene() },

/* 四处走走：随机遇人、遇事，办完还在这条街上 */
E.wanderScene = function () {
  const back = { kind: 'place', city: S.placeCtx.city, place: S.placeCtx.place };
  const roll = rnd();
  if (roll < 0.45 && S.npcs.length < 32) {
    const pre = [{ t: 'p', v: pick([
      '你沿着街道慢慢走，走到尽头又走回来。',
      '巷子里没什么人，只有一只猫蹲在墙头。',
      '风把晾着的布吹得乱响。'
    ]) }];
    S.ret = back;
    return E.meetScene(pre);
  }
  const ev = E.pickEvent(null, S.loc === 'manor' ? 'village' : S.loc);
  if (ev) { S.ret = back; return E.startEvent(ev, []); }

  const blocks = [{ t: 'p', v: E.dailyFlavor() }];
  const sc = E.placeScene(S.placeCtx.city, S.placeCtx.place);
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

/* ---------- 城里的各种菜单 ---------- */

E.capacity = function () {
  return 60 + (S.buildings.house || 0) * 12 + (S.buildings.barn ? 10 : 0);
};

/* 在地点里开一个子界面：保留正文上下文，但把选项换成子菜单自己的 */
E.simpleScene = function (blocks, opts) {
  const ctx = S.placeCtx;
  if (!ctx) return E.openMenu();
  const sc = E.placeScene(ctx.city, ctx.place);
  if (!sc) return E.openMenu();
  sc.blocks = blocks;
  sc.append = true;
  if (opts && opts.length) sc.options = opts;
  E.pending = { type: 'place' };
  return E.emit(sc);
};

/* 借贷 */
E.loanMenu = function () {
  const repayLeft = (S.loans || []).length;
  const blocks = [{ t: 'p', v: '誓约公证所在街角，石阶上有七墨刻的锁与锤。\n\n抄写员把羊皮纸铺开：「借多少，写清楚。名字也写清楚。」' }];
  const opts = [];
  if (repayLeft < 2) {
    opts.push({
      key: '契', label: '借 30 金币',
      hint: '九十天后还 40 · 还不上，名字记进册子',
      act: () => E.takeLoan()
    });
  } else {
    opts.push({ key: '契', label: '再借一笔', hint: '已经欠着两笔了，没人再借给你', disabled: true, warn: true, act: () => E.loanMenu() });
  }
  opts.push({ key: '←', label: '出去', hint: '', act: () => E.backToPlace() });
  return E.simpleScene(blocks, opts);
};

/* 稀罕货 */
E.rareMenu = function () {
  const stock = E.shopStock();
  const blocks = [{ t: 'p', v: pick([
    '柜台后面的东西不是摆在明面上的。老板看你出得起钱，才一件一件往外拿。',
    '「今日这几件。」掌柜把柜门打开一半，又合上，「看不上也没关系，过几天换。」',
    '屋里点着一盏灯，光只照着柜台那一小块。东西就摊在那儿，不多。'
  ]) }];
  if (!stock.length) {
    blocks.push({ t: 'p', v: '柜台上空了。\n\n「好东西就这几件，都让你挑走了。」掌柜把布重新盖上，「过些日子我再进货。」' });
  }
  const opts = [];

  stock.forEach(id => {
    const it = GEAR.MAP[id];
    if (!it) return;
    const can = S.copper >= it.price;
    opts.push({
      key: GEAR.SLOT_NAME[it.slot].charAt(0),
      label: it.name,
      hint: (can ? W.moneyShort(it.price) : '钱不够（' + W.moneyShort(it.price) + '）') +
        ' · ' + GEAR.SLOT_NAME[it.slot] + ' · ' + GEAR.LVL_NAME[it.lvl] + (can ? '' : '') +
        (GEAR.statText(it) ? ' · ' + GEAR.statText(it) : ''),
      disabled: !can, warn: !can,
      act: () => E.buyGear(it)
    });
  });

  PLACES.RARE.forEach(r => {
    const can = S.copper >= r.price;
    opts.push({
      key: '宝', label: r.name,
      hint: can ? W.moneyShort(r.price) + ' · ' + r.desc : '钱不够（' + W.moneyShort(r.price) + '）',
      disabled: !can, warn: !can,
      act: () => E.buyRare(r)
    });
  });

  opts.push({ key: '←', label: '不看了', hint: '', act: () => E.backToPlace() });
  return E.simpleScene(blocks, opts);
};

E.buyGear = function (it) {
  if (S.copper < it.price) return E.rareMenu();
  // 货架上就这一件，卖掉就下架，不能反复买同一件
  const si = (S.shopStock || []).indexOf(it.id);
  if (si < 0) {
    return E.simpleScene([{ t: 'p', v: '「那件已经出手了。」掌柜把柜门合上，「下回赶早。」' }],
      [{ key: '←', label: '看看别的', hint: '', act: () => E.rareMenu() }]);
  }
  S.shopStock.splice(si, 1);
  S.copper -= it.price;
  E.addItem(it.id);
  S.turn++;
  const blocks = [
    { t: 'p', v: it.text },
    { t: 'deltas', list: [{ label: '金库', v: -it.price }, { label: it.name, v: 1, abs: true }] }
  ];
  return E.simpleScene(blocks, [
    { key: '装', label: '现在就换上', hint: GEAR.statText(it), act: () => { E.equipAuto(it.id); return E.rareMenu(); } },
    { key: '←', label: '先收进包里', hint: '', act: () => E.backToPlace() }
  ]);
};

E.equipAuto = function (id) {
  const it = GEAR.MAP[id];
  if (!it) return;
  const g = S.player.gear;
  if (it.slot === 'trinket') {
    let idx = g.trinkets.findIndex(x => !x);
    if (idx < 0) idx = 0;
    E.equip('trinket', idx, id);
  } else {
    E.equip(it.slot, 0, id);
  }
};

E.buyRare = function (r) {
  S.copper -= r.price;
  const eff = Object.assign({}, r.eff);
  if (eff.weapons) { S.weapons = (S.weapons || 0) + eff.weapons; delete eff.weapons; }
  if (eff.lore) { S.player.attrs.lore = Math.min(20, S.player.attrs.lore + eff.lore); delete eff.lore; }
  if (Object.keys(eff).length) E.apply(eff);

  const blocks = [
    { t: 'p', v: r.text },
    { t: 'deltas', list: [{ label: '金库', v: -r.price }] }
  ];
  S.turn++;
  return E.simpleScene(blocks, [{ key: '←', label: '收好，走人', hint: '', act: () => E.backToPlace() }]);
};

/* 奴市 */
E.slaveMenu = function () {
  const cap = E.capacity();
  const blocks = [{ t: 'p', v: '石台上站着一排人，脖子上挂着木牌。\n\n一个穿黑裙的女人拿着册子站在旁边，头也不抬：「鸦落谷的领主。要什么？」\n\n（住处能容纳 ' + cap + ' 人，现在 ' + S.people + ' 人）' }];
  const opts = PLACES.SLAVES.map(s => {
    const full = S.people >= cap;
    const poor = S.copper < s.price;
    return {
      key: '奴', label: s.name,
      hint: full ? '住不下了，先盖房' : (poor ? '钱不够（' + W.moneyShort(s.price) + '）' : W.moneyShort(s.price) + ' · ' + s.desc),
      disabled: full || poor, warn: full || poor,
      act: () => E.buySlave(s)
    };
  });
  opts.push({ key: '←', label: '不买了', hint: '', act: () => E.backToPlace() });
  return E.simpleScene(blocks, opts);
};

E.buySlave = function (s) {
  if (S.people >= E.capacity()) {
    return E.simpleScene([{ t: 'p', v: '「住不下了。」她合上册子，「先盖房。」' }],
      [{ key: '←', label: '回去', hint: '', act: () => E.backToPlace() }]);
  }
  S.copper -= s.price;
  S.people += s.people;
  if (s.eff) E.apply(s.eff);
  const blocks = [
    { t: 'p', v: '钱付了，人从台上下来。\n\n「跟着走。」黑裙女人说，「从此以后你归鸦落谷。」\n\n那个人没说话，只是把包袱抱紧了一点。' },
    { t: 'deltas', list: [{ label: '金库', v: -s.price }, { label: '人口', v: s.people }] }
  ];
  S.turn++;
  return E.simpleScene(blocks, [{ key: '←', label: '带人回去', hint: '', act: () => E.backToPlace() }]);
};

/* 过桥税 */

  const opts = P.TRAIN.map(t => {

    return {
      key: P.ATTR_MAP[t.attr].short,
      label: t.label,
      hint: P.ATTR_MAP[t.attr].name + ' ' + cur + ' → ' + (cur + 1) + ' · 成功率约 ' + pct + '% · ' + t.days + ' 天',
      disabled: cur >= 20,
      warn: cur >= 20,
      act: () => E.doTrain(t)
    };
  });
  opts.push({ key: '←', label: '算了，去忙别的', hint: '', act: () => E.openMenu() });
  const blocks = [{ t: 'p', v: pick([
    '夜里还有一点时间。灯油要省着用。',
    '你把一天里能挤出来的那几个时辰在脑子里过了一遍。',
    '博恩说：「领主，您也歇一歇。」你没应。'
  ]) }];
  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return E.emit(sc);

E.trainChance = function (attrId) {
  const cur = E.attr(attrId);
  const n = S.player.trainCount[attrId] || 0;
  return Math.max(0.18, 0.88 - (cur - 6) * 0.05 - n * 0.04);
};

E.doTrain = function (t) {
  E.clearHere();
  const cur = E.attr(t.attr);
  const ok = chance(E.trainChance(t.attr));
  const blocks = [{ t: 'p', v: pick(P.TRAIN_TEXT[t.attr]) }];
  const name = P.ATTR_MAP[t.attr].name;

  if (ok && cur < 20) {
    S.player.attrs[t.attr] = cur + 1;
    blocks.push({ t: 'p', v: '第七天早上你发现，那件原来吃力的事，现在不那么吃力了。' });
    blocks.push({ t: 'deltas', list: [{ label: name, v: 1, abs: false }] });
  } else {
    blocks.push({ t: 'p', v: '练了很久，长进却看不出来。你心里清楚，越往上越难。' });
    S.player.trainCount[t.attr] = (S.player.trainCount[t.attr] || 0) + 0;
  }
  S.player.trainCount[t.attr] = (S.player.trainCount[t.attr] || 0) + 1;

  S.turn++;
  E.spendAP(2);
  if (S.ended) return E.emitEnding();

  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

      const blocks = [{ t: 'p', v: '教堂后面的墓园里有声音。\n\n一个老头蹲在一块没有字的碑前，用凿子一下一下地刻。刻得很慢。\n\n「他叫什么？」你问。\n\n「不知道。」他说，「没人知道。」' }];

];

E.pickChapelEvent = function () {
  const pool = E.CHAPEL_EVENTS.filter(e => !S.flags['cev_' + e.id] && e.cond());
  if (!pool.length) return null;
  return pick(pool);
};

E.startChapelEvent = function (ev, pre) {
  S.flags['cev_' + ev.id] = true;
  S.ret = { kind: 'chapel' };
  const r = ev.run();
  const blocks = (pre || []).concat(r.blocks);
  E.pending = { type: 'event', ev: { id: 'chapel_' + ev.id } };
  return E.emit(scene(head(), blocks, r.opts));
};

E.chapelBack = function (blocks) {
  S.ret = null;
  const sc = E.chapelScene(true);
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

/* ---------- 军务 ---------- */

E.troopCap = function () {
  return Math.max(1, Math.floor(S.people / 3));
};

E.armyStats = function () {
  const n = Math.max(0, Math.round(S.troops));
  const cap = E.troopCap();
  const barracks = S.buildings.barracks || 0;
  const drill = clamp(Math.round(S.troopDrill || 0), 0, 100);
  const arms = Math.max(0, Math.round(S.weapons || 0));
  const armsRatio = n > 0 ? Math.min(1, arms / n) : 0;

  // 单兵战力：底子 1 · 操练 +0.9 · 兵器 +0.7 · 兵营 +0.35
  const per = 1 + drill / 100 * 0.9 + armsRatio * 0.7 + (barracks ? 0.35 : 0);
  const power = n * per;

  return {
    n, cap, drill, arms, armsRatio, barracks,
    per: Math.round(per * 100) / 100,
    power: Math.round(power * 10) / 10,
    trainPer: Math.round(0.9 / 100 * 1000) / 1000
  };
};

E.recruitCost = function () {
  return 480;   // 每人 2 金币
};

E.drillMenu = function () {
  const A = E.armyStats();
  const blocks = [
    { t: 'p', v: '村北的空地被踩实了，边上一圈木桩，中间插着几根草人。\n\n博恩把花名册摊在石头上：「现在册子上是 ' + A.n + ' 个人。谷里能养的不止这些，看你要不要。」' },
    { t: 'p', v: '兵员 ' + A.n + ' / ' + A.cap + '（人口三分之一为上限）　·　'
      + '操练度 ' + A.drill + '　·　兵器 ' + A.arms + ' 件　·　'
      + '单兵战力 ' + A.per.toFixed(2) + '　·　合计战力 ' + A.power }
  ];

  const opts = [];
  const full = A.n >= A.cap;
  const poor = S.copper < E.recruitCost();

  opts.push({
    key: '兵', label: '招募 1 名士兵',
    hint: full ? '已经到人口的三分之一了，养不起更多' : (poor ? '钱不够（需 ' + W.moneyShort(E.recruitCost()) + '）' : W.moneyShort(E.recruitCost()) + ' · 每人一份口粮，从今往后月月要养'),
    disabled: full || poor, warn: full || poor,
    act: () => E.recruit(1)
  });
  opts.push({
    key: '兵', label: '招募 3 名士兵',
    hint: full ? '名额不够' : (S.copper < E.recruitCost() * 3 ? '钱不够' : W.moneyShort(E.recruitCost() * 3)),
    disabled: full || S.copper < E.recruitCost() * 3, warn: true,
    act: () => E.recruit(3)
  });
  opts.push({
    key: '操', label: '操练一天',
    hint: S.ap < 2 ? '行动点不够（需 2 点）' : '2 点 · 操练度 +' + (E.tal('drillBonus') ? '6~10' : '4~7') + ' · 存粮 −2',
    disabled: S.ap < 2 || A.n <= 0, warn: S.ap < 2 || A.n <= 0,
    act: () => E.trainTroops()
  });
  if (S.buildings.forge) {
    opts.push({
      key: '锤', label: '打造兵器',
      hint: '每柄要 2 铁 + 2 银 · 现有 ' + A.arms + ' 件',
      act: () => E.forgeMenu()
    });
  }
  opts.push({ key: '←', label: '回庄园', hint: '', act: () => E.openMenu() });

  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return E.emit(sc);
};

E.recruit = function (want) {
  const cap = E.troopCap();
  const room = Math.max(0, cap - Math.round(S.troops));
  const got = Math.min(want, room, Math.floor(S.copper / E.recruitCost()));
  if (got <= 0) {
    const why = room <= 0 ? '谷里养不了更多兵了——人口的三分之一，是这条线的上限。' : '钱不够。';
    const sc0 = E.drillMenu();
    sc0.blocks = [{ t: 'p', v: why }].concat(sc0.blocks);
    return E.emit(sc0);
  }
  const cost = got * E.recruitCost();
  S.copper -= cost;
  S.troops += got;
  S.troopDrill = clamp((S.troopDrill || 0) - 2, 0, 100);

  const blocks = [
    { t: 'p', v: pick([
      '来了 ' + got + ' 个。一个是屠户的儿子，一个是去年逃荒留下的，还有一个什么也没说，只是把名字报了。',
      '愿意吃这碗饭的人不多，但总有。' + got + ' 个人站在院子里，等你开口。',
      '博恩把新名字写在花名册最下面，笔尖顿了顿：「' + got + ' 个。先练三个月再说。」'
    ]) },
    { t: 'deltas', list: [{ label: '金库', v: -cost }, { label: '兵员', v: got, abs: true }] }
  ];
  S.turn++;
  E.spendAP(1);

  E.pending = { type: 'action' };
  const sc = E.afterAction(blocks);
  return sc;
};

E.trainTroops = function () {
  if (S.ap < 2 || S.troops <= 0) return E.drillMenu();
  const gain = E.tal('drillBonus') ? ri(6, 10) : ri(4, 7);
  const before = Math.round(S.troopDrill || 0);
  S.troopDrill = clamp(before + gain, 0, 100);
  S.food = Math.max(0, S.food - 2);
  S.morale = clamp(S.morale + 1, 0, 100);
  E.spendAP(2);
  S.turn++;

  const real = Math.round(S.troopDrill) - before;
  const blocks = [
    { t: 'p', v: pick([
      '从清晨练到日头偏西。先是对着草人，然后是彼此。有两个人被打趴下，爬起来继续。',
      '博恩不喊，只是一遍一遍做给他们看。做完一遍，让他们跟着做一遍。',
      '下了半天雨。你们在雨里站了一个时辰，谁也不许动。'
    ]) },
    { t: 'p', v: real > 0
      ? '操练度到了 ' + Math.round(S.troopDrill) + '。单兵战力 ' + E.armyStats().per.toFixed(2) + '。'
      : '已经练不动了。再练下去只是把力气白花——要更好的，得有兵营和老兵带。' },
    { t: 'deltas', list: [{ label: '操练度', v: real, abs: true }, { label: '存粮', v: -2 }, { label: '民心', v: 1 }] }
  ];

  E.pending = { type: 'action' };
  return E.afterAction(blocks);
};

/* 通用：一个行动结束后，把正文与行动菜单一起推上去 */
E.afterAction = function (blocks) {
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

/* ---------- 讨伐 ---------- */

E.lairTierMax = function () {
  let t = 1;
  if (S.dayNum >= 60) t++;
  if (S.dayNum >= 180) t++;
  return Math.min(3, t);
};

E.genLairs = function () {
  const tmax = E.lairTierMax();
  const pool = ECON.LAIRS.filter(l => l.lvl <= tmax);
  const out = [], used = [];
  for (let i = 0; i < 2 && pool.length; i++) {
    let cand = pool.filter(l => used.indexOf(l.type) < 0);
    if (!cand.length) break;
    // 第二个营地偏向高一级，让玩家有得选
    if (i === 1) {
      const hi = cand.filter(l => l.lvl === tmax);
      if (hi.length && chance(0.72)) cand = hi;
    }
    const l = pick(cand);
    used.push(l.type);
    out.push({ key: l.type, lvl: l.lvl, name: l.name, power: l.power, desc: l.desc, text: l.text });
  }
  return out;
};

E.raidMenu = function (pre) {
  if (!S.lairs) S.lairs = [];
  const wk = Math.floor(S.dayNum / 10);
  if (!S.lairs.length && S.lairWeek !== wk) {
    S.lairs = E.genLairs();
    S.lairWeek = wk;
  }
  const A = E.armyStats();

  const blocks = (pre || []).slice();
  blocks.push({ t: 'p', v: pick([
    '林子里有几处地方，猎户绕着走。博恩把听来的话一条一条说给你听。',
    '侦察的人回来了，裤腿上全是泥。他们把看到的东西画在木板上，画得很歪，但看得出。',
    '越往北，能吃人的东西越多。这些是最近听说的。'
  ]) });
  blocks.push({ t: 'p', v: '我方：兵员 ' + A.n + ' · 单兵战力 ' + A.per.toFixed(2) + ' · 合计战力 ' + A.power + '\n\n（讨伐要带兵。没有兵，去了只是送死。）' });

  const opts = [];
  const canFight = A.n >= 2;
  S.lairs.forEach((l, i) => {
    let dis = !canFight, why = '至少带两个人去';
    if (!dis && S.ap < 2) { dis = true; why = '行动点不够（需 2 点）'; }
    if (dis) {
      // 仍然显示，但锁住
    }
    const risky = A.power < l.power * 0.7 ? ' · 打不过' : (A.power < l.power ? ' · 有点悬' : ' · 有把握');
    opts.push({
      key: l.lvl === 3 ? '险' : (l.lvl === 2 ? '警' : '·'),
      label: '讨伐：' + l.name + '（' + ECON.LAIR_LVL_NAME[l.lvl] + '）',
      hint: dis ? why : l.desc + risky,
      disabled: dis, warn: dis || A.power < l.power,
      act: () => E.raid(i)
    });
  });

  const scoutDis = S.ap < 1;
  opts.push({
    key: '·', label: '再探一探',
    hint: scoutDis ? '行动点不够' : '1 点 · 换一批目标',
    disabled: scoutDis, warn: scoutDis,
    act: () => { S.ap -= 1; S.lairs = E.genLairs(); S.turn++; if (S.ap <= 0) E.endDay(); return E.raidMenu([{ t: 'p', v: '又派了两个人出去。第二天早上他们回来，说法和上一批不太一样。' }]); }
  });
  opts.push({ key: '←', label: '回林中', hint: '', act: () => E.forestMenu() });

  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return E.emit(sc);
};

E.raid = function (idx) {
  const l = (S.lairs || [])[idx];
  if (!l) return E.raidMenu();
  const A = E.armyStats();
  if (A.n < 2) return E.raidMenu([{ t: 'p', v: '没有人。你一个人去，只能把命留下。' }]);
  if (S.ap < 2) return E.raidMenu([{ t: 'p', v: '今天没力气了。' }]);

  S.ap -= 2;
  S.turn++;
  S.femaleGap++;

  const ratio = A.power / l.power;
  const diff = clamp(Math.round(9 - ratio * 3.2), -5, 14);
  const r = E.judge({ diff: diff, attr: 'body', noTroop: true }, {});

  const blocks = [{ t: 'p', v: l.text }];
  const changes = [];
  let lost = 0;
  let gain = 0, iron = 0, weap = 0, pres = 0;

  const base = { 1: 900, 2: 2600, 3: 5600 }[l.lvl];

  if (r.tier === 'great') {
    gain = Math.round(base * 1.4);
    iron = l.lvl; weap = l.lvl >= 3 ? 1 : 0;
    pres = l.lvl + 1;
    blocks.push({ t: 'p', v: pick([
      '结束得比想的快。它们没组织起来，一半死在自己窝里。',
      '你的人在谷口排成一条线，把出口堵死了。到中午就完了。',
      '博恩没让任何人往前冲。他们等着，等到里面的东西自己出来。'
    ]) });
  } else if (r.tier === 'ok') {
    gain = base;
    iron = Math.max(1, l.lvl - 1);
    pres = l.lvl;
    lost = chance(0.35) ? 1 : 0;
    blocks.push({ t: 'p', v: pick([
      '打了半个时辰。清干净的时候，有两个人蹲在地上起不来。',
      '它们跑了几个。剩下的不会再回来。',
      '血从坡上流到溪里，颜色很快就淡了。'
    ]) });
  } else if (r.tier === 'partial') {
    gain = Math.round(base * 0.55);
    lost = ri(1, 2);
    S.morale = clamp(S.morale - 2, 0, 100);
    blocks.push({ t: 'p', v: pick([
      '赢了，但不算赢。里面还剩一半，你们退了出来。',
      '它们被打散了，但你的阵也散了。有人没回来。',
      '你们烧了外面的栅栏就往回走。火光在背后亮了很久。'
    ]) });
  } else {
    lost = ri(2, 4);
    pres = -2;
    S.morale = clamp(S.morale - 5, 0, 100);
    blocks.push({ t: 'p', v: pick([
      '撤退的时候踩塌了一处石堆。有人的腿被压在下面。',
      '第一个照面就倒了三个。你喊了退，然后自己也跑了。',
      '它们比听说的多。你们连尸首都没能带回来。'
    ]) });
  }

  // 兵员损失
  if (lost > 0) {
    const real = Math.min(Math.round(S.troops), lost);
    S.troops -= real;
    if (real) changes.push({ label: '兵员', v: -real, abs: true });
  }
  if (gain) { S.copper += gain; changes.push({ label: '金库', v: gain }); }
  if (iron) { S.iron += iron; changes.push({ label: '铁', v: iron }); }
  if (weap) { S.weapons = (S.weapons || 0) + weap; changes.push({ label: '兵器', v: weap, abs: true }); }
  if (pres) { S.prestige = clamp(S.prestige + pres, 0, 100); changes.push({ label: '威望', v: pres }); }

  // 从窝里翻出来的东西
  if (r.tier !== 'fail') {
    const dc = r.tier === 'great' ? 0.74 : (r.tier === 'ok' ? 0.44 : 0.16);
    if (chance(dc)) {
      const pool = GEAR.DROP[l.lvl] || GEAR.DROP[1];
      const it = E.addItem(pick(pool));
      if (it) {
        changes.push({ label: it.name, v: 1, abs: true });
        blocks.push({ t: 'p', v: '清到最后，有人在最里面翻出一样东西——' + it.name + '。\n\n' + it.text });
      }
    }
  }

  // 打下来的窝点，这个月不会再出现
  if (r.tier !== 'fail') S.lairs.splice(idx, 1);

  changes.push({ label: '操练度', v: r.tier === 'fail' ? 0 : 2, abs: true });
  if (r.tier !== 'fail') S.troopDrill = clamp((S.troopDrill || 0) + 2, 0, 100);

  S.log.push({ t: E.dateText(), text: '讨伐' + l.name + '（' + TIERS[r.tier].name + '）' });
  blocks.push({ t: 'verdict', tier: r.tier, name: TIERS[r.tier].name, score: r.score, diff: r.diff, attr: r.attr });
  blocks.push({ t: 'deltas', list: changes });

  if (S.ap <= 0) E.endDay();

  // 讨伐之后可能撞上别的事
  if (r.tier !== 'fail' && chance(0.28)) {
    const ev = E.pickEvent('adv', 'forest');
    if (ev) return E.startEvent(ev, blocks);
  }

  const sc = E.actionScene();
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

/* ---------- 幽暗森林 ---------- */

E.forestScene = function (pre) {
  const blocks = (pre || []).slice();
  blocks.push({ t: 'p', v: pick([
    '林子边缘有一条踩出来的小路。往北，树就越来越密。',
    '你站在林边，风从里面出来，带着湿木头和一点铁锈的味道。',
    '斧头、撬棍、绳子和火把，都堆在车板上。'
  ]) });

  const opts = ECON.FOREST.map(f => {
    const used = S.gather[f.id] || 0;
    const left = Math.max(0, f.monthly - used);
    let dis = false, why = '';
    if (left <= 0) { dis = true; why = '这个月林子已经给不出更多了'; }
    else if (S.ap < f.ap) { dis = true; why = '行动点不够（需 ' + f.ap + ' 点）'; }
    return {
      key: '林', label: f.name,
      hint: dis ? why : f.desc + ' · ' + f.ap + ' 点 · 本月还剩 ' + left + ' 次',
      disabled: dis, warn: dis,
      act: () => E.doForest(f)
    };
  });

  opts.push({
    key: '兵', label: '讨伐魔物营地',
    hint: (S.lairs && S.lairs.length ? S.lairs.length + ' 处已探明' : '还没探明') + ' · 带兵去，2 点',
    act: () => E.raidMenu()
  });

  opts.push({ key: '←', label: '还是回谷里', hint: '', act: () => E.openMenu() });

  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return sc;
};

E.forestMenu = function (pre) {
  return E.emit(E.forestScene(pre));
};

E.doForest = function (f) {
  E.clearHere();
  S.gather[f.id] = (S.gather[f.id] || 0) + 1;
  S.ap -= f.ap;
  S.turn++;
  S.femaleGap++;
  S.loc = 'forest';

  const blocks = [{ t: 'p', v: pick(f.text) }];

  if (f.id === 'adventure') {
    const ev = E.pickEvent('adv', 'forest');
    if (S.ap <= 0) E.endDay();
    if (ev) return E.startEvent(ev, blocks);
    // 没抽到事件，给一点小收获
    const coin = ri(120, 480);
    S.copper += coin;
    blocks.push({ t: 'p', v: '走了很久，最后只在一片空地上找到几只被丢弃的旧铁钉和一枚看不清年份的银币。\n\n天黑之前你退出了林子。' });
    const dlist = [{ label: '金库', v: coin }];
    // 往深处走也翻得到东西：低概率摸到一件装备
    if (chance(0.22)) {
      const it = E.addItem(pick(GEAR.DROP[1]));
      if (it) {
        dlist.push({ label: it.name, v: 1, abs: true });
        blocks.push({ t: 'p', v: '临走的时候，铁钉底下压着一样东西——' + it.name + '。\n\n' + it.text });
      }
    }
    blocks.push({ t: 'deltas', list: dlist });
    const sc0 = E.actionScene();
    sc0.blocks = blocks; sc0.append = true;
    return E.emit(sc0);
  }

  const bonus = 1 + E.tal('forestBonus');
  let changes = [];

  if (f.id === 'chop') {
    const n = Math.round(ri(2, 4) * bonus);
    S.wood += n;
    changes.push({ label: '木材', v: n });
  } else if (f.id === 'quarry') {
    const n = Math.round(ri(2, 3) * bonus);
    S.stone += n;
    changes.push({ label: '石头', v: n });
  } else if (f.id === 'mine') {
    const n = ri(1, 2);
    S.iron += n;
    changes.push({ label: '铁', v: n });
    if (chance(0.18)) {
      S.morale = clamp(S.morale - 1, 0, 100);
      blocks.push({ t: 'p', v: '洞顶掉了一块碎石，砸在你肩膀上。不重，但疼了三天。' });
    }
  }

  if (changes.length) blocks.push({ t: 'deltas', list: changes });

  if (S.ap <= 0) E.endDay();

  const stq = E.pickStory();
  if (stq) { S.ret = { kind: 'forest' }; return E.startStory(stq, blocks); }

  S.ret = { kind: 'forest' };
  const sc = E.actionScene();
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

E.doCraft = function (c) {
  for (const k in c.in) S.goods[k] -= c.in[k];
  for (const k in c.out) S.goods[k] += c.out[k];
  S.copper -= c.fee;
  const outName = Object.keys(c.out).map(k => c.out[k] + ' ' + ECON.GOOD_MAP[k].name).join('、');
  const blocks = [
    { t: 'p', v: c.id === 'cloth'
      ? '羊毛先梳，再上机。一台织机一天能出半匹布，这是第三天的量。'
      : '布裁开，填絮，缝合。针脚密得很，这种衣裳穿十年也开不了。' },
    { t: 'deltas', list: [{ label: '产出', v: c.out[Object.keys(c.out)[0]], abs: false }, { label: '金库', v: -c.fee }] }
  ];
  blocks[1].list[0].label = outName;
  S.turn++;
  const sc = E.actionScene();
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

/* 粮价随季节浮动；经商属性与天赋影响议价 */
E.seasonPriceMod = function () {
  const s = E.season();
  return s === 'winter' ? 1.32 : s === 'autumn' ? 0.82 : s === 'summer' ? 0.95 : 1.0;
};

E.unitPrice = function (kind) {
  const seasonal = E.seasonPriceMod();
  const t = (E.attr('trade') - 5) * 0.02;
  const buyBase = 34 * seasonal;
  const buyMod = clamp(1 - t + E.tal('buyMod'), 0.62, 1.3);
  const buy = Math.max(10, Math.round(buyBase * buyMod));
  // 卖价永远低于买价，避免低买高卖套利
  const sellMod = clamp(0.68 + t * 0.5 + E.tal('sellMod'), 0.55, 0.88);
  const sell = Math.max(6, Math.round(buy * sellMod));

  if (kind === 'buy') return buy;
  if (kind === 'sell') return sell;
  return Math.max(20, Math.round(54 * clamp(1 + t * 0.5 + E.tal('sellMod'), 0.8, 1.4)));
};

/* 铁：商会挂牌，贵，但比跑一趟铁砧堡省事 */
E.ironPrice = function (kind) {
  const t = (E.attr('trade') - 5) * 0.02;
  if (kind === 'buy') {
    const mod = clamp(1 - t + E.tal('buyMod'), 0.65, 1.3);
    return Math.max(60, Math.round(158 * mod));
  }
  return Math.max(30, Math.round(80 * clamp(1 + t * 0.6 + E.tal('sellMod'), 0.7, 1.3)));
};

      disabled: S.copper < pStb, warn: S.copper < pStb,
      act: () => ask({ title: '买多少石头', hint: '每块 ' + pStb + ' 铜 · 手上有 ' + W.moneyShort(S.copper),
        min: 1, max: Math.floor(S.copper / pStb), def: Math.min(20, Math.floor(S.copper / pStb)), step: 1,
        totalText: n => '共 ' + W.moneyShort(n * pStb) + '（' + n + ' 块）',
        onOk: n => E.trade('buystone', n, pStb) }) },
    { key: '石', label: '卖石头', hint: '每块 ' + pSt + ' 铜 · 有 ' + Math.round(S.stone) + ' 块',
      disabled: S.stone < 1, warn: S.stone < 1,
      act: () => ask({ title: '卖多少石头', hint: '每块 ' + pSt + ' 铜 · 有 ' + Math.round(S.stone) + ' 块',
        min: 1, max: Math.floor(S.stone), def: Math.floor(S.stone), step: 1,
        totalText: n => '可得 ' + W.moneyShort(n * pSt),
        onOk: n => E.trade('stone', n, pSt) }) },
    { key: '←', label: '不买了', hint: '', act: () => E.backToPlace() }
  ];

  const inTown = !!(S.placeCtx && S.placeCtx.city);

  /* 村口的集市只做粗货：粮、木、石。
     畜产和冬衣得进城里的摊子——城里的商会街另开一摊。 */
  if (inTown) {
    opts.splice(opts.length - 1, 0,
      { key: '篮', label: '卖畜产与手工', hint: goodsVal > 0 ? goodsDesc + ' · 共 ' + W.moneyShort(goodsVal) : '没有可卖的',
        disabled: goodsVal <= 0, warn: true,
        act: () => E.trade('goods', 0, 0) },
      { key: '衣', label: '买冬衣', hint: '每件 ' + ECON.BUY_PRICE.clothes + ' 铜 · 冬天每人半件',
        disabled: S.copper < ECON.BUY_PRICE.clothes, warn: S.copper < ECON.BUY_PRICE.clothes,
        act: () => ask({ title: '买几件冬衣', hint: '每件 ' + ECON.BUY_PRICE.clothes + ' 铜 · 过冬还差 ' + clothesNeed + ' 件',
          min: 1, max: Math.floor(S.copper / ECON.BUY_PRICE.clothes), def: Math.max(1, Math.min(clothesNeed || 10, Math.floor(S.copper / ECON.BUY_PRICE.clothes))), step: 1,
          totalText: n => '共 ' + W.moneyShort(n * ECON.BUY_PRICE.clothes) + '（' + n + ' 件）',
          onOk: n => E.trade('buyclothes', n, ECON.BUY_PRICE.clothes) }) }
    );
  }

  /* 商会的买卖比村口宽：铁也在这里挂牌 */
  if (S.placeCtx && S.placeCtx.city) {
    const pIb = E.ironPrice('buy'), pIs = E.ironPrice('sell');
    opts.splice(opts.length - 1, 0,
      { key: '锤', label: '买铁', hint: '每块 ' + pIb + ' 铜 · 仓里 ' + Math.round(S.iron) + ' 块',
        disabled: S.copper < pIb, warn: S.copper < pIb,
        act: () => ask({ title: '买多少铁', hint: '每块 ' + pIb + ' 铜 · 手上有 ' + W.moneyShort(S.copper),
          min: 1, max: Math.floor(S.copper / pIb), def: Math.min(10, Math.floor(S.copper / pIb)), step: 1,
          totalText: n => '共 ' + W.moneyShort(n * pIb) + '（' + n + ' 块）',
          onOk: n => E.trade('buyiron', n, pIb) }) },
      { key: '锤', label: '卖铁', hint: '每块 ' + pIs + ' 铜 · 仓里 ' + Math.round(S.iron) + ' 块',
        disabled: S.iron < 1, warn: S.iron < 1,
        act: () => ask({ title: '卖多少铁', hint: '每块 ' + pIs + ' 铜 · 仓里 ' + Math.round(S.iron) + ' 块',
          min: 1, max: Math.floor(S.iron), def: Math.floor(S.iron), step: 1,
          totalText: n => '可得 ' + W.moneyShort(n * pIs),
          onOk: n => E.trade('selliron', n, pIs) }) }
    );
  }

  const blocks = [{ t: 'p', v: inTown
    ? '商会街的柜台是整块橡木的，被手肘磨得发亮。\n\n账房把当日的牌价翻给你看：「粮、铁、木石，都在这儿。看好了说数。」'
    : '集市在村口那片空地上，来的多是石桥镇的粮贩子。\n\n粮价写在木板上，一天改两回。贩子看见你，把木板往外挪了挪。\n\n「' + W.seasonName(S.time.m) + '天的价。」他说，「过了这个月，另说。」' }];
  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return E.emit(sc);
};

E.trade = function (kind, n, price) {
  n = Math.round(n);
  E.clearHere();
  const blocks = [];
  let changes = [];

  if (kind === 'buy') {
    const cost = n * price;
    if (S.copper < cost) { UI && UI.toast('钱不够'); return E.openMenu(); }
    S.copper -= cost;
    S.food += n;
    changes = [{ label: '金库', v: -cost }, { label: '存粮', v: n }];
    blocks.push({ t: 'p', v: '粮贩子过了秤，一袋一袋搬上牛车。\n\n「' + n + ' 石。」他在木板上划了一道，「今年的麦，粒小，但干。」\n\n最后一袋装好的时候，他压低声音说了句：「冬天还得涨。你自己算着买。」' });
  } else if (kind === 'sell') {
    const gain = n * price;
    S.food -= n;
    S.copper += gain;
    changes = [{ label: '金库', v: gain }, { label: '存粮', v: -n }];
    blocks.push({ t: 'p', v: '你把粮卖了。\n\n粮贩子数钱数得很快，数完抬头看了你一眼：「卖这么多，你自己够吗？」\n\n你没答。他把钱袋推过来，比看上去沉。' });
  } else if (kind === 'stone') {
    const gain = Math.round(n * price);
    S.stone = Math.max(0, S.stone - n);
    S.copper += gain;
    changes = [{ label: '金库', v: gain }, { label: '石头', v: -Math.round(n) }];
    blocks.push({ t: 'p', v: '石头堆在集市边上，占了半条路。\n\n来了三个买主，最后一个全要了——他要砌羊圈。' });
  } else if (kind === 'buywood') {
    const cost = Math.round(n * price);
    if (S.copper < cost) { if (typeof UI !== 'undefined') UI.toast('钱不够'); return E.openMenu(); }
    S.copper -= cost;
    S.wood += n;
    changes = [{ label: '金库', v: -cost }, { label: '木材', v: n }];
    blocks.push({ t: 'p', v: '拉木头的是个外村的贩子，车上盖着草席。\n\n「北边的桦木。」他掀开一角，「干透了，不翘。」\n\n你数了 ' + n + ' 根，一根一根码到墙根下。' });
  } else if (kind === 'buystone') {
    const cost = Math.round(n * price);
    if (S.copper < cost) { if (typeof UI !== 'undefined') UI.toast('钱不够'); return E.openMenu(); }
    S.copper -= cost;
    S.stone += n;
    changes = [{ label: '金库', v: -cost }, { label: '石头', v: n }];
    blocks.push({ t: 'p', v: '石料是从南山坡的旧采石场拉来的，边角还带着青苔。\n\n「这块能砌墙。」赶车的人拍了拍其中一块，「别拿去做地基，冬天会裂。」' });
  } else if (kind === 'goods') {
    let gain = 0;
    const sold = [];
    ECON.GOODS.forEach(g => {
      const q = Math.floor(S.goods[g.id]);
      if (q < 1) return;
      gain += q * g.price;
      sold.push(g.name + ' ' + q);
      changes.push({ label: g.name, v: -q });
      S.goods[g.id] -= q;
    });
    S.copper += gain;
    changes.unshift({ label: '金库', v: gain });
    blocks.push({ t: 'p', v: '你把篮子摆在布摊旁边。\n\n' + sold.join('、') + '。\n\n一个胖妇人挑了半天，最后全买走了，还嫌鸡蛋小。' });
  } else if (kind === 'buyclothes') {
    const cost = n * price;
    if (S.copper < cost) { if (typeof UI !== 'undefined') UI.toast('钱不够'); return E.openMenu(); }
    S.copper -= cost;
    S.goods.clothes += n;
    changes = [{ label: '金库', v: -cost }, { label: '冬衣', v: n }];
    blocks.push({ t: 'p', v: '成衣铺在商会街拐角，老板是个话很少的老头。\n\n他把 ' + n + ' 件冬衣摞在柜台上，一件一件抖开给你看针脚：\n\n「絮是旧的，面子是新的。穿三年不漏风。」' });
  } else if (kind === 'buyiron') {
    const cost = n * price;
    if (S.copper < cost) { if (typeof UI !== 'undefined') UI.toast('钱不够'); return E.backToPlace(); }
    S.copper -= cost;
    S.iron += n;
    changes = [{ label: '金库', v: -cost }, { label: '铁', v: n }];
    blocks.push({ t: 'p', v: '铁是成条的，用麻布裹着，一捆一捆过秤。\n\n「南边来的。」掌柜用指甲在铁条上刮了一下，「不算最好的，但缺的时候，能救命。」' });
  } else if (kind === 'selliron') {
    const gain = Math.round(n * price);
    S.iron = Math.max(0, S.iron - n);
    S.copper += gain;
    changes = [{ label: '金库', v: gain }, { label: '铁', v: -Math.round(n) }];
    blocks.push({ t: 'p', v: '掌柜把铁条一根一根翻过来看断面，看得比你还仔细。\n\n「这个价收了。」他说，「冬天铁贵，你自己留着也行。」' });
  } else {
    const gain = Math.round(n * price);
    S.wood = Math.max(0, S.wood - n);
    S.copper += gain;
    changes = [{ label: '金库', v: gain }, { label: '木材', v: -Math.round(n) }];
    blocks.push({ t: 'p', v: '木材堆在集市边上，从早上摆到中午才有人来问。\n\n最后是个造船的匠人全要了。他一根一根敲过去，敲完说：「北边的木头，好。」' });
  }

  blocks.push({ t: 'deltas', list: changes });
  S.turn++;
  if (S.ended) return E.emitEnding();
  if (S.placeCtx) {
    const sp = E.placeScene(S.placeCtx.city, S.placeCtx.place);
    sp.blocks = blocks; sp.append = true;
    return E.emit(sp);
  }
  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

/* ---------- 专属剧情 ---------- */

E.pickStory = function () {
  if (typeof STORY === 'undefined') return null;
  for (const s of STORY) {
    if (S.flags['story_' + s.id]) continue;
    const npc = S.npcs.find(n => n.id === s.npcId);
    if (!npc || npc.gone) continue;
    if (!s.cond(npc)) continue;
    return { story: s, npc: npc };
  }
  return null;
};

E.startStory = function (picked, pre) {
  const s = picked.story, npc = picked.npc;
  S.flags['story_' + s.id] = true;
  npc.here = true;
  npc.lastSeen = S.stats.days;

  const blocks = (pre || []).slice();
  blocks.push({ t: 'p', v: s.text });

  const opts = s.options.map((o, i) => {
    let dis = false, why = '';
    if (o.cost) {
      if (o.cost.copper && S.copper < o.cost.copper) { dis = true; why = '钱不够（需 ' + W.moneyShort(o.cost.copper) + '）'; }
      if (o.cost.food && S.food < o.cost.food) { dis = true; why = '存粮不够'; }
    }
    return {
      key: String.fromCharCode(65 + i),
      label: o.label,
      hint: dis ? why : (o.hint || ''),
      warn: dis,
      disabled: dis,
      act: () => E.resolveOption(s, i, npc, o, true)
    };
  });

  E.pending = { type: 'story', story: s, npc: npc };
  return E.emit(scene(head(), blocks, opts));
};

/* ---------- 官面上的事（缴税 / 借贷） ---------- */

E.PAYABLES = {
  bridge: { name: '石桥镇过桥税', copper: 960, flag: 'paid_bridge', text: '石桥镇的税吏在桥头收了钱，把木牌翻到新的一面。\n\n「下个月照旧。」他说。' },
  autumn_tax: { name: '长河城秋税', food: 60, flag: 'paid_autumn_tax', text: '六十石粮装了四车，拉到长河城。\n\n税吏过秤，记账，盖章，全程没说一句话。最后一车卸完，他抬头看了你一眼：「今年你是第三个缴齐的。」' }
};

E.payables = function () {
  const out = [];
  (S.deadlines || []).forEach(d => {
    if (d.done) return;
    const p = E.PAYABLES[d.id];
    if (!p) return;
    out.push({ id: d.id, name: p.name, days: E.daysLeft(d), def: p });
  });
  return out;
};

E.duesMenu = function () {
  const list = E.payables();
  const opts = list.map(p => {
    const def = p.def;
    const canCopper = def.copper ? S.copper >= def.copper : false;
    const canFood = def.food ? S.food >= def.food : false;
    const ok = def.copper ? canCopper : canFood;
    const cost = def.copper ? W.moneyShort(def.copper) : def.food + ' 石粮';
    return {
      key: '断',
      label: '缴' + def.name,
      hint: '还有 ' + p.days + ' 天 · 需要 ' + cost,
      disabled: !ok,
      warn: !ok,
      act: () => E.payDue(p.id)
    };
  });

  // 借贷（只在缺钱时提示）
  const loanOpen = S.loans.length < 2;
  opts.push({
    key: '契',
    label: '向誓约公证所借钱',
    hint: loanOpen ? '借 30 金币，九十天后还 40' : '已经欠着两笔了，没人再借给你',
    disabled: !loanOpen,
    warn: !loanOpen,
    act: () => E.takeLoan()
  });

  opts.push({ key: '←', label: '先不管', hint: '', act: () => E.openMenu() });

  const blocks = [{ t: 'p', v: list.length
    ? '桌上有三样东西：一张石桥镇的税单，一张长河城的催缴，还有一份从公证所抄来的借契样本。\n\n博恩把它们排开，用手指点着日期：「领主，哪件先办？」'
    : '博恩把账本合上：「眼下没有别人上门要钱。这算好事。」' }];

  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return E.emit(sc);
};

E.payDue = function (id) {
  const def = E.PAYABLES[id];
  const d = S.deadlines.find(x => x.id === id);
  if (!def || !d) return E.openMenu();
  if (def.copper) S.copper -= def.copper;
  if (def.food) S.food -= def.food;
  S.flags[def.flag] = true;
  d.done = true;

  const blocks = [{ t: 'p', v: def.text }];
  const changes = [];
  if (def.copper) changes.push({ label: '金库', v: -def.copper });
  if (def.food) changes.push({ label: '存粮', v: -def.food });
  blocks.push({ t: 'deltas', list: changes });
  S.prestige = clamp(S.prestige + 2, 0, 100);

  S.turn++;
  if (S.ended) return E.emitEnding();
  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

E.takeLoan = function () {
  const principal = 7200;   // 30 金币
  const repay = 9600;       // 40 金币
  S.copper += principal;
  S.loans.push({ principal: principal, repay: repay });
  E.addDeadline({
    id: 'loan_' + S.loans.length,
    name: '誓约公证所的借契（第' + S.loans.length + '笔）',
    due: S.dayNum + 90,
    okWhen: () => S.copper >= repay || S.flags['loan_paid_' + S.loans.length],
    okMsg: '借契清了。公证所的抄写员在你的名字后面盖了章，把那一行划掉。',
    penalty: { copper: -repay, prestige: -6, faction: { changhe: -1 } },
    msg: '借契到期。公证所的人来了，把能搬的都搬了，还在墙上钉了一张纸——上面写着你的名字，全大陆的商人都能看懂那是什么意思。'
  });

  const blocks = [{ t: 'p', v: '公证所在商会街尽头，石阶上有七墨刻的锁与锤。\n\n抄写员把羊皮纸铺开，念了一遍条款：三十金币，九十天，还四十。\n\n「利不算高。」她说，「但名字要记上去。」\n\n她指着最后一行：「写在这里。写下去，全大陆都知道你欠过。」' },
    { t: 'deltas', list: [{ label: '金库', v: principal }, { label: '欠债', v: 1, abs: true }] }];

  S.turn++;
  if (S.ended) return E.emitEnding();
  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

/* ---------- 建造 ---------- */

const BUILD_REQ = {
  mill:     { test: () => S.fields >= 20,            why: '需要至少 20 亩耕地' },
  tower:    { test: () => E.presTotal() >= 15,        why: '需要威望 15' },
  palisade: { test: () => S.people >= 60 || S.troops >= 2, why: '需要 60 人口或 2 兵力' }
};

E.buildMenu = function () {
  const opts = W.BUILDINGS.map(b => {
    const built = S.buildings[b.id];
    let dis = !!built && b.once;
    let why = '已建成';
    const req = BUILD_REQ[b.id];
    if (req && !req.test()) { dis = true; why = req.why; }
    if (S.copper < b.cost.gold) { dis = true; why = '钱不够（需 ' + W.moneyShort(b.cost.gold) + '）'; }
    const woodCost = Math.max(0, Math.round((b.cost.wood || 0) * (1 - E.tal('buildWood'))));
    const stoneCost = b.cost.stone || 0;
    if (b.cost.wood && S.wood < woodCost) { dis = true; why = '木材不够（需 ' + woodCost + '）'; }
    if (stoneCost && S.stone < stoneCost) { dis = true; why = '石头不够（需 ' + stoneCost + '）'; }
    if (b.cost.iron && S.iron < b.cost.iron) { dis = true; why = '铁不够'; }
    return {
      key: '建',
      label: b.name,
      hint: dis ? why : b.desc + ' · ' + W.moneyShort(b.cost.gold)
        + (woodCost ? ' · 木 ' + woodCost : '')
        + (stoneCost ? ' · 石 ' + stoneCost : ''),
      warn: dis,
      disabled: dis,
      act: () => E.doBuild(b)
    };
  });
  opts.push({ key: '←', label: '不动工了', hint: '', act: () => E.openMenu() });
  const blocks = [{ t: 'p', v: '工匠们站在院子里等话。木料和石料堆在西墙下，盖着草席。\n\n老木匠哈尔把手上的墨线卷了卷：「领主，先动哪一样？」' }];
  const sc = scene(head(), blocks, opts);
  E.pending = { type: 'action' };
  return E.emit(sc);
};

E.doBuild = function (b) {
  E.clearHere();
  const woodCost = Math.max(0, Math.round((b.cost.wood || 0) * (1 - E.tal('buildWood'))));
  const stoneCost = b.cost.stone || 0;
  S.copper -= b.cost.gold;
  if (woodCost) S.wood = Math.max(0, S.wood - woodCost);
  if (stoneCost) S.stone = Math.max(0, S.stone - stoneCost);
  if (b.cost.iron) S.iron = Math.max(0, S.iron - b.cost.iron);
  S.buildings[b.id] = (S.buildings[b.id] || 0) + 1;

  const eff = {
    barn: { morale: 3 }, mill: { morale: 3 }, forge: { morale: 1 },
    palisade: { prestige: 3 }, tower: { prestige: 4 },
    chapel_fix: { morale: 6, faction: { monastery: 1 } },
    house: { morale: 2 },
    sawmill: { morale: 2 }, quarry: { morale: 2 }, mine: { morale: 2 },
    ranch: { morale: 3 },
    loom: { morale: 2 }, barracks: { prestige: 3 }
  }[b.id] || {};
  if (b.id === 'mill') S.fields = Math.round(S.fields * 1.1);

  const changes = [
    { label: '金库', v: -b.cost.gold },
    { label: '成建', v: 1, abs: true }
  ];
  if (woodCost) changes.push({ label: '木材', v: -woodCost });
  if (stoneCost) changes.push({ label: '石头', v: -stoneCost });

  // 养殖场建成即送牲畜
  if (b.id === 'ranch' && !S.animals.chicken && !S.animals.sheep && !S.animals.cow) {
    S.animals.chicken = ECON.START_ANIMALS.chicken;
    S.animals.sheep = ECON.START_ANIMALS.sheep;
    S.animals.cow = ECON.START_ANIMALS.cow;
    S.animals.chick = 0;
  }

  E.apply(eff);
  const blocks = [
    { t: 'p', v: '动工了 ' + b.name + '。' + pick([
      '木匠带着三个人干了三天，榫卯敲得很响。',
      '石头一块一块垒上去，缝隙里塞的是碎瓦。',
      '矮人工匠一边干一边骂，但活干得很漂亮。'
    ]) + (b.id === 'ranch'
      ? '\n\n栅栏立起来那天，博恩从石桥镇牵回来四只鸡、两只羊和一头牛。它们站在新院子里，半天没敢动。'
      : '') + (b.id === 'sawmill' ? '\n\n锯架和水轮装好的第二天，木料就已经堆到屋顶了。' : '')
      + (b.id === 'quarry' ? '\n\n采石场开在溪北那片青石上。第一天就出了六车料。' : '')
      + (b.id === 'mine' ? '\n\n矿洞口架了木撑，挂了灯。第一条矿道往山里挖了三十步。' : '')
      + (b.id === 'loom' ? '\n\n三台织机是从长河城运来的，光运费就花了三枚金币。' : '')
      + (b.id === 'barracks' ? '\n\n院子里划出一块空地，插了木桩。从今天起，每天天不亮就有人在这儿站队。' : '') },
    { t: 'deltas', list: changes }
  ];
  S.turn++;
  S.ap -= 2;
  if (S.ap <= 0) E.endDay();
  if (S.ended) return E.emitEnding();

  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  sc.append = true;
  return E.emit(sc);
};

/* ---------- 与 NPC 相处 ---------- */

E.visitNpc = function (id) {
  const npc = S.npcs.find(n => n.id === id);
  if (!npc) return E.openMenu();
  E.clearHere();
  S.turn++;
  if (S.ended) return E.emitEnding();
  return E.npcInteraction(npc);
};

/* ---------- 结局场景 ---------- */

E.emitEnding = function () {
  if (E.onEnd) E.onEnd(S.ended);
  return S.ended;
};

/* ---------- 存档 ---------- */

/* ---------- 存档：三个槽位 ---------- */

E.SLOTS = [1, 2, 3];
E.slot = 1;

E.slotKey = function (n) { return 'yaluogu_slot_' + (n || 1); };

E.slotInfo = function (n) {
  try {
    const raw = localStorage.getItem(E.slotKey(n));
    if (!raw) return { n: n, empty: true };
    const o = JSON.parse(raw);
    const s = o.s || {};
    const pl = s.player || {};
    return {
      n: n, empty: false, at: o.at || 0,
      name: pl.name || '未名',
      origin: pl.origin || '',
      day: Math.floor(s.dayNum || 0),
      year: (s.time && s.time.y) || 317,
      month: (s.time && s.time.m) || 3,
      stage: s.stage || 0,
      people: s.people || 0,
      morale: s.morale || 0,
      ended: !!s.ended
    };
  } catch (e) { return { n: n, empty: true }; }
};

E.anySave = function () {
  return E.SLOTS.some(n => !!localStorage.getItem(E.slotKey(n)));
};

E.summaryText = function (info) {
  if (!info || info.empty) return '空';
  const st = (W.STAGES && W.STAGES[info.stage]) || '拓荒';
  return '王历 ' + info.year + ' 年 ' + info.month + ' 月 · 第 ' + info.day + ' 天 · ' +
    st + ' · ' + info.people + ' 人 · 民心 ' + info.morale;
};

E.save = function (slot) {
  try {
    const n = slot || E.slot || 1;
    const copy = {};
    for (const k in S) { if (k !== 'lastScene' && k !== 'pending') copy[k] = S[k]; }
    localStorage.setItem(E.slotKey(n), JSON.stringify({ s: copy, at: Date.now(), slot: n }));
    S.lastSaveDay = Math.floor(S.dayNum);
    return true;
  } catch (e) { return false; }
};

E.load = function (slot) {
  try {
    const n = slot || E.slot || 1;
    const raw = localStorage.getItem(E.slotKey(n));
    if (!raw) return false;
    const o = JSON.parse(raw);
    S = o.s;
    E.slot = n;
    /* 老存档补字段：缺了也能接着玩，不至于读出来就崩 */
    if (S.troopDrill == null) S.troopDrill = 10;
    if (!S.lairs) S.lairs = [];
    if (S.lairWeek == null) S.lairWeek = Math.floor((S.dayNum || 0) / 10);
    if (!S.party) S.party = [];
    if (!S.goods) S.goods = { egg: 0, milk: 0, wool: 0, cloth: 0, clothes: 0 };
    if (!S.animals) S.animals = { chicken: 0, chick: 0, sheep: 0, cow: 0 };
    if (S.stone == null) S.stone = 0;
    if (S.weapons == null) S.weapons = 0;
    if (!S.shopStock) S.shopStock = [];
    if (S.player && !S.player.gear) S.player.gear = { weapon: null, armor: null, mount: null, trinkets: [null, null, null] };
    if (S.player && !S.player.bag) S.player.bag = [];
    /* 队伍里那几个人的装备也可能是老档 */
    (S.npcs || []).forEach(np => {
      if (!np.gear) np.gear = { weapon: null, armor: null, mount: null, trinkets: [null, null, null] };
    });
    RNG = mulberry32((S.turn + 1) * 2654435761 % 2147483647);
    E.pending = { type: 'action' };
    return true;
  } catch (e) { return false; }
};

E.reset = function (slot) {
  try { localStorage.removeItem(E.slotKey(slot || E.slot || 1)); } catch (e) {}
};

/* 每十五天自动存一次 */
E.autoSave = function () {
  const w = Math.floor(S.dayNum / 15);
  if (S.autoMark === w) return false;
  S.autoMark = w;
  const ok = E.save();
  if (typeof UI !== 'undefined' && UI.toast) {
    UI.toast(ok ? ('第 ' + Math.floor(S.dayNum) + ' 天 · 已自动存档到第 ' + (E.slot || 1) + ' 槽') : '自动存档失败');
  }
  return ok;
};

/* 旧版单一存档 → 一号槽 */
E.migrateOld = function () {
  try {
    const old = localStorage.getItem('yaluogu_save_v2');
    if (!old) return;
    if (!localStorage.getItem(E.slotKey(1))) {
      localStorage.setItem(E.slotKey(1), old);
    }
    localStorage.removeItem('yaluogu_save_v2');
  } catch (e) {}
};

E.hasSave = function () {
  try { return E.anySave(); } catch (e) { return false; }
};

/* ===== npcgen.js ===== */
/* ===========================================================
   《鸦落谷》· 人物生成器 + 相遇 / 相处场景
   =========================================================== */

const NPC = {};

let npcSeq = 0;

/* ---------- 命名 ---------- */

function nameOfRace(race) {
  const T = N.NAME[race] || N.NAME['人类'];
  if (race === '人类') {
    const g = pick(T.given);
    const f = pick(T.family);
    return { given: g, family: f, full: g + '·' + f };
  }
  const g = T.full ? pick(T.full) : (pick(T.head) + pick(T.tail));
  const f = pick(T.family);
  return { given: g, family: f, full: g + '·' + f };
}

function nearDuplicate(name, list) {
  return list.some(n => n === name || (n.length === name.length && n[0] === name[0] && n[n.length - 1] === name[name.length - 1]));
}

/* ---------- 对外：固定角色 ---------- */

NPC.makeFixed = function (s) {
  const temper = N.TEMPERS.find(t => t.id === s.temper) || N.TEMPERS[0];
  return {
    id: s.id || ('npc_' + (++npcSeq)),
    name: s.name,
    fullName: s.fullName || s.name,
    role: s.role,
    age: s.age,
    race: s.race,
    body: s.body,
    hairColor: s.hairColor,
    hairStyle: s.hairStyle,
    eyes: s.eyes,
    mark: s.mark,
    voice: s.voice,
    temper: s.temper,
    temperName: temper.name,
    archetype: s.archetype,
    path: s.path || 'contract',
    origin: s.origin,
    goal: s.goal,
    secret: s.secret,
    look: s.look,
    habit: s.habit || temper.habit,
    taboo: s.taboo || temper.taboo,
    line: temper.lines[0],
    rel: { aff: s.aff || 0, loy: s.loy || 0 },
    talents: s.talents || [],
    gear: (function () {
      const src = s.gear || (N.FIXED_GEAR && N.FIXED_GEAR[s.id]) || null;
      if (src) return JSON.parse(JSON.stringify(src));
      return { weapon: null, armor: null, mount: null, trinkets: [null, null, null] };
    })(),
    isResident: !!s.isResident,
    talks: 0, blocked: false,
    met: 0, here: false, lastSeen: 0,
    combo: [s.race, s.body, s.hairColor, s.hairStyle, s.eyes].join('|')
  };
};

/* ---------- 对外：程序生成 ---------- */

NPC.generate = function (opt) {
  opt = opt || {};
  const recent = E.state().recentFemale || [];

  // 原型
  let archs = N.ARCHETYPES;
  if (opt.pool && opt.pool.length) archs = N.ARCHETYPES.filter(a => opt.pool.indexOf(a.id) >= 0);
  if (!archs.length) archs = N.ARCHETYPES;
  const arch = pick(archs);

  // 种族（原型可指定）
  let race;
  if (arch.race) race = arch.race;
  else if (opt.race) race = opt.race;
  else race = pick(N.RACES);

  // 轮盘：不重复最近三名的组合
  const BUILDS_BY_RACE = {
    '人类': N.BUILDS,
    '精灵': ['高挑修长', '娇小纤细', '匀称紧致'],
    '矮人': ['健硕有力', '丰腴圆润', '匀称紧致'],
    '兽人': ['健硕有力', '高挑修长'],
    '半身人': ['娇小纤细', '丰腴圆润'],
    '混血': ['高挑修长', '匀称紧致', '娇小纤细', '健硕有力']
  };
  const builds = BUILDS_BY_RACE[race] || N.BUILDS;

  let band, body, hc, hs, eyes, mark, combo;
  for (let i = 0; i < 50; i++) {
    band = pick(N.AGE_BANDS);
    body = pick(builds);
    hc = pick(N.HAIR_COLORS);
    hs = pick(N.HAIR_STYLES);
    eyes = pick(N.EYES);
    mark = pick(N.MARKS);
    combo = [race, band.id, body, hc, hs, eyes, mark.note].join('|');
    const dup = recent.some(c => {
      const p = c.split('|');
      const q = combo.split('|');
      let same = 0;
      for (let k = 0; k < q.length; k++) if (p[k] === q[k]) same++;
      return same >= 5;
    });
    if (!dup) break;
  }
  recent.push(combo);
  while (recent.length > 3) recent.shift();

  // 年龄
  let age = ri(band.range[0], band.range[1]);
  if (race === '精灵') age = ri(60, 190);
  if (race === '矮人') age = ri(band.range[0] + 20, band.range[1] + 40);

  // 名字
  const used = E.state().npcs.map(n => n.name);
  let nm, tries = 0;
  do {
    nm = opt.forceName ? { given: opt.forceName, family: '', full: opt.forceName } : nameOfRace(race);
    tries++;
  } while (!opt.forceName && (used.indexOf(nm.given) >= 0 || nearDuplicate(nm.given, used)) && tries < 20);

  const temper = pick(N.TEMPERS);
  const role = pick(arch.roles);
  const origin = pick(arch.origins);
  const goal = pick(arch.goals);
  const secret = pick(arch.secrets);
  const look = buildLook(race, body, hc, hs, eyes, mark, opt.loc);

  const npc = NPC.makeFixed({
    name: nm.given,
    fullName: nm.full || nm.given,
    role: role,
    age: age,
    race: race,
    body: body,
    hairColor: hc,
    hairStyle: hs,
    eyes: eyes,
    mark: mark.text,
    voice: pick(N.VOICES),
    temper: temper.id,
    archetype: arch.id,
    path: arch.path,
    origin: origin,
    goal: goal,
    secret: secret,
    look: look,
    habit: temper.habit,
    taboo: temper.taboo,
    aff: ri(0, 10), loy: ri(0, 8)
  });

  const tpool = N.TALENT_BY_PATH[arch.path] || N.TALENT_BY_PATH.contract;
  const nT = 1 + (Math.random() < 0.55 ? 1 : 0) + (Math.random() < 0.22 ? 1 : 0);
  npc.talents = shuffle(tpool).slice(0, nT);

  /* 身上有没有东西，看她是干什么的。不是人人都有。 */
  npc.gear = { weapon: null, armor: null, mount: null, trinkets: [null, null, null] };
  if (chance(0.36)) {
    const gp = N.GEAR_BY_PATH[arch.path] || N.GEAR_BY_PATH.contract;
    const want = 1 + (chance(0.28) ? 1 : 0);
    shuffle(gp).slice(0, want).forEach(id => {
      const it = GEAR.MAP[id];
      if (!it) return;
      if (it.slot === 'trinket') {
        const k = npc.gear.trinkets.findIndex(x => !x);
        if (k >= 0) npc.gear.trinkets[k] = id;
      } else {
        npc.gear[it.slot] = id;
      }
    });
  }

  npc.markNote = mark.note;
  npc.combo = combo;
  npc.line = pick(temper.lines);
  npc.firstLine = pick(N.FIRST_LINE[temper.id] || ['……']);
  return npc;
};

/* ---------- 外貌描写 ---------- */

function eyePhrase(e) { return e === '异瞳' ? '一双颜色不一样的眼睛' : '一双' + e + '色的眼睛'; }

const HAIR_PHRASE = {
  '长直': '直直垂到腰际',
  '编辫': '编成一条粗辫搭在肩前',
  '高马尾': '高高扎在脑后',
  '齐耳短发': '剪到耳下一寸',
  '盘发': '在脑后盘成一个髻',
  '蓬乱未束': '散着，没束'
};

function buildLook(race, body, hc, hs, eyes, mark, loc) {
  const rl = N.RACE_LOOK[race] || N.RACE_LOOK['人类'];
  const cloth = {
    manor: ['一件看不出原来颜色的外衣', '粗麻布的短袍，袖口磨翻了', '打了三层补丁的斗篷'],
    village: ['粗布裙，外面套着围裙', '一件男式的旧外衣，明显改过', '沾着草屑的短袄'],
    chapel: ['灰白的教会袍子', '洗得发白的布衣，领口别着一枚木十字'],
    forest: ['皮短甲，外面裹着挡风的斗篷', '猎装，腰上挂着一排小刀', '厚毛的披风，边角有牙印'],
    changhe: ['深色的长裙，料子看得出手艺不错', '商人式样的外袍，袖口收得很紧', '半旧的皮甲，外面罩着一件干净的罩衫'],
    shiqiao: ['镇上一贯的粗呢衣裳', '一件缝过很多次的外套'],
    monastery: ['修女的灰袍，腰上系着素绳', '朴素的亚麻长裙'],
    tiezhen: ['厚皮围裙，上面全是烧痕', '矮人式的短外套，扣子是铜的'],
    yinye: ['叶脉纹的猎装，绿得几乎和树一样', '银灰的长袍，下摆沾着泥'],
    langxi: ['鹿皮背心，里面是粗毛衣', '猎人的短斗篷，肩上补着一块狐皮'],
    redfang: ['兽皮短甲，露出的手臂上有刺青', '几块皮子随便绑在一起'],
    ruins: ['进林子的装束，袖口扎得很紧']
  }[loc || 'manor'] || ['粗布衣裳'];

  const hp = HAIR_PHRASE[hs] || hs;
  const t = [
    '她' + body + '，' + hc + '的头发' + hp + '。' + eyePhrase(eyes) + '，看你的时候不太眨眼。',
    body + '的身形，' + hc + '的头发' + hp + '，' + eyePhrase(eyes) + '。',
    '她算不上好看，但很难忘——' + body + '的身形，' + hc + '的头发' + hp + '，' + eyePhrase(eyes) + '，在光下显得很深。'
  ];

  let out = pick(t) + '她穿着' + pick(cloth) + '，' + rl.skin + '。';
  out += mark.text + '。';
  if (race === '精灵') out += '她看上去二十出头，但那种「二十出头」不太对——像一件放了很久的东西，还亮着。';
  if (race === '矮人') out += '她比你矮一大截，可站在那里，你得抬头看她。';
  if (race === '兽人') out += '她比你高出一个头，站得笔直，像一根插在地上的木桩。';
  if (race === '半身人') out += '她只到你胸口，圆脸，笑起来眼睛会弯——但你不会想把她当成孩子。';
  if (race === '混血') out += '她走到哪里都不太算自己人。';
  return out;
}

/* ---------- 六要素卡片 ---------- */

NPC.sixElements = function (n) {
  return [
    { k: '姓名', v: n.name + (n.fullName && n.fullName !== n.name ? '（' + n.fullName + '）' : '') },
    { k: '种族', v: n.race + ' · ' + n.age + ' 岁' },
    { k: '身份', v: n.role },
    { k: '来历', v: n.origin },
    { k: '外貌', v: n.look },
    { k: '目标', v: n.goal },
    { k: '弱点', v: n.secret },
    { k: '气质', v: n.temperName + '。' + N.TEMPERS.find(t => t.id === n.temper).tone }
  ];
};

/* ---------- 相遇场景 ---------- */

E.meetScene = function (pre) {
  const npc = NPC.generate({ loc: S.loc });
  S.npcs.push(npc);
  S.stats.meet++;
  S.femaleGap = 0;
  npc.here = true;
  npc.met = S.stats.days;

  const blocks = (pre || []).slice();
  const where = W.LOCS[S.loc].name;
  blocks.push({ t: 'p', v: pick([
    '你没想到会在' + where + '碰见这样的人。',
    '转过弯的时候，你和一个人差点撞上。',
    '她就站在那里，像是已经站了很久。'
  ]) });
  blocks.push({ t: 'npcIntro', npc: npc });
  blocks.push({ t: 'p', v: '「' + npc.firstLine + '」\n\n' + npc.habit + '。' });

  const opts = [
    { key: 'A', label: '问她是谁、从哪来', hint: '稳妥 · 好感 +', act: () => E.meetChoose(npc, 0) },
    { key: 'B', label: '先看看她需要什么', hint: '务实 · 忠诚 +', act: () => E.meetChoose(npc, 1) },
    { key: 'C', label: '不多说，点个头就走', hint: '冷淡 · 但不会得罪人', act: () => E.meetChoose(npc, 2) }
  ];

  E.pending = { type: 'meet', npc: npc };
  return E.emit(scene(head(), blocks, opts));
};

E.meetChoose = function (npc, idx) {
  const blocks = [];
  let r;
  if (idx === 0) {
    r = E.judge({ diff: 2 }, {});
    if (r.tier === 'great') {
      blocks.push({ t: 'p', v: '她说了很多。可能是没想到有人会认真听。\n\n「' + npc.goal + '。」她说到一半停下来，像是才意识到自己说了不该说的，「……你别当真。」\n\n但她说的时候，眼睛是亮的。' });
      E.addRel(npc, { aff: 4, loy: 1 });
    } else if (r.tier === 'ok') {
      blocks.push({ t: 'p', v: '「' + npc.name + '。」她报了名字，然后说了两句来历——' + npc.origin + '。\n\n再多，她就不肯说了。' });
      E.addRel(npc, { aff: 2 });
    } else if (r.tier === 'partial') {
      blocks.push({ t: 'p', v: '她报了名字，说了半句来历，就把嘴闭上了。\n\n「这些不重要。」她说。\n\n但至少她记住了你问过。' });
      E.addRel(npc, { aff: 1 });
    } else {
      blocks.push({ t: 'p', v: '「跟你没关系。」\n\n她转身要走，走了两步又停住，回头看了你一眼，那眼神不像生气，像在确认什么。\n\n然后她走了。' });
      E.addRel(npc, { aff: -1 });
    }
  } else if (idx === 1) {
    r = E.judge({ diff: 3 }, {});
    if (r.tier === 'great') {
      blocks.push({ t: 'p', v: '你做了件很小的事——帮她扶了一下要倒的东西，或者替她挡了一句难听的话。\n\n她愣了愣，然后说了句很轻的「谢了」。\n\n对她这样的人来说，这已经很重了。' });
      E.addRel(npc, { aff: 2, loy: 4 });
    } else if (r.tier === 'ok') {
      blocks.push({ t: 'p', v: '她接了你递过去的东西，说了声「嗯」。\n\n没有多的话。但她离开的时候，脚步比刚才慢了一点。' });
      E.addRel(npc, { loy: 3 });
    } else if (r.tier === 'partial') {
      blocks.push({ t: 'p', v: '「不用。」她把手缩回去，「我自己来。」\n\n她自己来了。做得比你想象的费劲，但她没再抬头。' });
      E.addRel(npc, { loy: 1 });
    } else {
      blocks.push({ t: 'p', v: '「你干什么？」她退了一步，声音一下硬起来。\n\n你解释了两句。她听完，点了点头，但那点头更像是要结束这场对话。' });
      E.addRel(npc, { aff: -2 });
    }
  } else {
    blocks.push({ t: 'p', v: '你点了点头，从她旁边走过去。\n\n走出十几步，你听见身后有很轻的一声，像是她把一直提着的东西放下了。' });
    E.addRel(npc, { aff: 0, loy: 1 });
  }

  blocks.push({ t: 'verdict', tier: r ? r.tier : 'ok', name: r ? TIERS[r.tier].name : '作罢', score: r ? r.score : null, attr: r ? r.attr : null });
  S.turn++;
  if (S.ended) return E.emitEnding();

  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  return E.emit(sc);
};

/* ---------- 相处场景 ---------- */

const CLUSTER = {
  cold: 'reserved', sharp: 'reserved', proper: 'reserved', dark: 'reserved',
  gentle: 'open', naive: 'open', imp: 'open',
  brash: 'proud', lazy: 'proud', wild: 'proud'
};

const INTER = {
  reserved: {
    great: ['她没有立刻回答。很久之后才开口，声音比平时低：「……你不像他们说的那样。」\n\n这句话说完，她自己先别开了脸。'],
    ok: ['她答得很短，但答了。\n\n你注意到她说「嗯」的时候，眼睛是看着你的。'],
    partial: ['她听完了，点了点头，然后说：「我知道了。」\n\n就这三个字。但她没有走。'],
    fail: ['她一直没说话。\n\n最后她说：「这些事，不用你管。」然后转身去做别的了。']
  },
  open: {
    great: ['她说着说着笑起来，笑到一半忽然停住，捂住嘴：「我是不是说太多了。」\n\n「没有。」\n\n她低下头，耳朵红了。'],
    ok: ['她把手里的事放下，认真地听你说完，然后才开口。\n\n她的回答很平常，但你看得出她在心里过了好几遍。'],
    partial: ['她一直在点头，但你能看出来，她有些话说一半就咽回去了。\n\n临走时她说了句「谢谢你听我说」，声音很轻。'],
    fail: ['她努力想说点什么，但每次都只说半句，然后就换了话题。\n\n最后她说：「我是不是很笨。」\n\n你不知道该怎么回答，她就当你默认了。']
  },
  proud: {
    great: ['她瞪了你一眼，然后忽然笑出来，笑得毫不遮掩。\n\n「行啊。」她说，「你比我想的有点意思。」\n\n这句话大概是她能给出的最高评价。'],
    ok: ['「随你。」她嘴上这么说，但还是把位置挪了挪，给你腾出一块地方。\n\n你们谁也没再说话。风一直在吹。'],
    partial: ['她哼了一声，没答应也没拒绝。\n\n你以为这事算了，回头的时候却看见她把你说的那件事记在了木片上。'],
    fail: ['「你烦不烦。」\n\n她把东西往地上一摔，走了三步，又回来把东西捡起来，走了。']
  }
};

E.npcInteraction = function (npc) {
  npc.here = true;
  npc.lastSeen = S.stats.days;
  const blocks = [];
  const temper = N.TEMPERS.find(t => t.id === npc.temper) || N.TEMPERS[0];

  blocks.push({ t: 'p', v: '你找到' + npc.name + '的时候，她正在' + pick([
    '整理手里的东西', '低头做活', '看着远处', '和谁说着话', '一个人坐着'
  ]) + '。' + npc.habit + '。' });

  const opts = [
    {
      key: 'A', label: '问她自己的事——那个目标',
      hint: '好感 + · 可能触到她的秘密', act: () => E.interact(npc, 'goal')
    },
    {
      key: 'B', label: '不提别的，先帮她把手上的事做完',
      hint: '忠诚 + · 稳', act: () => E.interact(npc, 'help')
    },
    {
      key: 'C', label: '什么都不问，只是陪着待一会儿',
      hint: '安全 · 小幅好感', act: () => E.interact(npc, 'silent')
    }
  ];

  if (npc.rel.aff >= 60) {
    opts.push({
      key: 'D', label: '往前站一步',
      hint: '好感 + · 但也可能被推开',
      act: () => E.interact(npc, 'close')
    });
  }

  if (npc.rel.aff >= 70 && !npc.confessed) {
    opts.push({
      key: 'E', label: '把话说明白',
      hint: '表白 · 成败在此一举',
      act: () => E.confess(npc)
    });
  }

  if (npc.confessed && npc.rel.aff >= 85 && !npc.spouse) {
    opts.push({
      key: 'F', label: '求她留下来，做你的人',
      hint: '成婚 · 一旦成了就改不回来',
      act: () => E.propose(npc)
    });
  }

  if (npc.spouse) {
    opts.push({
      key: 'G', label: '跟她坐一会儿，说说领地的事',
      hint: '每月民心会因此高一点',
      act: () => E.interact(npc, 'spouse')
    });
  }

  E.pending = { type: 'npc', npc: npc };
  return E.emit(scene(head(), blocks, opts));
};

/* ---------- 表白 / 求婚 ---------- */

E.confess = function (npc) {
  const r = E.judge({ diff: 4, attr: 'charm' }, {});
  const blocks = [];
  let rel = {};

  if (r.tier === 'fail') {
    blocks.push({ t: 'p', v: '你把话说到一半就停下来了。\n\n她低着头，很久才开口：「……我知道。」\n\n「但我现在还不能应你。」\n\n她说完就走了，走得不算快，也没有回头。' });
    rel = { aff: -6 };
    npc.confessFail = (npc.confessFail || 0) + 1;
  } else {
    npc.confessed = true;
    if (r.tier === 'great') {
      blocks.push({ t: 'p', v: '「我要说的不是这个。」你说完，院子里安静下来。\n\n她站在那儿，手还攥着衣角，一动不动。\n\n过了很久，她才很轻地点了一下头。\n\n「……嗯。」\n\n就一个字。但那天她一直没敢看你。' });
      rel = { aff: 14, loy: 6 };
    } else {
      blocks.push({ t: 'p', v: '你把话说了。\n\n她听完，没有立刻回答，只是抬起头看了你很久。\n\n「你想清楚了？」\n\n「想清楚了。」\n\n「那就……先这样吧。」她说，耳朵是红的。' });
      rel = { aff: 9, loy: 4 };
    }
  }

  const relOut = E.addRel(npc, rel);
  blocks.push({ t: 'verdict', tier: r.tier, name: r.tier === 'fail' ? '她没有答应' : '她答应了', score: r.score, diff: r.diff, attr: r.attr });
  if (relOut.length) blocks.push({ t: 'deltas', list: [], rel: relOut });

  E.pending = { type: 'npc', npc: npc };
  const sc = E.actionScene();
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

E.propose = function (npc) {
  const r = E.judge({ diff: 3, attr: 'charm' }, {});
  const blocks = [];
  let rel = {};

  if (r.tier === 'fail') {
    blocks.push({ t: 'p', v: '她没有接话。\n\n「再等等。」她说，「不是不愿意，是……再等等。」\n\n她把桌上的东西一件一件摆正，摆了很久。' });
    rel = { aff: -3 };
  } else {
    npc.spouse = true;
    npc.isResident = true;
    npc.joined = true;
    blocks.push({ t: 'p', v: '仪式办得很小，就在小教堂里。薇拉点了六支蜡烛，比平时多了三支。\n\n村里的人都来了，站在门外，没有挤进来。\n\n她把手上那根麻绳解下来，系在你的手腕上。\n\n「这个就算数了。」她说。' });
    rel = { aff: 10, loy: 20 };
    S.morale = clamp(S.morale + 8, 0, 100);
    S.prestige = clamp(S.prestige + 5, 0, 100);
    S.log.push({ t: E.dateText(), text: '你与' + npc.name + '成婚。' });
  }

  const relOut = E.addRel(npc, rel);
  blocks.push({ t: 'verdict', tier: r.tier, name: r.tier === 'fail' ? '她没应' : '成婚', score: r.score, diff: r.diff, attr: r.attr });
  blocks.push({ t: 'deltas', list: npc.spouse ? [{ label: '民心', v: 8 }, { label: '威望', v: 5 }] : [], rel: relOut });

  E.pending = { type: 'npc', npc: npc };
  const sc = E.actionScene();
  sc.blocks = blocks; sc.append = true;
  return E.emit(sc);
};

E.interact = function (npc, kind) {
  const blocks = [];
  const cluster = CLUSTER[npc.temper] || 'open';
  let r, rel = {};

  const today = Math.floor(S.dayNum);
  const again = npc.lastTalkDay === today;
  npc.lastTalkDay = today;

  if (kind === 'goal') {
    r = E.judge({ diff: 3 }, {});
    blocks.push({ t: 'p', v: '「' + npc.goal + '。」你说，「这件事，我可以帮。」\n\n她抬眼看你。' });
    if (r.tier === 'fail' && chance(0.5)) {
      // 触到秘密
      blocks.push({ t: 'p', v: '「帮我？」她笑了一下，笑得不太好看，「你知道我为什么' + npc.secret.slice(0, 8) + '……算了。」\n\n她站起来，把话头掐断。' });
      blocks.push({ t: 'note', v: '你碰到了她的底线：' + npc.taboo });
      rel = { aff: -3, loy: -1 };
    } else {
      blocks.push({ t: 'p', v: pick(INTER[cluster][r.tier]) });
      rel = r.tier === 'great' ? { aff: 5, loy: 2 } : r.tier === 'ok' ? { aff: 3, loy: 1 } : r.tier === 'partial' ? { aff: 1 } : { aff: -2 };
    }
  } else if (kind === 'help') {
    r = E.judge({ diff: 2 }, {});
    blocks.push({ t: 'p', v: '你没问，直接上手。' + pick([
      '活不算重，但很琐碎。', '她愣了一下，没有拦。', '两个人做，比一个人快一半。'
    ]) });
    blocks.push({ t: 'p', v: pick(INTER[cluster][r.tier]) });
    rel = r.tier === 'great' ? { aff: 3, loy: 5 } : r.tier === 'ok' ? { loy: 4 } : r.tier === 'partial' ? { loy: 2 } : { aff: -1, loy: 1 };
  } else if (kind === 'silent') {
    r = E.judge({ diff: 1 }, {});
    blocks.push({ t: 'p', v: '你没说话。' + pick([
      '就这么站着。', '坐在离她两步远的地方。', '看着同一片天。'
    ]) + '\n\n时间过得很慢，但不难受。' });
    rel = r.tier === 'fail' ? { aff: 0 } : { aff: 1, loy: 2 };
  } else if (kind === 'spouse') {
    r = E.judge({ diff: 1 }, {});
    blocks.push({ t: 'p', v: pick([
      '你们坐在门口的石阶上，把这一季的账目一条一条过了一遍。',
      '她一边缝东西一边听你说，偶尔插一句，句句都在点子上。',
      '「明年开春，南山坡那片还能再开二十亩。」她说。'
    ]) });
    blocks.push({ t: 'p', v: pick([
      '有她在，很多事不用你一个人扛。',
      '她说话的时候不看你，但你知道她在听。',
      '天黑得早，屋里点了一盏灯。'
    ]) });
    rel = { aff: 1, loy: 3 };
  } else if (kind === 'close') {
    r = E.judge({ diff: 4 }, {});
    blocks.push({ t: 'p', v: pick([
      '你没有说话，往前站了一步。',
      '你伸出手，停在半途。',
      '你走近了一点，近到能听见她的呼吸。'
    ]) });
    if (r.tier === 'great') {
      blocks.push({ t: 'p', v: pick([
        '她没有退。反而抬起头，眼睛在很近的地方看着你。\n\n「……你知不知道自己在做什么。」她的声音很轻，但没有拦你的意思。',
        '她的手指蜷了一下，最后落在你的手背上。\n\n「就一会儿。」她说，「就一会儿。」',
        '她忽然笑了，那种从来没对别人用过的笑。\n\n然后她把额头抵在你肩上，很重地叹了口气。'
      ]) });
      rel = { aff: 4, loy: 2 };
    } else if (r.tier === 'ok') {
      blocks.push({ t: 'p', v: pick([
        '她没有躲，但也没有靠近。你们就这么站着，一直到风把她的头发吹到你脸上。',
        '她低下头，耳根红了。\n\n「……别看了。」',
        '她的手抬起来一半，又放下去。\n\n「慢慢来。」她说。'
      ]) });
      rel = { aff: 2 };
    } else if (r.tier === 'partial') {
      blocks.push({ t: 'p', v: '她往旁边让了半步。不是拒绝，只是让开了。\n\n「今天不行。」她说，语气不重。' });
      rel = { aff: -1 };
    } else {
      blocks.push({ t: 'p', v: pick([
        '她退开一步，动作很快，快得像被烫到。\n\n「不要。」',
        '「你把我当什么了。」她的声音冷下来，「我以为你不是那种人。」',
        '她的手按在你胸口，力气不小。\n\n「退后。」'
      ]) });
      rel = { aff: -6, loy: -2 };
    }
  } else {
    r = E.judge({ diff: 1 }, {});
    blocks.push({ t: 'p', v: '你没说话。' + pick([
      '就这么站着。', '坐在离她两步远的地方。', '看着同一片天。'
    ]) + '\n\n时间过得很慢，但不难受。' });
    rel = r.tier === 'fail' ? { aff: 0 } : { aff: 1, loy: 2 };
  }

  if (again) {
    blocks.push({ t: 'note', v: '今天已经说过不少话了。' });
    for (const k in rel) rel[k] = Math.round(rel[k] * 0.35);
  }
  const relOut = E.addRel(npc, rel);
  npc.talks++;

  if (npc.blocked) {
    blocks.push({ t: 'note', v: npc.name + '把话收住了。她需要时间——不是你需要，是她需要。' });
    npc.blocked = false;
  }

  // 里程碑
  if (npc.rel.aff >= 60 && npc.rel.loy >= 50 && !npc.flagHome) {
    npc.flagHome = true;
    blocks.push({ t: 'p', v: '那天她做了一件谁都没让她做的事。做完才发现你站在门口。\n\n她有点慌，说了句「顺手」，然后低下头。\n\n从这天起，' + npc.name + '把这里当成自己的地方了。' });
    S.prestige = clamp(S.prestige + 2, 0, 100);
  }
  if (npc.rel.aff >= 85 && npc.spouse && !npc.flagWed) {
    npc.flagWed = true;
    blocks.push({ t: 'p', v: '她把碗放下，看着你，很久没有说话。\n\n「我以前没想过会有这种日子。」她说。\n\n窗外在下雪。屋里很暖。' });
  }
  if (npc.rel.loy < 25 && npc.rel.aff < 20 && npc.talks >= 3 && !npc.flagLeaving && chance(0.25)) {
    npc.flagLeaving = true;
    blocks.push({ t: 'note', v: npc.name + '最近总在收拾东西。她开始考虑走了。' });
  }

  blocks.push({ t: 'verdict', tier: r.tier, name: TIERS[r.tier].name, score: r.score, attr: r.attr });
  if (relOut.length) blocks.push({ t: 'deltas', list: [], rel: relOut });

  blocks.push({ t: 'thought', npc: npc });

  S.turn++;
  if (S.ended) return E.emitEnding();

  E.pending = { type: 'action' };
  const sc = E.actionScene();
  sc.blocks = blocks;
  return E.emit(sc);
};

/* 内心想法刷新 */
E.refreshThought = function (npc) {
  const st = npc.rel.aff;
  const key = st >= 80 ? 'love' : st >= 60 ? 'warm' : st >= 40 ? 'close' : st >= 20 ? 'polite' : 'guard';
  let pool = N.THOUGHT[key].slice();
  if (st < 20 && npc.rel.loy < 25) pool = pool.concat(N.THOUGHT_GUARD_NEG);
  npc.thought = pick(pool);
  return npc.thought;
};

/* ===========================================================
   《鸦落谷》· 界面渲染
   =========================================================== */

const UI = {};

const $ = (id) => document.getElementById(id);

function el(tag, cls, html) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

/* ---------- 提示 ---------- */

let toastTimer = null;
UI.toast = function (msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
};

/* ---------- 顶栏 / 数值条 ---------- */

UI.renderTop = function () {
  const S = E.state();
  // 窄屏顶栏放不下「王历 317 年 · 3 月 1 日 · 春」，季节本来也会在正文里出现
  const narrow = typeof window !== 'undefined' && window.innerWidth <= 900;
  const date = E.dateText();
  const season = W.seasonName(S.time.m);
  $('clock').textContent = narrow ? date : date + ' · ' + season;
  $('clock').title = date + ' · ' + season;
  $('where').textContent = W.LOCS[S.loc].region + ' · ' + W.LOCS[S.loc].name;
  $('story').dataset.place = '';
};

UI.renderStats = function () {
  const S = E.state();
  const bar = $('statbar');
  bar.innerHTML = '';

  // 窄屏格子放不下「166 金 13 银」，换成紧凑写法
  const tight = (typeof window !== 'undefined' && window.innerWidth <= 900);

  const apDots = (() => {
    let s = '';
    for (let i = 0; i < S.apMax; i++) s += i < S.ap ? '●' : '○';
    return s;
  })();

  const army = E.armyStats();
  const items = [
    { k: '金库', v: tight ? W.moneyTight(S.copper) : W.moneyShort(S.copper), title: W.moneyShort(S.copper) },
    { k: '存粮', v: Math.round(S.food), unit: ' 石' },
    { k: '人口', v: S.people, unit: ' 人' },
    { k: '民心', v: S.morale, pct: S.morale },
    { k: '威望', v: E.presTotal(), pct: E.presTotal() },
    { k: '兵员', v: army.n + '<small>/' + army.cap + '</small>' },
    { k: '战力', v: army.power.toFixed(1) },
    { k: '行动', v: apDots, raw: true }
  ];

  items.forEach(it => {
    const d = el('div', 'stat');
    if (it.title) d.title = it.title;
    d.innerHTML = '<span class="k">' + it.k + '</span><span class="v">' + it.v +
      (it.unit ? '<small>' + it.unit + '</small>' : '') + '</span>';
    if (it.raw) { var vv = d.querySelector('.v'); if (vv) vv.style.cssText = 'font-size:14px;letter-spacing:3px'; }
    if (it.pct != null) {
      const b = el('div', 'bar');
      b.style.width = it.pct + '%';
      d.appendChild(b);
    }
    bar.appendChild(d);
  });
};

/* ---------- 场景渲染 ---------- */

UI.renderHead = function (h) {
  const st = $('story');
  const old = st.querySelector('.chapter-head');
  if (old) old.remove();
  const d = el('div', 'chapter-head');
  d.innerHTML = '<div class="date">' + h.date + '</div>' +
    '<div class="place">' + esc(h.place) + '</div>' +
    '<div class="weather">' + esc(h.weather || '') + '</div>';
  st.insertBefore(d, st.firstChild);
};

UI.renderBlock = function (b) {
  const frag = document.createDocumentFragment();

  if (b.t === 'p') {
    const parts = String(b.v).split('\n\n');
    const wrap = el('div', 'prose');
    parts.forEach(p => {
      if (!p.trim()) return;
      if (p.trim() === '---') { wrap.appendChild(el('p', 'beat', '❖')); return; }
      const cls = /^「/.test(p.trim()) ? 'p dialogue' : 'p';
      wrap.appendChild(el('p', cls, esc(p)));
    });
    frag.appendChild(wrap);
  }

  else if (b.t === 'verdict') {
    const d = el('div', 'verdict ' + b.tier);
    const attrName = b.attr && P.ATTR_MAP[b.attr] ? P.ATTR_MAP[b.attr].name + '判定' : '判定';
    d.innerHTML = '<span class="tag">' + b.name + '</span>' +
      '<span style="color:#8a755c;font-size:12px">' + attrName + '</span>' +
      (b.diff != null ? '<span class="num">' + (b.score > 0 ? '+' : '') + b.score + ' ／ 难度 ' + b.diff + '</span>' : '');
    frag.appendChild(d);
  }

  else if (b.t === 'deltas') {
    const d = el('div', 'deltas');
    let html = '';
    (b.list || []).forEach(c => {
      if (!c.v) return;
      const cls = c.v > 0 ? 'up' : 'down';
      const sign = c.v > 0 ? '+' : '';
      let label = c.label;
      if (c.label === '金库') {
        html += '<span class="' + cls + '">金库 ' + sign + W.moneyShort(c.v) + '</span>';
        return;
      }
      if (c.abs) {
        html += '<span class="' + cls + '">' + label + ' ' + sign + c.v + '</span>';
        return;
      }
      html += '<span class="' + cls + '">' + label + ' ' + sign + c.v + (c.unit || '') + '</span>';
    });
    (b.rel || []).forEach(r => {
      const cls = r.v > 0 ? 'up' : 'down';
      const sign = r.v > 0 ? '+' : '';
      const nm = { aff: '好感', loy: '忠诚' }[r.key];
      html += '<span class="' + cls + '">' + r.npc + ' · ' + nm + ' ' + sign + Math.round(r.v) + '</span>';
    });
    if (!html) return frag;
    d.innerHTML = html;
    frag.appendChild(d);
  }

  else if (b.t === 'note') {
    const d = el('div', 'deltas');
    d.innerHTML = '<span style="color:#8a755c">' + esc(b.v) + '</span>';
    frag.appendChild(d);
  }

  else if (b.t === 'npcIntro') {
    const n = b.npc;
    const box = el('div', 'npc open');
    const six = NPC.sixElements(n);
    let html = '<div class="name"><b>' + esc(n.name) + '</b><i>' + esc(n.role) + ' · ' + n.age + ' 岁</i>' +
      '<span class="aff">' + n.temperName + '</span></div><div class="detail">';
    six.forEach(s => {
      html += '<div class="row"><span class="k">' + s.k + '</span><span class="v">' + esc(s.v) + '</span></div>';
    });
    html += '</div>';
    box.innerHTML = html;
    box.querySelector('.name').onclick = () => box.classList.toggle('open');
    const wrap = el('div');
    wrap.style.margin = '14px 0 18px';
    wrap.appendChild(box);
    frag.appendChild(wrap);
  }

  else if (b.t === 'thought') {
    const n = b.npc;
    const t = E.refreshThought(n);
    const d = el('div', 'deltas');
    d.innerHTML = '<span style="color:#8a755c;font-style:italic">' + esc(n.name) + '心里：「' + esc(t) + '」</span>';
    frag.appendChild(d);
  }

  return frag;
};

UI.updateHead = function (h) {
  const old = $('story').querySelector('.chapter-head');
  if (!old) return;
  const d = old.querySelector('.date');
  const w = old.querySelector('.weather');
  if (d) d.textContent = h.date;
  if (w) w.textContent = h.weather || '';
};

UI.show = function (sc) {
  const S = E.state();
  const story = $('story');

  // 手机上正文和选项是同一条滚动流，滚动容器是 #app
  const scroller = UI.scroller();
  const single = scroller && scroller !== story;

  // 追加场景：先记下「新内容起点」在滚动容器里的坐标。
  // 不能直接用 story.scrollHeight —— 那是正文自己的高度，
  // 而 #app 的坐标系还包含顶栏和状态栏，直接套会偏上约 150px。
  let appendAt = 0;
  if (sc.append) {
    if (single) {
      const boxTop = scroller.getBoundingClientRect().top;
      appendAt = story.getBoundingClientRect().top - boxTop + scroller.scrollTop + story.scrollHeight;
    } else {
      appendAt = story.scrollHeight;
    }
  }

  if (!sc.append) {
    story.innerHTML = '';
    UI.renderHead(sc.head);
  } else {
    UI.updateHead(sc.head);
  }

  (sc.blocks || []).forEach(b => {
    const f = UI.renderBlock(b);
    if (f) story.appendChild(f);
  });

  UI.renderChoices(sc.options || []);
  UI.renderTop();
  UI.renderStats();
  UI.renderSide();
  UI.syncSticky();

  if (single) {
    scroller.scrollTop = sc.append ? Math.max(0, appendAt - 40) : 0;
  } else {
    const max = story.scrollHeight - story.clientHeight;
    story.scrollTop = Math.max(0, Math.min(appendAt, max));
  }
  UI.syncMore();
};

/* 当前真正在滚的那个元素 */
UI.scroller = function () {
  const app = document.getElementById('app');
  if (app && window.innerWidth <= 900) return app;
  return $('story');
};

/* 状态栏吸顶要贴在顶栏下沿，顶栏高度随字号/安全区变化，实时量一次 */
UI.syncSticky = function () {
  const app = document.getElementById('app');
  const tb = document.querySelector('.topbar');
  if (!app || !tb || window.innerWidth > 900) return;
  const h = Math.round(tb.getBoundingClientRect().height);
  if (h > 0) app.style.setProperty('--topbar-h', h + 'px');
};

/* 正文还有没读完时，底部给个渐隐提示 */
UI.syncMore = function () {
  const box = UI.scroller();
  if (!box) return;
  const more = box.scrollHeight - box.clientHeight - box.scrollTop > 8;
  box.classList.toggle('more', more);
};

const GROUP_LABEL = { now: '眼　前', meet: '与　人', act: '日　常', self: '自　身' };

UI.renderChoices = function (opts) {
  const box = $('choices');
  box.innerHTML = '';
  if (!opts.length) return;

  const ask = el('div', 'ask', '你要怎么做？');
  box.appendChild(ask);

  let lastGroup = null;
  opts.forEach((o, i) => {
    const g = o.group || null;
    if (g && g !== lastGroup) {
      const h = el('div', 'optgroup ' + g, GROUP_LABEL[g] || '');
      box.appendChild(h);
      lastGroup = g;
    }
    if (!g) lastGroup = null;

    const b = el('button', 'opt' + (o.key === '←' ? ' free' : '') + (g === 'now' ? ' urgent' : ''));
    b.innerHTML = '<span class="key">' + esc(o.key || (i + 1)) + '</span>' +
      '<span class="body">' + esc(o.label) +
      (o.hint ? '<span class="hint' + (o.warn ? ' warn' : '') + '">' + esc(o.hint) + '</span>' : '') +
      '</span>';
    if (o.disabled) b.disabled = true;
    b.onclick = () => {
      if (o.disabled) return;
      try { o.act(); } catch (e) { console.error(e); UI.toast('出错了：' + e.message); }
    };
    box.appendChild(b);
  });
};

      '<div class="mg"><i>骑</i>' + gname('mount') + '</div>' +
      '<div class="mg"><i>饰</i>' + gname('trinket', 0) + '</div>' +
      '<div class="mg"><i>饰</i>' + gname('trinket', 1) + '</div>' +
      '<div class="mg"><i>饰</i>' + gname('trinket', 2) + '</div>' +
      '</div>';

    // 队伍
    const pm = E.partyMembers();
    html += '<div style="height:1px;background:#dccbae;margin:8px 0 6px"></div>';
    html += '<div style="font-size:11px;color:#8a755c;font-family:var(--sans);letter-spacing:.1em;margin-bottom:4px">队伍 ' + pm.length + '/3</div>';

    if (tals.length) {
